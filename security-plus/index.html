{"kind":"mcq","d":4,"obj":"4.8","text":"A SOC wants to label its detections using a shared, publicly available catalogue of adversary tactics and techniques observed in real attacks. Which resource fits?","o":["MITRE ATT&CK","CVSS","Diamond Model of Intrusion Analysis","Common Vulnerabilities and Exposures"],"a":0,"e":"MITRE ATT&CK is a knowledge base of adversary tactics, the goals at each stage, and techniques, the methods used to reach them, derived from real-world observations. Each technique has a unique ID.","w":[null,{"t":"CVSS","d":"A framework that scores the severity of vulnerabilities.","x":"It rates vulnerabilities, not attacker behavior."},{"t":"Diamond Model of Intrusion Analysis","d":"A framework relating adversary, capability, infrastructure, and victim for an intrusion event.","x":"It analyzes the relationships in one event rather than cataloguing tactics and techniques."},{"t":"Common Vulnerabilities and Exposures","d":"A catalog of publicly known vulnerabilities.","x":"It lists flaws, not adversary behavior."}],"src":[["Palo Alto Networks, MITRE ATT&CK","https://paloaltonetworks.com/cyberpedia/what-is-mitre-attack"],["SY0-701 Study Guide (176 pp.), §12.3"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"During IKEv2 setup between two VPN gateways, which exchange negotiates the algorithms for the IKE security association and carries the Diffie-Hellman values and nonces, before the peers prove their identities?","o":["IKE_AUTH","CREATE_CHILD_SA","ESP","IKE_SA_INIT"],"a":3,"e":"RFC 7296 describes IKE_SA_INIT as the first exchange. It negotiates security parameters and sends nonces and Diffie-Hellman values. IKE_AUTH follows and proves each side's identity.","w":[{"t":"IKE_AUTH","d":"The second exchange, which transmits identities, proves knowledge of the secrets for those identities, and sets up the first AH or ESP Child SA.","x":"It happens after IKE_SA_INIT, once keys are available to protect it."},{"t":"CREATE_CHILD_SA","d":"An exchange used to create additional Child SAs and to rekey IKE SAs and Child SAs.","x":"It can run only after the two initial exchanges have completed."},{"t":"ESP","d":"The IPsec protocol that encrypts and authenticates the traffic itself.","x":"It protects data; it is not an IKE negotiation exchange."},null],"src":[["RFC 7296, IKEv2","https://datatracker.ietf.org/doc/rfc7296/"],["SY0-701 Study Guide (176 pp.), §5.10"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"Which statement about the Extensible Authentication Protocol (EAP) is accurate?","o":["It is a single authentication method that always uses passwords","It encrypts all wireless traffic with a shared passphrase","It is a framework that supports multiple authentication methods rather than being one method itself","It assigns IP addresses to wireless clients"],"a":2,"e":"RFC 3748 defines EAP as an authentication framework. Specific methods, such as EAP-TLS or PEAP, plug into it, and a backend authentication server such as RADIUS typically validates the credentials.","w":[{"t":"It is a single authentication method that always uses passwords","d":"One fixed mechanism for verifying a user.","x":"EAP does not fix the mechanism; methods can use certificates, smart cards, one-time passwords, or biometrics."},{"t":"It encrypts all wireless traffic with a shared passphrase","d":"A pre-shared key approach, as in WPA2-Personal.","x":"EAP is used for enterprise authentication, not for a shared passphrase."},null,{"t":"It assigns IP addresses to wireless clients","d":"The job of DHCP.","x":"EAP handles authentication, not address assignment."}],"src":[["RFC 3748, EAP","https://www.rfc-editor.org/rfc/rfc3748"],["SY0-701 Study Guide (176 pp.), §9.3"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A company wants the strongest 802.1X Wi-Fi authentication, where both the authentication server and every client device prove their identity with certificates. Which EAP method fits?","o":["PEAP","EAP-TLS","EAP-TTLS","EAP-FAST"],"a":1,"e":"EAP-TLS performs mutual certificate authentication, so a certificate is required on both the server and the client.","w":[{"t":"PEAP","d":"An EAP method that builds an encrypted TLS tunnel and needs only a server-side certificate.","x":"Clients authenticate inside the tunnel, typically with a password, not with a certificate."},null,{"t":"EAP-TTLS","d":"A tunneled method that needs a server certificate; a client certificate is optional.","x":"It does not require client certificates."},{"t":"EAP-FAST","d":"A method that uses a protected access credential (PAC) instead of certificates.","x":"It avoids certificates rather than requiring them on both sides."}],"src":[["Purple, EAP methods compared","https://www.purple.ai/en-us/guides/metodi-eap-a-confronto-peap-eap-tls-eap-ttls-e-eap-fast"],["SY0-701 Study Guide (176 pp.), §9.3"]]},
{"kind":"mcq","d":4,"obj":"4.1","text":"A web server sends a response header telling browsers to contact the site only over HTTPS and to refuse to let users click through certificate warnings. Which header is this?","o":["HTTP Strict Transport Security (HSTS)","Content Security Policy","Cache-Control","DKIM signature"],"a":0,"e":"RFC 6797 lets a site declare itself accessible only through secure connections, using the Strict-Transport-Security header. Browsers rewrite insecure references to HTTPS and end the connection on secure transport errors.","w":[null,{"t":"Content Security Policy","d":"A header that controls which sources a page may load scripts and other content from.","x":"It restricts content sources; it does not force HTTPS."},{"t":"Cache-Control","d":"A header that sets whether and how browsers may cache responses.","x":"It governs caching, not transport security."},{"t":"DKIM signature","d":"A digital signature on email verified through a DNS record.","x":"It applies to email, not web responses."}],"src":[["RFC 6797, HSTS","https://rfc-editor.org/rfc/rfc6797"],["SY0-701 Study Guide (176 pp.), §11.5"]]},
{"kind":"mcq","d":4,"obj":"4.1","text":"A site's response header limits scripts to run only from trusted domains and ignores inline scripts, which reduces the impact of cross-site scripting. Which header is this?","o":["HTTP Strict Transport Security","Cache-Control","Sender Policy Framework","Content Security Policy (CSP)"],"a":3,"e":"CSP is an added layer of security that helps detect and mitigate attacks such as cross-site scripting and data injection. A compatible browser executes only scripts from sources the policy trusts.","w":[{"t":"HTTP Strict Transport Security","d":"A header that forces browsers to use HTTPS for the site.","x":"It protects the transport, not which scripts may run."},{"t":"Cache-Control","d":"A header that controls browser caching of responses.","x":"It is about storing responses, not restricting scripts."},{"t":"Sender Policy Framework","d":"A DNS-based list of servers allowed to send email for a domain.","x":"It applies to email sender verification, not web pages."},null],"src":[["MDN, Content Security Policy","https://developer.mozilla.org/pt-BR/docs/Web/HTTP/CSP"],["SY0-701 Study Guide (176 pp.), §11.5"]]},
{"kind":"mcq","d":4,"obj":"4.3","text":"A tester feeds an application large volumes of random, malformed, and unexpected input while monitoring for crashes and memory errors. Which technique is this?","o":["Static code analysis","Stress testing","Fuzzing","Manual code review"],"a":2,"e":"Fuzzing deliberately sends invalid or random data to see how the application responds. It tests input handling and can expose crashes, memory leaks, and other flaws.","w":[{"t":"Static code analysis","d":"Scanning source code for known issues without running the program.","x":"Fuzzing runs the application and watches what happens."},{"t":"Stress testing","d":"Checking performance under extreme load or usage.","x":"The goal here is invalid input, not heavy volume of valid use."},null,{"t":"Manual code review","d":"Developers reading source code to find oversights.","x":"No code is being read; the program is executed with bad input."}],"src":[["Zilliz, fuzz testing","https://zilliz.com/glossary/fuzz-testing"],["SY0-701 Study Guide (176 pp.), §11.5"]]},
{"kind":"mcq","d":5,"obj":"5.5","text":"A payroll processor gives its customers an attestation report on controls that could affect those customers' financial statements. Which report is this?","o":["SOC 2","SOC 1","SOC 3","Gap analysis"],"a":1,"e":"A SOC 1 report covers controls at a service organization that are relevant to its customers' financial reporting, such as payroll or payment processing.","w":[{"t":"SOC 2","d":"A detailed report on security-related controls against the Trust Services Criteria.","x":"It addresses security and related criteria, not financial reporting."},null,{"t":"SOC 3","d":"A summary of a SOC 2 attestation suitable for the general public.","x":"It summarizes SOC 2 rather than addressing financial statements."},{"t":"Gap analysis","d":"A comparison of current controls against a framework.","x":"It is an internal assessment, not an attestation report."}],"src":[["Secureframe, SOC 1 vs 2 vs 3","https://secureframe.com/hub/soc-2/soc-1-vs-soc-2-vs-soc-3"],["SY0-701 Study Guide (176 pp.), §15.5"]]},
{"kind":"mcq","d":5,"obj":"5.5","text":"A cloud provider wants to post a short summary of its security attestation on its public website for prospects. Which report is designed for general distribution?","o":["SOC 3","SOC 2","SOC 1","SOC 2 Type 1"],"a":0,"e":"SOC 3 is a less detailed summary of a SOC 2 attestation and can be distributed freely. It leaves out the detailed description of the auditor's control tests.","w":[null,{"t":"SOC 2","d":"A detailed report that is usually shared only with customers and prospects under an NDA.","x":"It is detailed and restricted, so it is not meant for a public website."},{"t":"SOC 1","d":"A report on controls relevant to customers' financial statements.","x":"It addresses financial reporting, not a public security summary."},{"t":"SOC 2 Type 1","d":"A report on the design of controls at one point in time.","x":"It is still the detailed, restricted SOC 2 format."}],"src":[["Secureframe, SOC 1 vs 2 vs 3","https://secureframe.com/hub/soc-2/soc-1-vs-soc-2-vs-soc-3"],["SY0-701 Study Guide (176 pp.), §14.2, §15.5"]]},
{"kind":"mcq","d":3,"obj":"3.3","text":"A company rolls out a data loss prevention (DLP) policy. Before blocking anything, the team wants it to log and report violations only, so they can tune the rules. Which setting should they use first?","o":["Block","Quarantine","Tombstone","Monitor or alert only"],"a":3,"e":"Starting in monitor-only mode lets a team see what a policy would catch and tune it before enforcement. Blocking and quarantine can then be enabled.","w":[{"t":"Block","d":"Prevents the user from copying or sending the file, while the user keeps access to the original.","x":"That enforces the policy immediately, which is what the team wants to delay."},{"t":"Quarantine","d":"Denies the user access to the original file.","x":"It removes access, which could disrupt work before the rules are tuned."},{"t":"Tombstone","d":"Quarantines the original and replaces it with a file explaining the violation and how to release it.","x":"It is an enforcement action that changes the files."},null],"src":[["DLPTest, what is DLP","https://dlptest.com/what-is-data-loss-prevention-dlp/"],["SY0-701 Study Guide (176 pp.), §16.3"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"Which IPsec protocol authenticates as much of the IP header as possible, but cannot protect header fields that change in transit, such as the TTL?","o":["ESP in transport mode","Internet Key Exchange","Authentication Header (AH)","Secure Socket Tunneling Protocol"],"a":2,"e":"AH provides integrity and data origin authentication for IP datagrams and covers as much of the IP header as possible. Fields that change in transit cannot be predicted by the sender, so AH cannot protect them.","w":[{"t":"ESP in transport mode","d":"ESP inserted after the original IP header, protecting the payload.","x":"ESP's integrity check covers the ESP header, payload, and trailer, not the original IP header."},{"t":"Internet Key Exchange","d":"The protocol that authenticates peers and negotiates keys and security associations.","x":"IKE sets up keys; it does not itself authenticate IP datagrams."},null,{"t":"Secure Socket Tunneling Protocol","d":"A Microsoft VPN protocol that tunnels PPP over TLS.","x":"It is not part of IPsec."}],"src":[["RFC 4302, IP Authentication Header","https://rfc-editor.org/rfc/rfc4302.html"],["RFC 4303, IP Encapsulating Security Payload","https://rfc-editor.org/rfc/rfc4303"],["SY0-701 Study Guide (176 pp.), §5.10"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"Two hosts on a private network need to protect the data portion of their traffic with ESP. The IP header of each packet is not encrypted. Which IPsec mode is this?","o":["Tunnel mode","Transport mode","Split tunnel","Out-of-band management"],"a":1,"e":"In transport mode, only the payload is protected and the original IP header remains in the clear. It secures communications between hosts on a private network.","w":[{"t":"Tunnel mode","d":"The whole IP packet is encrypted and encapsulated with a new IP header, typically between gateways.","x":"Here the original header stays visible and no new header is added."},null,{"t":"Split tunnel","d":"A VPN setup where the client reaches the internet directly rather than through the corporate network.","x":"It describes traffic routing for remote-access VPN clients, not an IPsec mode."},{"t":"Out-of-band management","d":"Managing devices over a path separate from production traffic.","x":"It is about management channels, not encryption mode."}],"src":[["RFC 4303, IP Encapsulating Security Payload","https://rfc-editor.org/rfc/rfc4303"],["SY0-701 Study Guide (176 pp.), §5.10"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"In IKE, which stage establishes the identity of the two hosts and uses Diffie-Hellman key agreement to create a secure channel for later negotiation?","o":["Phase 1","Phase 2","ESP trailer","AH integrity check value"],"a":0,"e":"Phase 1 authenticates the hosts, using certificates or pre-shared keys, and performs key agreement to create a secure channel. Phase 2 then uses that channel to agree on ciphers and key sizes for AH or ESP. In IKEv2 these steps are called the IKE_SA_INIT and IKE_AUTH exchanges.","w":[null,{"t":"Phase 2","d":"The stage that negotiates which ciphers and key sizes the IPsec session will use with AH or ESP.","x":"It relies on the secure channel Phase 1 has already built."},{"t":"ESP trailer","d":"Padding and fields added to the end of an ESP packet.","x":"It is a packet component, not a negotiation stage."},{"t":"AH integrity check value","d":"The HMAC that AH places in its header to verify the packet.","x":"It is a packet field, not a negotiation stage."}],"src":[["RFC 7296, IKEv2","https://datatracker.ietf.org/doc/rfc7296/"],["SY0-701 Study Guide (176 pp.), §5.10"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A router supports Wi-Fi Protected Setup (WPS) with an 8-digit PIN. Which action BEST mitigates the known brute-force weakness of the PIN method?","o":["Lengthen the Wi-Fi passphrase","Hide the SSID","Enable a captive portal","Disable WPS"],"a":3,"e":"The WPS PIN is checked in two halves and the access point reveals when the first half is right, which cuts the guesses needed from 10^8 to about 11,000. CERT's recommended workaround is to disable WPS.","w":[{"t":"Lengthen the Wi-Fi passphrase","d":"Using a longer shared passphrase for WPA2-Personal.","x":"The PIN path does not require guessing the passphrase, so its length does not change the number of PIN guesses."},{"t":"Hide the SSID","d":"Stopping the access point from broadcasting its network name.","x":"It does not remove the WPS PIN feature or reduce the guesses it takes."},{"t":"Enable a captive portal","d":"Redirecting clients to a browser login page after connecting.","x":"It adds a web login, not protection for the PIN method."},null],"src":[["CERT VU#723755, WPS PIN brute force","https://www.kb.cert.org/vuls/id/723755"],["SY0-701 Study Guide (176 pp.), §9.3"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"An attacker repeatedly sends spoofed deauthentication frames so that clients keep dropping off a Wi-Fi network. Which feature protects against forged frames like these?","o":["A longer WPA2 passphrase","Captive portal","Protected management frames (802.11w)","Network access control posture checks"],"a":2,"e":"By default, 802.11 management frames are unauthenticated, so they can be spoofed. 802.11w protects frames such as disassociation and deauthentication against forgery and replay.","w":[{"t":"A longer WPA2 passphrase","d":"A stronger shared secret for deriving encryption keys.","x":"The passphrase does not make management frames authenticated."},{"t":"Captive portal","d":"A browser page used to authenticate to a hotspot.","x":"It authenticates users after connecting; it does not protect management frames."},null,{"t":"Network access control posture checks","d":"Checks of a device's health before it is allowed onto the network.","x":"The attack disconnects clients regardless of their posture."}],"src":[["Cisco, Protected Management Frames","https://www.cisco.com/en/US/products/ps6366/products_tech_note09186a0080ad6b8d.shtml"],["SY0-701 Study Guide (176 pp.), §9.3"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An employee plugs an unauthorized wireless access point into a wall jack in a conference room. What is this device called?","o":["Evil twin","Rogue access point","Bluejacking","Wi-Fi jamming"],"a":1,"e":"A rogue access point is one installed on the network without authorization. It can be found through physical inspection or with Wi-Fi analyzers.","w":[{"t":"Evil twin","d":"A rogue access point that masquerades as a legitimate one, often with a similar SSID.","x":"The scenario describes an unauthorized device, not one impersonating the company's network."},null,{"t":"Bluejacking","d":"Sending unsolicited messages to a discoverable Bluetooth device.","x":"It involves Bluetooth messaging, not an unauthorized Wi-Fi device."},{"t":"Wi-Fi jamming","d":"Overpowering a legitimate signal to deny service.","x":"The device here adds access rather than disrupting it."}],"src":[["SY0-701 Study Guide (176 pp.), §9.3"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"Two partner organizations let each other's users sign in to Wi-Fi with their home credentials by joining their authentication servers into a hierarchy. What is this called?","o":["RADIUS federation","Captive portal","WPA3 SAE","Pre-shared key"],"a":0,"e":"Most EAP implementations use a RADIUS server to validate credentials. With RADIUS federation, multiple organizations allow one another's users access by joining their RADIUS servers into a hierarchy or mesh.","w":[null,{"t":"Captive portal","d":"A browser login page used with open Wi-Fi authentication.","x":"It is a web login, not a trust arrangement between authentication servers."},{"t":"WPA3 SAE","d":"The password authenticated key exchange used by WPA3-Personal.","x":"It is a personal-mode handshake, not an arrangement between organizations."},{"t":"Pre-shared key","d":"A passphrase shared by everyone using the network.","x":"It involves no per-user credentials or partner servers."}],"src":[["SY0-701 Study Guide (176 pp.), §9.3"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An attacker tries to find two different inputs that produce the same hash value, taking advantage of the fact that matches appear with fewer attempts than most people expect. Which attack is this?","o":["Rainbow table attack","Dictionary attack","Brute force attack","Birthday attack"],"a":3,"e":"A birthday attack targets hash functions by finding collisions. It is based on the birthday paradox, where the chance of a match in a group is far higher than intuition suggests. It could be used to forge a digital signature.","w":[{"t":"Rainbow table attack","d":"Using a precomputed table of passwords and their hashes to look up a captured hash.","x":"It finds the password for a hash, not two inputs that share one."},{"t":"Dictionary attack","d":"Hashing common words and phrases to find a match for a captured hash.","x":"It guesses a password from a word list; it does not look for collisions."},{"t":"Brute force attack","d":"Trying every possible combination to match a captured hash.","x":"It searches the full space for one plaintext, not for pairs of colliding inputs."},null],"src":[["Kaspersky Encyclopedia, birthday attack","https://encyclopedia.kaspersky.com/glossary/birthday-attack/"],["SY0-701 Study Guide (176 pp.), §3.1"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"A cloud analytics provider needs to run calculations on customer data that stays encrypted the whole time, so the provider never sees the underlying values. Which technology enables this?","o":["Steganography","Tokenization","Homomorphic encryption","Key stretching"],"a":2,"e":"Homomorphic encryption allows computations to be performed directly on encrypted data without decrypting it first. Only the data owner can decrypt the result.","w":[{"t":"Steganography","d":"Hiding the existence of a message inside another file.","x":"It hides data in a cover file; it does not allow computation on encrypted values."},{"t":"Tokenization","d":"Replacing data with a random token and keeping the original in a separate vault.","x":"Calculations on tokens are not possible without retrieving the original values."},null,{"t":"Key stretching","d":"Repeatedly processing a password-derived key to slow brute-force attacks.","x":"It strengthens password-derived keys and does not process data."}],"src":[["Fortinet, homomorphic encryption","https://www.fortinet.com/resources/cyberglossary/homomorphic-encryption"],["SY0-701 Study Guide (176 pp.), §3.5"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"A company stores a copy of its encryption keys with a trusted third party so encrypted data can be recovered if the key holder is unavailable. What is this arrangement called?","o":["Key stretching","Key escrow","Certificate revocation","Rekeying"],"a":1,"e":"Key escrow means a trusted third party holds a copy of a key, which is released under predefined conditions. It helps recover encrypted data when the original key is lost.","w":[{"t":"Key stretching","d":"Repeatedly converting a password-derived key into a longer, more random key.","x":"It slows attacks; it does not store keys with a third party."},null,{"t":"Certificate revocation","d":"Declaring a certificate no longer valid.","x":"It invalidates a certificate rather than preserving a key."},{"t":"Rekeying","d":"Generating a new key when renewing a certificate instead of reusing the existing one.","x":"It creates a new key and does not store a copy with an outside party."}],"src":[["Twingate, key escrow","https://twingate.com/blog/glossary/key-escrow"],["SY0-701 Study Guide (176 pp.), §3.8"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"A PKI keeps its root certificate authority powered off and disconnected from the network, bringing it online only to sign intermediate CA certificates. Why?","o":["A compromised root would undermine every certificate beneath it, so exposure is minimized","It lets the root issue end-user certificates faster","It removes the need to publish revocation information","It allows the root certificate to be self-signed"],"a":0,"e":"The root is the single trust anchor for the hierarchy. Keeping it offline reduces the chance of compromise, while intermediate CAs handle day-to-day issuance.","w":[null,{"t":"It lets the root issue end-user certificates faster","d":"Faster everyday issuance.","x":"Intermediate CAs, not the offline root, handle routine issuance."},{"t":"It removes the need to publish revocation information","d":"No certificate revocation list would be required.","x":"Revocation information is still needed; even the root's list is published."},{"t":"It allows the root certificate to be self-signed","d":"A root certificate that vouches for itself.","x":"Root certificates are self-signed whether or not the CA is offline."}],"src":[["AppViewX, offline root CA practices","https://helpcenter.appviewx.com/frontend/web/Published%20Guides/2023.1.0/PKI/User%20Guide/webhelp-responsive/PKI_Standard_Practices_offline_root_ca.html"],["SY0-701 Study Guide (176 pp.), §3.6"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"A company wants one certificate to secure www.example.com, mail.example.com, and shop.example.com. Which certificate type fits?","o":["Extended validation certificate","Code signing certificate","Self-signed certificate","Wildcard certificate"],"a":3,"e":"A wildcard certificate, such as *.example.com, issued to the parent domain is accepted as valid for all its subdomains.","w":[{"t":"Extended validation certificate","d":"A web server certificate issued after more rigorous checks of the subject's legal identity.","x":"It describes how thoroughly identity was checked, not coverage of subdomains."},{"t":"Code signing certificate","d":"A certificate used to sign software.","x":"It is for software signatures, not securing web servers."},{"t":"Self-signed certificate","d":"A certificate signed by its own key rather than by a CA.","x":"Browsers will not trust it by default, and it does not address subdomains."},null],"src":[["SY0-701 Study Guide (176 pp.), §3.7"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"A ledger stores records as blocks. Each block's hash includes the hash of the previous block, so changing an old record breaks every later block. What is this technology?","o":["Steganography","Homomorphic encryption","Blockchain","Digital signature"],"a":2,"e":"A blockchain secures an expanding list of records using cryptography. Each block is hashed, and the previous block's hash is added to the next block's calculation, cryptographically linking them.","w":[{"t":"Steganography","d":"Hiding a message's existence inside a cover file.","x":"It hides data and does not link records by hash."},{"t":"Homomorphic encryption","d":"Computing on data without decrypting it.","x":"It does not chain records together."},null,{"t":"Digital signature","d":"A hash combined with a private key to authenticate a sender and prove integrity.","x":"It proves who sent one message; it does not link a series of blocks."}],"src":[["SY0-701 Study Guide (176 pp.), §3.5"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"An analyst hides a text message inside the pixels of a photograph so that nobody realizes a message exists. Which technique is this?","o":["Obfuscation","Steganography","Hashing","Tokenization"],"a":1,"e":"Steganography obscures the presence of a message, for example by hiding it in a picture. The container file is called the cover text.","w":[{"t":"Obfuscation","d":"Making a message or code difficult to understand.","x":"The message may stay visible and is merely confusing; here its existence is concealed."},null,{"t":"Hashing","d":"Producing a fixed-length one-way digest of data.","x":"It does not hide a message in another file."},{"t":"Tokenization","d":"Replacing data with an unrelated random value.","x":"It substitutes values in a database, not within a picture."}],"src":[["SY0-701 Study Guide (176 pp.), §3.5"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An attacker sets an option in the IP header that pre-determines the path a packet takes through the network, so as to spoof addresses and bypass router and firewall filters. Which technique is this?","o":["Source routing","Route injection","ARP poisoning","MAC cloning"],"a":0,"e":"Source routing uses an IP header option to pre-determine a packet's route. It can be used to spoof IP addresses and bypass router or firewall filtering.","w":[null,{"t":"Route injection","d":"Feeding spoofed routing information to routers so traffic is misdirected.","x":"That changes routers' tables; source routing sets the path inside each packet."},{"t":"ARP poisoning","d":"Sending unsolicited ARP replies so hosts map an IP address to the attacker's MAC.","x":"It operates on the local network's address mappings, not IP header options."},{"t":"MAC cloning","d":"Changing an adapter's hardware address to an arbitrary one.","x":"It alters a hardware address, not the packet's route."}],"src":[["SY0-701 Study Guide (176 pp.), §5.4"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"Attackers announce IP address ranges they do not own, so that internet traffic for those ranges is sent to them. Which attack is this?","o":["DNS cache poisoning","ARP poisoning","Source routing","BGP hijacking"],"a":3,"e":"BGP lacks built-in security features, so attacks such as BGP hijacking remain possible. Organizations cannot rely on a secure protocol and must design around this lack.","w":[{"t":"DNS cache poisoning","d":"Inserting false records into a DNS resolver's cache.","x":"It affects name resolution, not announcements of IP ranges between networks."},{"t":"ARP poisoning","d":"Spoofing MAC-to-IP mappings on a local network.","x":"It works inside a local broadcast domain, not between internet routing domains."},{"t":"Source routing","d":"An IP header option that predetermines a packet's route.","x":"It acts on individual packets rather than on routing announcements."},null],"src":[["SY0-701 Study Guide (176 pp.), §5.6"]]},
{"kind":"mcq","d":4,"obj":"4.4","text":"In SNMP, which operation lets a device's agent notify the management system of a notable event, such as a port failure, without waiting to be polled?","o":["Management Information Base","Simple bind","Trap","Port mirroring"],"a":2,"e":"The SNMP agent can initiate a trap to inform the management system of a notable event. The agent also maintains a Management Information Base with activity statistics.","w":[{"t":"Management Information Base","d":"The database the agent keeps of statistics about the device's activity.","x":"It stores data; it is not the message that announces an event."},{"t":"Simple bind","d":"An LDAP authentication method that sends a distinguished name and password.","x":"It belongs to LDAP, not SNMP."},null,{"t":"Port mirroring","d":"Copying switch traffic to a monitoring port.","x":"It copies traffic and does not send event notifications."}],"src":[["SY0-701 Study Guide (176 pp.), §11.1"]]},
{"kind":"mcq","d":4,"obj":"4.4","text":"Which statement describes traditional syslog messages sent over UDP port 514?","o":["They are encrypted by default","They are not protected for confidentiality, and lost datagrams are not detected","They use TCP port 22","They are guaranteed to be delivered"],"a":1,"e":"RFC 5426 states the UDP transport does not provide confidentiality of messages in transit and has no mechanism to detect and correct loss of datagrams. Rsyslog and syslog-ng can use TCP and secure connections.","w":[{"t":"They are encrypted by default","d":"Encryption protects message contents in transit.","x":"The UDP mapping provides no confidentiality."},null,{"t":"They use TCP port 22","d":"The port used by SSH and SFTP.","x":"Syslog over UDP uses port 514."},{"t":"They are guaranteed to be delivered","d":"Reliable delivery with retransmission.","x":"UDP does not detect or correct lost datagrams."}],"src":[["RFC 5426, Syslog over UDP","https://datatracker.ietf.org/doc/rfc5426"],["SY0-701 Study Guide (176 pp.), §12.5"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"Which statement describes Network Time Security (NTS)?","o":["It relies on TLS to authenticate that time information comes from a trusted server and has not changed in transit","It encrypts the time data so eavesdroppers cannot read it","It replaces NTP with SSH tunnels","It has been widely adopted as the default"],"a":0,"e":"NTS is a secure version of NTP that relies on TLS. It focuses on authentication of the time source rather than protecting the time data itself.","w":[null,{"t":"It encrypts the time data so eavesdroppers cannot read it","d":"Confidentiality of the time values.","x":"NTS focuses on authentication, not protecting the time data."},{"t":"It replaces NTP with SSH tunnels","d":"Carrying time traffic inside SSH.","x":"NTS uses TLS, not SSH."},{"t":"It has been widely adopted as the default","d":"Common deployment on most networks.","x":"The guide notes it has not been widely adopted."}],"src":[["SY0-701 Study Guide (176 pp.), §5.6"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"An administrator wants directory authentication traffic secured with a TLS tunnel instead of using plaintext LDAP on port 389. Which port does LDAP Secure (LDAPS) use?","o":["389","123","514","636"],"a":3,"e":"LDAPS installs a digital certificate on the server and uses it to set up a secure tunnel for the credential exchange, on port 636. Standard LDAP uses port 389.","w":[{"t":"389","d":"The port used by standard LDAP.","x":"That is the unencrypted default, not LDAPS."},{"t":"123","d":"The UDP port used by NTP.","x":"It is for time synchronization."},{"t":"514","d":"The UDP port usually used by syslog.","x":"It is for log messages."},null],"src":[["SY0-701 Study Guide (176 pp.), §11.1"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A mail client submits outgoing messages to its provider's server using STARTTLS. Which port is traditionally used by clients to submit messages for delivery by an SMTP server?","o":["25","636","587","990"],"a":2,"e":"Port 587 is used by mail clients to submit messages. Port 25 is for relay between SMTP servers, and some providers use port 465 for submission over implicit TLS.","w":[{"t":"25","d":"The port used for message relay between SMTP servers.","x":"It is server-to-server relay rather than client submission."},{"t":"636","d":"The port used by LDAPS.","x":"It belongs to directory services."},null,{"t":"990","d":"The port used for implicit FTPS control connections.","x":"It belongs to file transfer."}],"src":[["SY0-701 Study Guide (176 pp.), §11.3"]]},
{"kind":"mcq","d":4,"obj":"4.1","text":"A company buys phones and assigns a model to each employee. Employees may also use the phone for personal email and social media. Which deployment model is this?","o":["Corporate owned, business only (COBO)","Corporate owned, personally enabled (COPE)","Bring your own device (BYOD)","Choose your own device (CYOD)"],"a":1,"e":"With COPE, the enterprise owns the device and issues it to an employee, and both can install applications. Personal use is allowed.","w":[{"t":"Corporate owned, business only (COBO)","d":"The company owns the device and it may be used only for company business.","x":"Personal use is permitted here."},null,{"t":"Bring your own device (BYOD)","d":"The employee owns the device.","x":"The company owns these phones."},{"t":"Choose your own device (CYOD)","d":"Similar to COPE, but the employee picks from a list of approved devices.","x":"Here the company assigns the model."}],"src":[["NIST SP 1800-21B, mobile device security","https://www.nccoe.nist.gov/publication/1800-21/VolB"],["SY0-701 Study Guide (176 pp.), §10.3"]]},
{"kind":"mcq","d":4,"obj":"4.1","text":"An administrator wants to set policies for which apps can process corporate data and to prevent data from being moved to personal apps. Which tool does this?","o":["Mobile application management (MAM)","Mobile device management (MDM)","Geofencing","Full device encryption"],"a":0,"e":"MAM sets policies for the apps that can process corporate data and prevents data transfer to personal apps. MDM, by contrast, sets device-level policies.","w":[null,{"t":"Mobile device management (MDM)","d":"Sets device policies for authentication, features such as the camera, and connectivity, and enables remote wipe.","x":"It manages the device; the scenario focuses on controlling apps and data flow."},{"t":"Geofencing","d":"A virtual boundary based on real-world geography.","x":"It restricts functions by location, not data transfers between apps."},{"t":"Full device encryption","d":"Encrypting all user data on a device.","x":"It protects data at rest, not app data policies."}],"src":[["NIST SP 1800-21B, mobile device security","https://www.nccoe.nist.gov/publication/1800-21/VolB"],["SY0-701 Study Guide (176 pp.), §10.3"]]},
{"kind":"mcq","d":4,"obj":"4.1","text":"A company wants to separate corporate data from personal data on an employee's phone so it can manage only the work portion. Which technique fits?","o":["Remote wipe","Rooting","Tethering","Containerization"],"a":3,"e":"Containerization lets the employer manage the portion of the device that interfaces with the corporate network, and it can enforce storage segmentation.","w":[{"t":"Remote wipe","d":"Resetting a lost device to factory settings or clearing its data.","x":"It deletes data; it does not separate work and personal areas."},{"t":"Rooting","d":"Gaining super-administrative access to an Android device, often with custom firmware.","x":"It subverts device security rather than organizing it."},{"t":"Tethering","d":"Sharing a phone's internet connection with another device.","x":"It concerns connectivity."},null],"src":[["NIST SP 1800-21B, mobile device security","https://www.nccoe.nist.gov/publication/1800-21/VolB"],["SY0-701 Study Guide (176 pp.), §10.3"]]},
{"kind":"mcq","d":2,"obj":"2.3","text":"A user boots an iPhone with a patched kernel to gain administrative control and remove vendor restrictions. What is this called?","o":["Rooting","Sideloading","Jailbreaking","Carrier unlocking"],"a":2,"e":"Jailbreaking is associated with iOS and is accomplished by booting the device with a patched kernel. It subverts built-in security and permanently disables certain security features.","w":[{"t":"Rooting","d":"The Android equivalent, typically using custom firmware.","x":"The device in the scenario runs iOS."},{"t":"Sideloading","d":"Installing apps from sources other than the official app store.","x":"The user is modifying the OS, not installing apps."},null,{"t":"Carrier unlocking","d":"Removing restrictions that tie a device to one carrier.","x":"It frees the device from a carrier; it does not give administrative control."}],"src":[["SY0-701 Study Guide (176 pp.), §8.5"]]},
{"kind":"mcq","d":2,"obj":"2.3","text":"An employee installs an Android app by downloading an APK file from a website instead of the official app store. Which term describes this?","o":["Rooting","Sideloading","Jailbreaking","Carrier unlocking"],"a":1,"e":"Sideloading is installing apps from sources other than the platform's official store. It bypasses store vetting and raises security risk.","w":[{"t":"Rooting","d":"Gaining super-administrative access to Android using custom firmware.","x":"The user only installed an app."},null,{"t":"Jailbreaking","d":"Removing iOS restrictions by booting a patched kernel.","x":"That is iOS-specific and changes the OS."},{"t":"Carrier unlocking","d":"Removing a lock to a single carrier.","x":"It relates to the carrier, not to app sources."}],"src":[["SY0-701 Study Guide (176 pp.), §8.5"]]},
{"kind":"mcq","d":3,"obj":"3.1","text":"An engineer needs a hardware controller for a specific embedded application that can still be reconfigured after manufacture. Which device fits?","o":["Field programmable gate array (FPGA)","Application-specific integrated circuit (ASIC)","System on chip (SoC)","Real-time operating system"],"a":0,"e":"An FPGA's structure is not fully set at manufacture, so a customer can configure the logic for a specific application. An ASIC is fixed at fabrication.","w":[null,{"t":"Application-specific integrated circuit (ASIC)","d":"A chip designed for one function; once fabricated it cannot be changed.","x":"It cannot be reconfigured after manufacture."},{"t":"System on chip (SoC)","d":"A system with processors, controllers, and devices on a single chip.","x":"It integrates components; it is not defined by reprogrammable logic."},{"t":"Real-time operating system","d":"Software that handles time-critical tasks.","x":"It is software, not a hardware logic device."}],"src":[["Numato Lab, FPGA vs ASIC","https://numato.com/blog/differences-between-fpga-and-asics"],["SY0-701 Study Guide (176 pp.), §6.6"]]},
{"kind":"mcq","d":3,"obj":"3.1","text":"Which low-power cellular technology for IoT supports higher bandwidth, up to about 1 Mbps, than its narrowband counterpart?","o":["Narrowband IoT (NB-IoT)","Bluetooth","Point-to-point microwave","LTE Machine Type Communication (LTE-M)"],"a":3,"e":"LTE-M is a low-power system that supports about 1 Mbps. NB-IoT is a low-power version of LTE with a much lower data rate and is aimed at devices that must run for years on a battery.","w":[{"t":"Narrowband IoT (NB-IoT)","d":"A low-power version of the LTE standard with a very low data rate.","x":"It supports far lower bandwidth."},{"t":"Bluetooth","d":"A personal area network protocol for connecting devices to peripherals.","x":"It is not a cellular technology."},{"t":"Point-to-point microwave","d":"A high-gain link between two sites, used as backhaul.","x":"It is a backhaul link, not an IoT device radio."},null],"src":[["Ezurio, NB-IoT vs LTE-M","https://www.ezurio.com/resources/blog/cellular-nb-iot-vs-lte-m-understanding-differences"],["SY0-701 Study Guide (176 pp.), §6.6"]]},
{"kind":"mcq","d":5,"obj":"5.4","text":"Which standard in the ISO 27000 series is the one an organization can be audited and certified against?","o":["ISO 27002","ISO 27701","ISO 27001","ISO 27017"],"a":2,"e":"ISO 27001 sets out requirements for an information security management system and is the standard in the series that can be certified. Unlike NIST publications, it must be purchased.","w":[{"t":"ISO 27002","d":"Describes the security controls an organization can choose from.","x":"It provides control guidance, not certification requirements."},{"t":"ISO 27701","d":"Extends the management system to privacy information management.","x":"It is an extension, not the main certifiable standard."},null,{"t":"ISO 27017","d":"Provides controls for cloud security.","x":"It is cloud-specific guidance."}],"src":[["Secureframe, ISO 27000 series","https://secureframe.com/blog/iso-27000.md"],["SY0-701 Study Guide (176 pp.), §14.2"]]},
{"kind":"mcq","d":5,"obj":"5.4","text":"Which ISO standard adds personal data and privacy management to an organization's information security management system?","o":["ISO 27001","ISO 27701","ISO 27002","ISO 31000"],"a":1,"e":"ISO 27701 focuses on privacy and extends the management system into a privacy information management system.","w":[{"t":"ISO 27001","d":"The central certifiable standard for an information security management system.","x":"It covers information security generally, not the privacy extension."},null,{"t":"ISO 27002","d":"A catalog of security controls.","x":"It lists controls and does not address privacy management."},{"t":"ISO 31000","d":"Guidance for enterprise risk management.","x":"It addresses risk generally, not privacy."}],"src":[["Secureframe, ISO 27000 series","https://secureframe.com/blog/iso-27000.md"],["SY0-701 Study Guide (176 pp.), §14.2"]]},
{"kind":"mcq","d":5,"obj":"5.2","text":"Which ISO standard offers overall guidance for enterprise risk management that covers financial, customer service, and legal liability factors as well as cybersecurity, and is not certifiable?","o":["ISO 31000","ISO 27001","ISO 27701","ISO 27002"],"a":0,"e":"ISO 31000 is guidance for enterprise-level risk management rather than a certifiable management system standard. ISO 27001 is the certifiable information security standard.","w":[null,{"t":"ISO 27001","d":"A certifiable standard for an information security management system.","x":"It focuses on information security and can be certified."},{"t":"ISO 27701","d":"An extension for privacy information management.","x":"It is limited to privacy."},{"t":"ISO 27002","d":"A set of security controls.","x":"It is not an enterprise risk framework."}],"src":[["Readynez, ISO 27001 vs ISO 31000","https://www.readynez.com/en/blog/understanding-iso-27001-vs-iso-31000"],["SY0-701 Study Guide (176 pp.), §14.2"]]},
{"kind":"mcq","d":5,"obj":"5.2","text":"Ten identical devices run for 50 hours each. Two of them fail. Using total operating time divided by the number of failures, what is the MTBF?","o":["50 hours","500 hours","25 hours","250 hours"],"a":3,"e":"Total operating time is 10 devices x 50 hours = 500 hours. Divided by 2 failures, the MTBF is 250 hours.","w":[{"t":"50 hours","d":"The runtime of each device, or the MTTF when dividing 500 by 10 devices.","x":"It divides by the number of devices instead of the number of failures."},{"t":"500 hours","d":"The total operating time.","x":"It was not divided by the number of failures."},{"t":"25 hours","d":"A value from dividing by 20.","x":"There are 2 failures and 10 devices; no calculation gives 20."},null],"src":[["FlowFuse, MTTF vs MTBF vs MTTR","https://flowfuse.com/blog/2025/12/what-is-mttf/"],["SY0-701 Study Guide (176 pp.), §15.3"]]},
{"kind":"mcq","d":5,"obj":"5.2","text":"Which metric is used to describe the expected lifetime of a non-repairable asset, such as a hard drive?","o":["Mean time between failures (MTBF)","Mean time to repair (MTTR)","Mean time to failure (MTTF)","Recovery time objective"],"a":2,"e":"MTTF applies to assets that are replaced rather than repaired. MTBF is used for repairable assets, and MTTR measures repair time.","w":[{"t":"Mean time between failures (MTBF)","d":"The average operating time between failures of a repairable system.","x":"It applies to repairable systems."},{"t":"Mean time to repair (MTTR)","d":"The time taken to restore a failed system to full operation.","x":"It measures repair, not lifetime."},null,{"t":"Recovery time objective","d":"The target time to restore operations after a disaster.","x":"It is a recovery goal, not a failure measure."}],"src":[["FlowFuse, MTTF vs MTBF vs MTTR","https://flowfuse.com/blog/2025/12/what-is-mttf/"],["SY0-701 Study Guide (176 pp.), §15.3"]]},
{"kind":"mcq","d":5,"obj":"5.5","text":"After an audit, the auditor states that circumstances prevented forming any opinion on the target. Which audit opinion is this?","o":["Unqualified","Disclaimer","Qualified","Adverse"],"a":1,"e":"A disclaimer means the auditor was not able to render an opinion due to certain named circumstances.","w":[{"t":"Unqualified","d":"A clean report where the auditor has no significant reservations.","x":"An opinion was rendered here."},null,{"t":"Qualified","d":"Rendered when there are minor deviations or scope limitations.","x":"The auditor gave an opinion with reservations; here none was given."},{"t":"Adverse","d":"Rendered when the target does not conform to the control objectives or evidence is misleading.","x":"It is a negative opinion, not an absence of one."}],"src":[["SY0-701 Study Guide (176 pp.), §15.5"]]},
{"kind":"mcq","d":5,"obj":"5.3","text":"A vendor announces that a product is no longer supported and will no longer receive patches. Which term describes the product's status?","o":["End of service life (EOSL)","End of life (EOL)","Extended support","Mainstream support"],"a":0,"e":"An end of service life system is one that is no longer supported by its developer or vendor. End of life is the earlier phase after sales stop.","w":[null,{"t":"End of life (EOL)","d":"The phase after a manufacturer discontinues sales, when support and spares become more limited.","x":"Support is limited, not fully ended."},{"t":"Extended support","d":"A support phase in which, for Windows, only security updates are provided.","x":"Security updates are still provided."},{"t":"Mainstream support","d":"The standard support phase of a product.","x":"Patches and updates are still available."}],"src":[["SY0-701 Study Guide (176 pp.), §15.4"]]},
{"kind":"mcq","d":4,"obj":"4.8","text":"An investigator needs to image a suspect drive without altering any data or metadata on it. Which tool should be placed between the drive and the workstation?","o":["Faraday cage","Tamper-evident bag","Data loss prevention agent","Write blocker"],"a":3,"e":"A write blocker prevents any data from being changed by filtering write commands, helping keep the source disk clean while a forensic image is taken.","w":[{"t":"Faraday cage","d":"An enclosure that blocks electromagnetic signals.","x":"It blocks radio signals and does not stop writes to a drive."},{"t":"Tamper-evident bag","d":"A sealed bag showing whether evidence has been opened.","x":"It protects stored items physically, not the drive's data during imaging."},{"t":"Data loss prevention agent","d":"Software that enforces rules on data transfers.","x":"It governs data movement, not writes during imaging."},null],"src":[["SY0-701 Study Guide (176 pp.), §12.7"]]},
{"kind":"mcq","d":4,"obj":"4.8","text":"After making a forensic copy of a drive, how should an investigator verify that the copy matches the original?","o":["Compare file names and sizes","Open several files from the copy","Compute message digests of the original and the copy and compare them","Compare the last-modified dates"],"a":2,"e":"NIST SP 800-86 describes verifying integrity by computing the message digest of the original and copied data and comparing the digests. Examination is then done on the copy.","w":[{"t":"Compare file names and sizes","d":"Checking that visible attributes match.","x":"Files can differ in content while names and sizes match."},{"t":"Open several files from the copy","d":"A spot check that the data is readable.","x":"It cannot prove every bit is identical."},null,{"t":"Compare the last-modified dates","d":"Checking timestamps on the files.","x":"Timestamps do not prove the content is identical."}],"src":[["NIST SP 800-86, forensic techniques","https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-86.pdf"],["SY0-701 Study Guide (176 pp.), §12.7"]]},
{"kind":"mcq","d":4,"obj":"4.8","text":"Which acquisition method copies a disk while the host is still running, with the drawback that the data on the disk will have changed and the result may not be accepted as legal evidence?","o":["Static acquisition by pulling the plug","Live acquisition","Static acquisition by shutting down","Carving"],"a":1,"e":"Live acquisition may capture more evidence and reduce impact on services, but the data on the actual disks changes while it is copied, so it may not be legally acceptable.","w":[{"t":"Static acquisition by pulling the plug","d":"Disconnecting power so the storage device is likely preserved in a clean state.","x":"It stops the host; it does not copy while running, and it risks corrupting data."},null,{"t":"Static acquisition by shutting down","d":"Powering the host down normally before copying.","x":"Malware may detect shutdown and perform anti-forensics."},{"t":"Carving","d":"Recovering file fragments from a disk.","x":"It is an analysis technique, not an acquisition method."}],"src":[["SY0-701 Study Guide (176 pp.), §12.7"]]},
{"kind":"mcq","d":4,"obj":"4.8","text":"An investigator collects logs from servers in different time zones. What must be established to build a consistent timeline?","o":["How each timestamp is calculated and its offset from UTC","The hash of every log file","The owner of each server","The retention period of each log"],"a":0,"e":"Different systems record local time or UTC, and offsets can vary with daylight saving time. Evidence collectors must establish how each timestamp is calculated and note the offset from UTC.","w":[null,{"t":"The hash of every log file","d":"A digest proving each file is unchanged.","x":"It proves integrity but does not align time zones."},{"t":"The owner of each server","d":"Who is responsible for the system.","x":"It does not align events in time."},{"t":"The retention period of each log","d":"How long logs are kept.","x":"It does not affect how timestamps are interpreted."}],"src":[["SY0-701 Study Guide (176 pp.), §12.6"]]},
{"kind":"mcq","d":4,"obj":"4.8","text":"A legal team uses a suite that identifies and de-duplicates files, tags evidence with standard labels, and makes evidence available to both plaintiff and defendant. What is this process?","o":["Legal hold","Chain of custody","Security information and event management","E-discovery"],"a":3,"e":"E-discovery filters relevant evidence from forensic data and stores it in a format usable at trial. Suites de-duplicate files, search, tag, secure, and disclose evidence.","w":[{"t":"Legal hold","d":"The requirement to preserve information that may be relevant to a case.","x":"It preserves data; it does not process or tag it."},{"t":"Chain of custody","d":"Documentation of who handled evidence and when.","x":"It tracks handling, not filtering or tagging."},{"t":"Security information and event management","d":"A tool for real-time event collection and correlation.","x":"It analyzes events rather than preparing legal evidence."},null],"src":[["SY0-701 Study Guide (176 pp.), §12.6"]]},
{"kind":"mcq","d":4,"obj":"4.8","text":"An analyst examines a disk for file fragments that may represent deleted or overwritten files. What is the process of recovering them called?","o":["Order of volatility","Data sanitization","Carving","Legal hold"],"a":2,"e":"Data recovery involves analyzing a disk for file fragments that may represent deleted or overwritten files. The recovery process is referred to as carving.","w":[{"t":"Order of volatility","d":"The sequence for collecting evidence from most to least volatile.","x":"It concerns collection order, not recovering fragments."},{"t":"Data sanitization","d":"Removing data so it cannot be recovered.","x":"It does the opposite."},null,{"t":"Legal hold","d":"The duty to preserve possible evidence.","x":"It is a preservation obligation."}],"src":[["SY0-701 Study Guide (176 pp.), §12.7"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"In the protection ring model, which ring is the most privileged and provides direct access to hardware, where kernel-level rootkits aim to operate?","o":["Ring 3","Ring 0","Ring 1","Ring 2"],"a":1,"e":"Ring 0 is the most privileged and gives direct hardware access. User-mode processes run in ring 3, and drivers and I/O processes may run in rings 1 or 2. Kernel-level rootkits target the operating system's core.","w":[{"t":"Ring 3","d":"Where user-mode processes run.","x":"It is the least privileged."},null,{"t":"Ring 1","d":"A ring where drivers and I/O processes may run.","x":"It has less privilege than ring 0."},{"t":"Ring 2","d":"Another ring where drivers and I/O processes may run.","x":"It also has less privilege than ring 0."}],"src":[["Kaspersky, what is a rootkit","https://www.kaspersky.com/resource-center/definitions/what-is-rootkit"],["SY0-701 Study Guide (176 pp.), §13.4"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"A backdoor mimics a legitimate remote control program but is designed to operate covertly, giving an attacker control over the host. What is it?","o":["Remote access Trojan (RAT)","Logic bomb","Keylogger","Adware"],"a":0,"e":"A RAT is backdoor malware that mimics legitimate remote control programs but is built to operate covertly. A backdoor bypasses authentication to provide remote administrative control.","w":[null,{"t":"Logic bomb","d":"Code that triggers a harmful action when a condition is met.","x":"It waits for a condition rather than providing remote control."},{"t":"Keylogger","d":"Spyware that records keystrokes.","x":"It steals input but does not give remote control."},{"t":"Adware","d":"Grayware that reconfigures browsers and displays ads.","x":"It is not covert remote control."}],"src":[["SY0-701 Study Guide (176 pp.), §13.4"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"A group of compromised computers is controlled by the same malware and manipulated by a \"herder.\" What is this group called?","o":["Honeynet","Rootkit","Worm","Botnet"],"a":3,"e":"A group of bots under the control of the same malware is a botnet, and it can be manipulated by the herder program.","w":[{"t":"Honeynet","d":"An entire decoy network used to attract attackers.","x":"It is a defensive trap, not compromised machines."},{"t":"Rootkit","d":"Malware that hides its presence while keeping privileged access.","x":"It describes malware on one host rather than a group of controlled machines."},{"t":"Worm","d":"Malware that replicates over networks without user action.","x":"It describes spreading behavior, not centrally controlled machines."},null],"src":[["SY0-701 Study Guide (176 pp.), §13.4"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An attacker submits a URL parameter that causes a vulnerable web server to fetch data from an internal cloud metadata service the attacker cannot reach directly. Which attack is this?","o":["Cross-site request forgery","Directory traversal","Server-side request forgery (SSRF)","Clickjacking"],"a":2,"e":"SSRF occurs when user-controllable data is used to build a target URL, letting the attacker make the server send requests on their behalf. Defenses include allowlisting destinations and not passing user input into request functions.","w":[{"t":"Cross-site request forgery","d":"Tricking a user's browser into sending a forged request to a site where they are logged in.","x":"The forged request here comes from the server, not a user's browser."},{"t":"Directory traversal","d":"Using ../ sequences to read files outside the web root.","x":"It reads local files; it does not make the server send requests."},null,{"t":"Clickjacking","d":"Hiding a malicious layer over a trusted page to capture clicks.","x":"It targets users' clicks, not server-side requests."}],"src":[["Invicti, SSRF","https://invicti.com/server-security-software/web-server-security-software"],["SY0-701 Study Guide (176 pp.), §13.11"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"A developer accidentally publishes an API key in a public repository, and an attacker uses it to perform any action the key allows. Which weakness is this?","o":["Lack of input validation","Ineffective secrets management","Replay attack","Denial of service"],"a":1,"e":"Ineffective secrets management lets threat actors discover an API key and perform any action authorized to that key.","w":[{"t":"Lack of input validation","d":"Allowing arbitrary parameters to be inserted into API methods.","x":"The attacker used a legitimate key, not crafted input."},null,{"t":"Replay attack","d":"Resubmitting a captured session token to re-establish a session.","x":"The attacker did not capture a token in transit."},{"t":"Denial of service","d":"Bombarding an API with bogus calls.","x":"The goal was authorized access, not overload."}],"src":[["SY0-701 Study Guide (176 pp.), §13.10"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An attacker disguises a malicious file path, for example by using percent-encoded characters, so that the server's filters do not recognize it. Which technique takes advantage of how the server converts between representations of a path?","o":["Canonicalization attack","Buffer overflow","Replay attack","Session hijacking"],"a":0,"e":"Canonicalization is how a server converts different representations of a resource into the simplest form it processes. Attackers use encodings to disguise malicious input, such as directory traversal.","w":[null,{"t":"Buffer overflow","d":"Writing more data than a memory buffer can hold.","x":"It relates to memory, not representations of paths."},{"t":"Replay attack","d":"Reusing a captured token to re-establish a session.","x":"It involves tokens, not encoded paths."},{"t":"Session hijacking","d":"Taking over an active session.","x":"It targets a session, not an encoded path."}],"src":[["SY0-701 Study Guide (176 pp.), §13.11"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An attacker uses a word list but adds numbers and symbols to each word, combining dictionary guessing with brute force. Which attack is this?","o":["Rainbow table attack","Password spraying","Brute force attack","Hybrid attack"],"a":3,"e":"A hybrid attack uses a combination of brute force and dictionary attacks.","w":[{"t":"Rainbow table attack","d":"Looking up hashes in a precomputed table.","x":"It uses precomputed tables rather than modifying words as it goes."},{"t":"Password spraying","d":"Trying one common password against many accounts.","x":"It spreads one guess across accounts and does not mutate words."},{"t":"Brute force attack","d":"Trying every possible combination.","x":"It does not start from a word list."},null],"src":[["SY0-701 Study Guide (176 pp.), §13.6"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"A normal user finds a flaw that lets them view another regular user's records. Which type of privilege escalation is this?","o":["Vertical privilege escalation","Race condition","Horizontal privilege escalation","Replay attack"],"a":2,"e":"Horizontal privilege escalation means a user or application accesses data or functions intended for another user at the same level.","w":[{"t":"Vertical privilege escalation","d":"Gaining functions or data that should not be available at their level, such as administrator rights.","x":"The access gained is at the same level as the user's own."},{"t":"Race condition","d":"A flaw where outcome depends on the timing of events.","x":"It describes a timing flaw, not a type of escalation."},null,{"t":"Replay attack","d":"Reusing a captured token.","x":"It does not describe gaining access to another user's data through a flaw."}],"src":[["SY0-701 Study Guide (176 pp.), §13.8"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An attacker harvests a user's cached NTLM password hash from a compromised host and uses it to authenticate to other systems without ever cracking it. Which attack is this?","o":["Dictionary attack","Pass the hash","Birthday attack","Rainbow table attack"],"a":1,"e":"Pass the hash harvests an account's cached credentials so the attacker can use them on other systems. The hash can be used without cracking it to authenticate to protocols that accept NTLM hashes.","w":[{"t":"Dictionary attack","d":"Hashing common words to find a match for a captured hash.","x":"The attacker here does not guess a password."},null,{"t":"Birthday attack","d":"Finding two inputs with the same hash.","x":"It targets hash collisions."},{"t":"Rainbow table attack","d":"Using precomputed hashes to find the password for a hash.","x":"The hash is used directly, with no table lookup."}],"src":[["SY0-701 Study Guide (176 pp.), §8.4"]]},
{"kind":"mcq","d":2,"obj":"2.3","text":"A program calculates a value that exceeds the fixed upper bound of its integer type, and a large positive number turns negative. Which vulnerability is this?","o":["Integer overflow","Buffer overflow","Memory leak","Null pointer dereference"],"a":0,"e":"An integer overflow causes software to calculate a value that exceeds the integer's bounds, and can make a positive number become negative.","w":[null,{"t":"Buffer overflow","d":"Passing data that overfills a memory buffer.","x":"The problem is a number outside its bounds, not data overfilling a buffer."},{"t":"Memory leak","d":"A process fails to release memory it no longer needs.","x":"It consumes memory over time; it does not wrap numbers."},{"t":"Null pointer dereference","d":"Reading or writing memory through an invalid or null pointer.","x":"It involves an invalid memory reference."}],"src":[["SY0-701 Study Guide (176 pp.), §8.4"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A network team is moving to IPv6. What is the main reason that network address translation (NAT) is no longer needed to stretch a limited supply of addresses?","o":["IPsec is mandatory for every IPv6 connection","IPv6 uses 32-bit addresses with improved subnetting","IPv6 has network address translation built into the protocol","IPv6 addresses are 128 bits long, which provides an address space large enough to give every device a unique address"],"a":3,"e":"RFC 8200 states that IPv6 increases the address size from 32 bits to 128 bits. That space is large enough that address conservation is no longer a reason to translate private addresses. Note that IPv6 does not force IPsec on every connection: RFC 8504 makes IPsec support a SHOULD for IPv6 nodes, not a MUST.","w":[{"t":"IPsec is mandatory for every IPv6 connection","d":"A claim that all IPv6 traffic must be protected by IPsec.","x":"RFC 8504 says support for the IPsec architecture is a SHOULD for IPv6 nodes, and it does not require that it be used. It also has nothing to do with address supply."},{"t":"IPv6 uses 32-bit addresses with improved subnetting","d":"The address length used by IPv4.","x":"IPv6 addresses are 128 bits. The 32-bit length belongs to IPv4."},{"t":"IPv6 has network address translation built into the protocol","d":"A feature that rewrites addresses as packets cross a boundary.","x":"IPv6 solves address shortage with a larger address space rather than with translation."},null],"src":[["RFC 8200: Internet Protocol, Version 6 (IPv6) Specification","https://rfc-editor.org/rfc/rfc8200"],["RFC 8504: IPv6 Node Requirements","https://www.rfc-editor.org/rfc/rfc8504.html"],["SY0-701 Study Guide (176 pp.), §5.1"]]},
{"kind":"mcq","d":3,"obj":"3.1","text":"A power plant runs ICS/SCADA equipment that is rarely patched and cannot tolerate unplanned downtime. Which design measure is most important for reducing the risk of attacks that reach the plant from the corporate network?","o":["Merge the control and corporate networks into one flat network so that everything can be monitored in one place","Run active vulnerability scans against every controller during production","Separate the control network from the corporate network with segmentation, firewalls, and a DMZ","Treat confidentiality as the top priority and availability as secondary"],"a":2,"e":"Guidance summarized from NIST SP 800-82 recommends logical separation between corporate and operational technology (OT) networks, with firewalls enforcing approved traffic and a DMZ so that there is no direct traffic between the two. This protects equipment that is hard to patch without touching it.","w":[{"t":"Merge the control and corporate networks into one flat network so that everything can be monitored in one place","d":"A single network with no internal boundaries.","x":"It gives corporate threats a direct path to the control equipment, the opposite of the recommended separation."},{"t":"Run active vulnerability scans against every controller during production","d":"Probing devices on the network to find weaknesses.","x":"Industrial systems can be fragile, and the same guidance says passive discovery is generally safer than active scanning for legacy equipment."},null,{"t":"Treat confidentiality as the top priority and availability as secondary","d":"Ranking the CIA triad with confidentiality first.","x":"The study guide says industrial systems usually put availability and integrity ahead of confidentiality."}],"src":[["Secureframe: NIST 800-82 guide to securing operational technology (summary)","https://secureframe.com/blog/nist-800-82"],["SY0-701 Study Guide (176 pp.), §6.7"]]},
{"kind":"mcq","d":5,"obj":"5.1","text":"The study guide says a board of directors must provide the standard of care that a prudent person would provide under the same conditions. Which term describes this duty?","o":["Data sovereignty","Due care","Risk transference","Right to audit"],"a":1,"e":"The study guide lists exercising due care, meaning the standard of care a prudent person would provide in the same conditions, among the responsibilities of the board of directors.","w":[{"t":"Data sovereignty","d":"The principle that data is subject to the laws of the country where it is stored.","x":"It concerns legal jurisdiction over data, not a standard of care for directors."},null,{"t":"Risk transference","d":"Shifting the financial impact of a risk to another party, such as an insurer.","x":"It is a risk response, not a duty of the board."},{"t":"Right to audit","d":"A contract clause letting a customer inspect a vendor's controls.","x":"It is a third-party agreement term, not a governance duty."}],"src":[["SY0-701 Study Guide (176 pp.), §14.3"]]},
{"kind":"mcq","d":2,"obj":"2.2","text":"Attackers compromise a company that remotely administers IT systems for dozens of small businesses, then use its trusted access to reach every one of those customers. Which threat vector does this BEST describe?","o":["A managed service provider (MSP) used as an initial access vector","Watering hole","Typosquatting","Removable media"],"a":0,"e":"CISA's joint advisory warns that threat actors can use a vulnerable MSP as an initial access vector to multiple victim networks, exploiting the trust relationships between provider and customer.","w":[null,{"t":"Watering hole","d":"Infecting a website that a specific group is known to visit.","x":"No website is booby-trapped here. The attacker reaches customers through the provider's own trusted access."},{"t":"Typosquatting","d":"Registering look-alike domains that depend on typing mistakes.","x":"No look-alike domain is involved."},{"t":"Removable media","d":"Spreading malware through USB drives or similar devices.","x":"The access path is the provider's remote connection, not a physical device."}],"src":[["CISA Alert AA22-131a: Protecting Against Cyber Threats to Managed Service Providers and their Customers","https://www.cisa.gov/ncas/alerts/aa22-131a"],["SY0-701 Study Guide (176 pp.), §2.7"]]},
{"kind":"mcq","d":2,"obj":"2.2","text":"An MSP's staff have remote access to the networks of many customers. Which combination of measures does CISA's advisory recommend to limit the damage if the MSP is compromised?","o":["Reuse one administrator credential across all customers so that access is easy to audit","Leave MSP accounts active after a contract ends in case work resumes","Give the MSP full administrative rights everywhere so incidents can be fixed faster","Enforce MFA on MSP accounts, apply least privilege, and keep customer environments segregated from one another"],"a":3,"e":"The advisory recommends MFA on all MSP accounts that access customer environments, restricting those accounts to the systems they manage, and segregating customer networks. It also says to remove access when a contract ends.","w":[{"t":"Reuse one administrator credential across all customers so that access is easy to audit","d":"A shared account used on many systems.","x":"The advisory warns against reusing admin credentials across customers, since one theft then opens every network."},{"t":"Leave MSP accounts active after a contract ends in case work resumes","d":"Keeping dormant access in place.","x":"The advisory says to disable unused accounts, including MSP accounts after a contract ends."},{"t":"Give the MSP full administrative rights everywhere so incidents can be fixed faster","d":"Broad privileges for the provider.","x":"That is the opposite of least privilege, and it widens the damage a compromise can cause."},null],"src":[["CISA Alert AA22-131a: Protecting Against Cyber Threats to Managed Service Providers and their Customers","https://www.cisa.gov/ncas/alerts/aa22-131a"]]},
{"kind":"mcq","d":2,"obj":"2.2","text":"A relative forwards a news story to the family group chat. The story is false, but the relative believed it and had no intention to deceive anyone. How does CISA classify this kind of information?","o":["Disinformation","Malinformation","Misinformation","Pretexting"],"a":2,"e":"CISA defines misinformation as false information that is not created or shared with the intention of causing harm.","w":[{"t":"Disinformation","d":"False information deliberately created to mislead, harm, or manipulate a person, group, organization, or country.","x":"The relative had no intent to deceive, so it is not disinformation."},{"t":"Malinformation","d":"Information that is based on fact but used out of context to mislead, harm, or manipulate.","x":"The story is false, not a true fact taken out of context."},null,{"t":"Pretexting","d":"A social engineering technique that uses an invented scenario to obtain information or access.","x":"Nobody is building a false scenario to extract something from the family."}],"src":[["CISA: Foreign Influence Operations and Disinformation (definitions)","https://cisa.gov/mdm"]]},
{"kind":"mcq","d":2,"obj":"2.2","text":"A threat actor deliberately builds and spreads fake stories about a company's product safety, hoping to damage its reputation and its stock price. How does CISA classify this kind of information?","o":["Misinformation","Disinformation","Malinformation","Typosquatting"],"a":1,"e":"CISA defines disinformation as false information deliberately created to mislead, harm, or manipulate a person, social group, organization, or country.","w":[{"t":"Misinformation","d":"False information that is not created or shared with the intention of causing harm.","x":"The stories were created on purpose to cause harm."},null,{"t":"Malinformation","d":"Information based on fact but used out of context to mislead, harm, or manipulate.","x":"The stories are fabricated, not true facts used out of context."},{"t":"Typosquatting","d":"Registering look-alike domains that depend on typing mistakes.","x":"It is a domain trick and does not describe deliberate false content."}],"src":[["CISA: Foreign Influence Operations and Disinformation (definitions)","https://cisa.gov/mdm"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An attacker positioned between a client and a server interferes with the connection setup so that the two sides agree on an older, weaker protocol version than both support. Which attack is this?","o":["Downgrade attack","Replay attack","Session hijacking","Bluejacking"],"a":0,"e":"A downgrade attack forces a connection onto an older, weaker protocol version or cipher. The study guide notes that TLS 1.3 mitigated downgrade attacks by removing the insecure features and algorithms of earlier versions.","w":[null,{"t":"Replay attack","d":"Capturing valid data and sending it again later.","x":"The attacker is changing the negotiated version, not resending captured messages."},{"t":"Session hijacking","d":"Taking over an established session by stealing its token.","x":"The attack targets version negotiation before the session exists."},{"t":"Bluejacking","d":"Sending unsolicited messages to nearby Bluetooth devices.","x":"It is a Bluetooth nuisance attack and unrelated to protocol negotiation."}],"src":[["SY0-701 Study Guide (176 pp.), §11.2"]]},
{"kind":"mcq","d":2,"obj":"2.5","text":"A technician is hardening a new switch and router before connecting them to the production network. Which action belongs in that hardening?","o":["Keep the vendor's default password so that support can always log in","Leave every management service enabled in case it is needed later","Share one administrator login among the whole network team","Change the default credentials and disable unnecessary services and interfaces"],"a":3,"e":"The study guide lists changing default credentials and disabling unnecessary services and interfaces as hardening steps for switches and routers. CISA has said that default credentials are a top weakness that threat actors exploit.","w":[{"t":"Keep the vendor's default password so that support can always log in","d":"Leaving the factory password unchanged.","x":"Factory passwords are widely known, and CISA identifies default credentials as a top weakness that attackers exploit."},{"t":"Leave every management service enabled in case it is needed later","d":"Running all available services and interfaces.","x":"Each unused service adds attack surface, so unneeded ones should be disabled."},{"t":"Share one administrator login among the whole network team","d":"A single account used by many people.","x":"Shared logins remove accountability and are not a hardening step."},null],"src":[["SY0-701 Study Guide (176 pp.), §9.2"],["CyberScoop: CISA urges vendors to get rid of default passwords","https://cyberscoop.com/?p=78583"]]},
{"kind":"mcq","d":2,"obj":"2.5","text":"A security team wants to run a suspicious file in an isolated environment, apart from the production network, to watch what it does before deciding whether it is malicious. Which technique does this describe?","o":["Obfuscation","Tokenization","Sandboxing","Load balancing"],"a":2,"e":"The study guide describes sandboxing as isolating an untrusted host or application in a segregated environment to conduct tests. It offers more than traditional anti-malware because the sandbox environment can be varied.","w":[{"t":"Obfuscation","d":"Making data or code hard to read or understand.","x":"It hides content. It does not isolate a file for observation."},{"t":"Tokenization","d":"Replacing sensitive data with a non-sensitive substitute value.","x":"It protects stored data and is unrelated to testing suspicious files."},null,{"t":"Load balancing","d":"Spreading traffic across several servers.","x":"It is about availability, not malware analysis."}],"src":[["SY0-701 Study Guide (176 pp.), §10.1"]]},
{"kind":"mcq","d":4,"obj":"4.5","text":"An administrator of a Windows domain wants to push the same firewall and security settings to every domain-joined computer without configuring each machine by hand. Which feature should be used?","o":["SELinux","Group Policy","Network access control","Content categorization"],"a":1,"e":"Group Policy is a Windows feature for centralized management and configuration of operating systems, applications, and user settings. In Active Directory, the settings are stored in Group Policy Objects (GPOs) applied to users and computers.","w":[{"t":"SELinux","d":"A Linux security architecture that enforces mandatory access control with labels.","x":"It runs on Linux systems and does not manage Windows domain settings."},null,{"t":"Network access control","d":"Checking the identity and posture of a device before letting it join a network.","x":"It decides who may connect, not which settings are applied to each computer."},{"t":"Content categorization","d":"Sorting websites into categories so a filter can allow or block them.","x":"It filters web traffic and does not configure operating system settings."}],"src":[["Microsoft Learn: Group Policy overview","https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-policy/group-policy-overview"],["SY0-701 Study Guide (176 pp.), §4.7"]]},
{"kind":"mcq","d":4,"obj":"4.5","text":"On a Linux server, an administrator sets SELinux to permissive mode while testing a new policy. What does permissive mode do?","o":["Logs policy violations but does not actually deny them","Blocks every action that the policy does not allow","Turns SELinux off and stops labeling files","Lets file owners decide all access through standard permissions alone"],"a":0,"e":"Red Hat's documentation says that in permissive mode SELinux logs violations but does not deny any operations. That makes the mode useful for policy development and debugging, but not recommended for production. Enforcing mode is the default and recommended mode.","w":[null,{"t":"Blocks every action that the policy does not allow","d":"Enforcing behavior.","x":"That is enforcing mode, the default and recommended mode, not permissive."},{"t":"Turns SELinux off and stops labeling files","d":"Disabled behavior.","x":"That is the disabled state, which Red Hat strongly discourages."},{"t":"Lets file owners decide all access through standard permissions alone","d":"Discretionary access control.","x":"SELinux adds mandatory access control on top of standard permissions, and in permissive mode it still evaluates and logs against the policy."}],"src":[["Red Hat: What is SELinux?","https://www.redhat.com/en/topics/linux/what-is-selinux"]]},
