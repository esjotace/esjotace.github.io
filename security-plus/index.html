<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security+ SY0-701 Practice</title>
<meta name="description" content="Security+ SY0-701 practice exam by Juan Carlos Hernandez Marin: 231 original questions with explanations and sources. Independent study tool, not affiliated with CompTIA.">
<link rel="canonical" href="https://esjotace.github.io/security-plus/">

<script>
/* Portfolio integration: use the theme picked on the portfolio (same origin, key "theme"),
   follow changes made in another tab or the parent page, and hide the back link when embedded. */
(function () {
  const root = document.documentElement;
  const setTheme = t => { if (t) root.dataset.theme = t; else delete root.dataset.theme; };
  try { setTheme(localStorage.getItem('theme')); } catch (e) {}
  addEventListener('storage', e => { if (e.key === 'theme') setTheme(e.newValue); });
  if (window.top !== window) root.classList.add('framed');
})();
</script>
<style>
/* Layout: one centered column. Start screen -> question card with a numbered grid below it -> scored review. */
/* Colours and fonts follow the portfolio (esjotace.github.io): same palette, system fonts, no external requests.
   "ok" is a plainer green than the portfolio's teal accent so a selected answer and a correct one never look alike. */
:root {
  --bg: #f6f1e7;
  --surface: #fffdf8;
  --fg: #16212b;
  --muted: #566370;
  --line: #d8cfbb;
  --accent: #0f7a66;
  --accent-fg: #fff;
  --accent-soft: #dcebe3;
  --ok: #2e7d32;
  --ok-soft: #e2f0dc;
  --bad: #b03a2e;
  --bad-soft: #f7e0dd;
  --flag: #9a5b00;
  --flag-soft: #f8ebd2;
  --shadow: 0 1px 0 rgba(0,0,0,.04), 0 14px 32px -20px rgba(22,33,43,.4);
  --font-display: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161c; --surface: #141d25; --fg: #eef1ee; --muted: #9aa8b3; --line: #27323c;
    --accent: #3fd1b0; --accent-fg: #06231c; --accent-soft: #1c3d3e;
    --ok: #82cc6e; --ok-soft: #1f3a1b; --bad: #f08a7e; --bad-soft: #41211d;
    --flag: #e8b058; --flag-soft: #3f2f12; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161c; --surface: #141d25; --fg: #eef1ee; --muted: #9aa8b3; --line: #27323c;
  --accent: #3fd1b0; --accent-fg: #06231c; --accent-soft: #1c3d3e;
  --ok: #82cc6e; --ok-soft: #1f3a1b; --bad: #f08a7e; --bad-soft: #41211d;
  --flag: #e8b058; --flag-soft: #3f2f12; --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
#app { max-width: 860px; margin-inline: auto; padding-inline: 16px; padding-block: 24px 56px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.row.between { justify-content: space-between; }

.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.flag-on { background: var(--flag-soft); border-color: var(--flag); color: var(--flag); }
.btn[disabled] { opacity: .45; cursor: default; }

/* start screen */
.hero { padding-block: 8px 4px; }
.hero h1 { font-size: clamp(2rem, 6vw, 3.1rem); font-weight: 700; letter-spacing: -.01em; }
.hero p { color: var(--muted); max-width: 60ch; margin: 12px 0 0; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.choice { position: relative; display: block; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer; background: var(--surface); }
.choice input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.choice:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.choice b { display: block; font-family: var(--font-display); font-size: 1.1rem; }
.choice span { color: var(--muted); font-size: 14px; }
.topics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 24px; margin: 0; padding: 0; list-style: none; }
.topics li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-block: 6px; font-size: 15px; }

/* exam */
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.qtext { font-size: 1.1rem; white-space: pre-line; max-width: 70ch; margin: 0; }
.qnote { font-size: 14px; color: var(--muted); font-style: italic; margin: 0; max-width: 70ch; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.opt:hover:not([aria-disabled="true"]) { border-color: var(--accent); }
.opt .ltr { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.opt > span:last-child { min-width: 0; overflow-wrap: anywhere; padding-top: 2px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .ltr { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .ltr { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .ltr { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt[aria-disabled="true"] { cursor: default; }
.reveal { border-left: 4px solid var(--ok); background: var(--ok-soft); border-radius: 0 8px 8px 0; padding: 12px 16px; }
.reveal.miss { border-left-color: var(--bad); background: var(--bad-soft); }
.reveal b { font-family: var(--font-display); }
.reveal p { margin: 4px 0 0; }
.why-wrap { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.why { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.why li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; color: var(--fg); }
.why li b { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; background: var(--surface); }
.why li.mine b { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.why li > div { min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 2px; }
.why .term { font-weight: 600; }
.why .no { color: var(--muted); }
.why .no span { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--bad); }
.why li em { font-style: normal; font-family: var(--font-mono); font-size: 12px; color: var(--bad); white-space: nowrap; }
.fig { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); }
.fig svg { display: block; min-width: 520px; width: 100%; height: auto; }
.fig text { fill: var(--fg); font: 500 13px var(--font-body); }
.fig .sm { fill: var(--muted); font-size: 12px; }
.fig .box { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
.fig .ln { stroke: var(--accent); stroke-width: 2.5; fill: none; }
.fig marker path { fill: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.cell { height: 38px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-family: var(--font-mono); font-size: 13px; position: relative; }
.cell.done { background: var(--accent-soft); border-color: var(--accent); }
.cell.ok { background: var(--ok-soft); border-color: var(--ok); }
.cell.bad { background: var(--bad-soft); border-color: var(--bad); }
.cell.cur { box-shadow: 0 0 0 2px var(--fg); }
.cell.fl::after { content: ""; position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--flag); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -1px; margin-right: 6px; }
.confirm { border: 1px solid var(--flag); background: var(--flag-soft); border-radius: 10px; padding: 14px 16px; }

/* results */
.score { font-family: var(--font-display); font-weight: 700; font-size: clamp(3rem, 12vw, 5.5rem); line-height: 1; letter-spacing: -.02em; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat b { display: block; font-family: var(--font-mono); font-size: 1.4rem; font-weight: 500; }
.tbar { display: grid; grid-template-columns: minmax(120px, 200px) 1fr 64px; gap: 12px; align-items: center; font-size: 15px; }
.tbar .bar { height: 10px; }
.tbar .bar > i.low { background: var(--bad); }
.tbar .bar > i.mid { background: var(--flag); }
.tbar .bar > i.hi { background: var(--ok); }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; background: var(--surface); font-size: 14px; }
.tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.rv { display: flex; flex-direction: column; gap: 8px; }
.rv .tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.rv .tag.ok { color: var(--ok); } .rv .tag.bad { color: var(--bad); } .rv .tag.skip { color: var(--flag); }
.rv p { margin: 0; }
.rv .ans { font-size: 15px; }
@media (max-width: 560px) {
  .tbar { grid-template-columns: 1fr 56px; }
  .tbar .bar { grid-column: 1 / -1; grid-row: 2; }
  .card { padding: 16px; }
}
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .25s; } }

/* v2: source badges, performance-based questions, countdown */
.badge { font-family: var(--font-mono); font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid; white-space: nowrap; }
.badge.pbq { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.mono.low { color: var(--bad); font-weight: 600; }
.code { margin: 0; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font: 13px/1.6 var(--font-mono); overflow-x: auto; }
.prows { display: flex; flex-direction: column; gap: 10px; }
.prow { display: grid; grid-template-columns: 1fr minmax(160px, 240px); gap: 8px 14px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.prow.ok { border-color: var(--ok); background: var(--ok-soft); }
.prow.bad { border-color: var(--bad); background: var(--bad-soft); }
.prow .pl { min-width: 0; overflow-wrap: anywhere; }
.prow .pl.mono { font-size: 13px; }
.prow select { width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.prow select:disabled { opacity: 1; color: var(--fg); }
.prow .pf { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
.prow .pf b { color: var(--fg); }
.ord { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.ord li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); }
.ord li.ok { border-color: var(--ok); background: var(--ok-soft); }
.ord li.bad { border-color: var(--bad); background: var(--bad-soft); }
.ord .n { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; font-family: var(--font-mono); font-size: 13px; background: var(--surface); }
.ord .mv { display: flex; gap: 6px; }
.ord .mv button { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.ord .mv button:hover:not([disabled]) { border-color: var(--accent); }
.ord .mv button[disabled] { opacity: .35; cursor: default; }
.dom { display: grid; grid-template-columns: minmax(150px, 1fr) 60px 60px 60px; gap: 6px 12px; font-size: 15px; border-bottom: 1px solid var(--line); padding-block: 6px; }
.dom.h { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dom span:not(:first-child) { text-align: right; font-family: var(--font-mono); }
.tabs.sub { margin-top: -4px; }
@media (max-width: 560px) {
  .prow { grid-template-columns: 1fr; }
  .dom { grid-template-columns: 1fr 44px 44px 44px; font-size: 14px; }
}

.foot { margin: 24px 0 0; font-size: 13px; color: var(--muted); text-align: center; }

dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; margin: auto; padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); }
dialog::backdrop { background: rgba(8, 16, 22, .6); }
.dlg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.dlg-head h2 { font-size: 1.25rem; }
.dlg-head .btn { flex: none; padding: 6px 12px; }
dialog p { margin: 0 0 12px; }
.dlg-note { font-size: 14px; color: var(--muted); }

.srcs{margin:10px 0 0;font-size:13px;color:var(--muted);line-height:1.5}.srcs a{color:inherit;text-decoration:underline;text-underline-offset:2px}

/* portfolio look: card radius and shadow, ink primary button, back link */
body { margin: 0; -webkit-font-smoothing: antialiased; }
.card { border-radius: 14px; box-shadow: var(--shadow); }
.choice, .opt, .prow, .ord li, .confirm { border-radius: 12px; }
.btn { border-radius: 10px; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary:hover { filter: none; opacity: .88; }
.back { display: block; max-width: 860px; margin-inline: auto; padding: 16px 16px 0; font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--fg); }
.framed .back { display: none; }
</style>
</head>

<script>
const Q = [
{"kind":"mcq","d":1,"obj":"1.1","text":"A company's written risk management policy, approved by senior leadership, defines how risks are identified, rated, and accepted. Into which control category does a policy like this fall?","o":["Technical","Managerial","Operational","Physical"],"a":1,"e":"Managerial controls provide oversight of the security program: policies, risk assessments, and security planning. They set direction, and other controls carry it out.","w":[{"t":"Technical","d":"Controls implemented with technology, such as firewalls, encryption, and access control lists.","x":"A written policy is not a technology the system enforces on its own."},null,{"t":"Operational","d":"Controls carried out by people in day-to-day processes, such as security awareness training or guard duty.","x":"The policy sets governance for the program rather than describing a routine performed by staff."},{"t":"Physical","d":"Controls that act on the physical world, such as locks, fences, and cameras.","x":"A policy document is not a tangible barrier."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":1,"obj":"1.2","text":"A software vendor publishes the SHA-256 hash of its installer next to the download link so that users can confirm the file has not been altered. Which part of the CIA triad does this check support?","o":["Integrity","Confidentiality","Availability","Non-repudiation"],"a":0,"e":"Integrity means data has not been changed in an unauthorized way. Comparing a computed hash with a trusted published value detects modification. The hash alone does not prove who published the file.","w":[null,{"t":"Confidentiality","d":"Keeping information from being disclosed to unauthorized parties.","x":"The hash does not hide the file or restrict who can read it."},{"t":"Availability","d":"Making sure systems and data are accessible when needed.","x":"Checking a hash does not affect whether the download is reachable."},{"t":"Non-repudiation","d":"Preventing someone from credibly denying that they performed an action.","x":"A plain hash can be recomputed by anyone, so it does not tie the file to a signer."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":1,"obj":"1.2","text":"In a zero trust architecture, which component evaluates an access request against policy and decides whether to grant or deny it?","o":["Policy enforcement point","Policy administrator","Implicit trust zone","Policy engine"],"a":3,"e":"In the zero trust control plane, the policy engine makes the access decision. The policy administrator carries out that decision, and the policy enforcement point in the data plane allows or blocks the connection.","w":[{"t":"Policy enforcement point","d":"The data plane component that enables, monitors, and terminates the connection between a subject and a resource.","x":"It carries out the decision and does not make it."},{"t":"Policy administrator","d":"The control plane component that establishes or shuts down the session between a subject and a resource, based on the policy engine's decision.","x":"It acts on the decision and does not make it."},{"t":"Implicit trust zone","d":"The part of the data plane where entities are trusted after passing through an enforcement point.","x":"It is an area of the network, not a decision-making component."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":1,"obj":"1.2","text":"Which physical security control is specifically designed to stop a vehicle from being driven into a building entrance?","o":["Access control vestibule","Video surveillance","Bollards","Access badge"],"a":2,"e":"Bollards are short, sturdy posts installed to block vehicles while still letting people walk through.","w":[{"t":"Access control vestibule","d":"A small space with two interlocking doors, so that only one person at a time can pass through after being verified.","x":"It controls how people enter and does not stop vehicles."},{"t":"Video surveillance","d":"Cameras that record or monitor an area.","x":"Cameras detect and deter, but they do not physically block anything."},null,{"t":"Access badge","d":"A card that identifies a person and opens doors they are authorized to use.","x":"A badge controls door access for people, not vehicle approach."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":1,"obj":"1.2","text":"A security team places a decoy file named \"passwords.xlsx\" on a file server. No legitimate process uses it, and any attempt to open it generates an alert. Which deception technology is this?","o":["Honeypot","Honeyfile","Honeynet","Honeytoken"],"a":1,"e":"A honeyfile is a decoy file that looks valuable and triggers an alert when it is accessed, which signals that someone is searching where they should not be.","w":[{"t":"Honeypot","d":"A decoy system or service set up to attract and observe attackers.","x":"A honeypot is a whole system or service, not a single file."},null,{"t":"Honeynet","d":"A network of honeypots that imitates a larger environment.","x":"It is a decoy network, much bigger than one file."},{"t":"Honeytoken","d":"A piece of data or a resource with no legitimate use that is monitored for access, such as a fake credential or database record.","x":"The SY0-701 objectives list a decoy file as its own item, the honeyfile, and that is what this question describes."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":1,"obj":"1.3","text":"Before approving a change to a production server, the change board requires a documented set of steps for restoring the previous configuration if the change fails. What is this document called?","o":["Backout plan","Impact analysis","Maintenance window","Standard operating procedure"],"a":0,"e":"A backout plan describes how to return a system to its prior state if a change causes problems. It is a standard part of change management.","w":[null,{"t":"Impact analysis","d":"An assessment of how a proposed change could affect systems, users, and security.","x":"It predicts effects and does not describe how to reverse the change."},{"t":"Maintenance window","d":"A scheduled period during which changes may be made.","x":"It sets when the change happens, not how to undo it."},{"t":"Standard operating procedure","d":"A documented set of steps for carrying out a routine task.","x":"It describes routine work and does not describe how to reverse a particular change."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"Which tamper-resistant hardware device is designed to generate, store, and use cryptographic keys, and is commonly deployed as an appliance or card that many servers share?","o":["Trusted Platform Module (TPM)","Secure enclave","Key management system","Hardware security module (HSM)"],"a":3,"e":"A hardware security module performs cryptographic operations and protects keys inside tamper-resistant hardware. Organizations use HSMs to protect certificate authority keys and other high-value keys.","w":[{"t":"Trusted Platform Module (TPM)","d":"Typically a chip on a single device's motherboard that stores keys and measurements for that device.","x":"A TPM is tied to one device and is not a shared appliance."},{"t":"Secure enclave","d":"An isolated, protected area inside a device's processor for sensitive operations.","x":"It is a feature of one device's processor, not a standalone shared device."},{"t":"Key management system","d":"Software or a service for creating, distributing, rotating, and retiring keys.","x":"It manages keys and may rely on HSMs, but it is not the tamper-resistant hardware itself."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"A user wants to send a message so that the recipient can confirm it came from the user and was not modified in transit, and the user cannot later credibly deny sending it. What should the user apply?","o":["Symmetric encryption","A hash alone","A digital signature","Salting"],"a":2,"e":"A digital signature is created with the sender's private key and verified with the matching public key. It provides integrity, authentication, and non-repudiation.","w":[{"t":"Symmetric encryption","d":"Encryption and decryption with the same shared key.","x":"Both parties hold the key, so it cannot show which of them created the message."},{"t":"A hash alone","d":"A one-way function that produces a fixed-length digest.","x":"Anyone can recompute a hash, so it does not identify the sender."},null,{"t":"Salting","d":"Adding a random value to data before hashing, most often for stored passwords.","x":"It makes stored password hashes harder to attack and does not sign messages."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"A payment processor replaces customers' card numbers with random values and keeps the mapping in a separate, tightly protected vault, so the merchant's database contains no real card numbers. Which technique is this?","o":["Data masking","Tokenization","Hashing","Steganography"],"a":1,"e":"Tokenization swaps sensitive data for a token that has no mathematical relationship to the original. The real value can only be retrieved through the vault.","w":[{"t":"Data masking","d":"Hiding part of a value, such as showing only the last four digits.","x":"Masking changes how a value is displayed or shared. It does not substitute a random token backed by a vault."},null,{"t":"Hashing","d":"A one-way function that turns data into a fixed-length digest.","x":"A hash cannot be reversed to retrieve the original number, while tokenization allows a vault lookup."},{"t":"Steganography","d":"Hiding data inside another file or medium, such as an image.","x":"The card numbers are being replaced, not concealed inside another file."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"Which mechanism lets a client ask a responder about the revocation status of a single certificate, instead of downloading a complete list of revoked certificates?","o":["Online Certificate Status Protocol (OCSP)","Certificate revocation list (CRL)","Certificate signing request (CSR)","Key escrow"],"a":0,"e":"OCSP lets a client query for the current status of one certificate. A certificate revocation list (CRL) is a published list the client must download and check.","w":[null,{"t":"Certificate revocation list (CRL)","d":"A list of revoked certificates published by a certificate authority.","x":"The question asks for the alternative to downloading that list."},{"t":"Certificate signing request (CSR)","d":"A request sent to a certificate authority to obtain a certificate.","x":"It is used to get a certificate and does not check revocation."},{"t":"Key escrow","d":"Storing a copy of a key with a trusted third party so it can be recovered.","x":"It is for key recovery and has nothing to do with certificate status."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.1","text":"A group with substantial government funding, custom tools, and a long-term goal of stealing defense-related secrets is targeting a contractor. Which threat actor type does this BEST describe?","o":["Unskilled attacker","Hacktivist","Organized crime","Nation-state"],"a":3,"e":"Nation-state actors typically have large resources and high sophistication, and they pursue long-term goals such as espionage or disruption.","w":[{"t":"Unskilled attacker","d":"An attacker with limited expertise who relies on existing tools.","x":"Custom tools, funding, and a long campaign point to far greater capability."},{"t":"Hacktivist","d":"An actor motivated by political or philosophical beliefs.","x":"The goal here is stealing secrets, not promoting a cause."},{"t":"Organized crime","d":"A criminal group, usually motivated by financial gain.","x":"The goal is state-level espionage and not profit."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.1","text":"A system administrator is fired and, before losing access, deletes production databases to get back at the company. Which motivation BEST fits this action?","o":["Espionage","Financial gain","Revenge","Philosophical or political beliefs"],"a":2,"e":"Revenge is a motivation driven by a desire to harm someone who is seen as having wronged the attacker. Disgruntled insiders with access can cause serious damage.","w":[{"t":"Espionage","d":"Gathering secret information, often for a government or competitor.","x":"Nothing is being collected. The data is being destroyed."},{"t":"Financial gain","d":"Acting to make money.","x":"The administrator is not trying to profit."},null,{"t":"Philosophical or political beliefs","d":"Acting to promote an ideology or cause.","x":"The motive is personal anger at the company, not a cause."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.2","text":"Employees receive text messages that appear to come from a delivery company and contain a link to \"reschedule\" a package. The link leads to a page that harvests their credentials. Which social engineering attack is this?","o":["Vishing","Smishing","Whaling","Pretexting"],"a":1,"e":"Smishing is phishing carried out by SMS text message.","w":[{"t":"Vishing","d":"Phishing carried out by voice call.","x":"The lure arrived as a text message, not a phone call."},null,{"t":"Whaling","d":"Phishing aimed at senior executives.","x":"The messages went to employees in general, not specifically to senior leaders."},{"t":"Pretexting","d":"Inventing a scenario to persuade a target to share information or take an action.","x":"The attack depends on a link in an SMS message, which is the delivery channel the question asks for."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.2","text":"An attacker leaves USB drives labeled \"Payroll\" in a company parking lot, hoping employees will plug them into their workstations. Which threat vector does this describe?","o":["Removable device","Watering hole","Open service port","Image-based"],"a":0,"e":"Removable media such as USB drives can carry malware or exfiltrate data once connected. Leaving curiosity-bait devices where staff will find them is a common way to use this vector.","w":[null,{"t":"Watering hole","d":"Compromising a website that a target group is known to visit.","x":"No website is involved."},{"t":"Open service port","d":"A network port that is listening and reachable, which attackers can probe.","x":"The attack depends on a physical device, not a network service."},{"t":"Image-based","d":"Hiding malicious content in an image file.","x":"The risk is the drive itself, not malicious content inside an image."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.2","text":"A user mistypes \"paypall.com\" and lands on a convincing fake login page that an attacker registered on purpose. Which attack is this?","o":["Watering hole","Pretexting","DNS poisoning","Typosquatting"],"a":3,"e":"Typosquatting registers domain names that resemble real ones, relying on users' typing mistakes to send them to attacker-controlled sites.","w":[{"t":"Watering hole","d":"Compromising a legitimate site that a target group regularly visits.","x":"The attacker registered a look-alike domain and did not compromise a trusted site."},{"t":"Pretexting","d":"Inventing a scenario to obtain information.","x":"No story is told to the victim. The user simply typed the wrong address."},{"t":"DNS poisoning","d":"Corrupting DNS data so a correct name resolves to the wrong address.","x":"The user typed an incorrect name, so DNS did not need to be tampered with."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.3","text":"A program copies user-supplied input into a fixed-size memory buffer without checking its length. An attacker supplies far more data than the buffer can hold and overwrites adjacent memory. What type of vulnerability is this?","o":["Race condition","SQL injection","Buffer overflow","Malicious update"],"a":2,"e":"A buffer overflow occurs when a program writes beyond the end of a buffer. Attackers can use it to crash the program or run their own code.","w":[{"t":"Race condition","d":"A flaw that depends on the timing or order of events.","x":"The problem is missing length checking, not timing."},{"t":"SQL injection","d":"Inserting database commands through input fields.","x":"The input is overwriting memory, not altering a database query."},null,{"t":"Malicious update","d":"An update that has been tampered with to include harmful code.","x":"No update is involved."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.3","text":"A manufacturer announces that it will no longer issue security patches for a network router model that is still in use at a company. Which vulnerability concern does this create?","o":["Zero-day","End-of-life hardware","Misconfiguration","Jailbreaking"],"a":1,"e":"Once a product reaches end of life, new vulnerabilities will not be fixed, so the device stays exposed. It should be replaced or compensated for with other controls such as segmentation.","w":[{"t":"Zero-day","d":"A flaw unknown to the vendor, with no patch available.","x":"The vendor has made a decision not to patch. This is a support problem, not an unknown flaw."},null,{"t":"Misconfiguration","d":"Incorrect or insecure settings.","x":"The concern is the lack of future patches, not how the device is set up."},{"t":"Jailbreaking","d":"Removing the restrictions placed on a mobile operating system.","x":"It applies to mobile devices, not network routers."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.3","text":"Attackers exploit a flaw in a widely used web browser. The vendor has not been told about the flaw, and no patch exists. What is this type of vulnerability called?","o":["Zero-day","Misconfiguration","Default credentials","Side loading"],"a":0,"e":"A zero-day vulnerability is one the vendor does not know about or has not yet fixed, so defenders have had no time to patch. Layered defenses and monitoring help until a fix is available.","w":[null,{"t":"Misconfiguration","d":"A weak or incorrect setting.","x":"The flaw is in the browser's code, not in how it is configured."},{"t":"Default credentials","d":"Factory logins that were never changed.","x":"The problem is a code flaw, not a login left at its default."},{"t":"Side loading","d":"Installing an app from outside the official store.","x":"No app installation is involved."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.5","text":"A new Linux server arrives with a web server, FTP service, and Telnet enabled by default, but the company needs only HTTPS. Which action BEST reduces the server's attack surface?","o":["Increase log retention","Add a login banner","Enable nightly automatic reboots","Remove or disable the unneeded services and close their ports"],"a":3,"e":"Hardening means reducing exposure by removing unnecessary software, disabling unused services and ports, and changing defaults. Every service that is removed is one less thing to attack.","w":[{"t":"Increase log retention","d":"Keeping logs for a longer period.","x":"It supports investigations but leaves every service exposed."},{"t":"Add a login banner","d":"A legal or warning message shown at sign-in.","x":"A banner does not remove any exposed service."},{"t":"Enable nightly automatic reboots","d":"Restarting the system on a schedule.","x":"A reboot does not remove or disable any service."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"Malware spreads from computer to computer across a network by exploiting a vulnerability, with no user action and no host file needed. Which type of malware is this?","o":["Virus","Trojan","Worm","Rootkit"],"a":2,"e":"A worm is self-replicating malware that spreads on its own, usually over a network. A virus, by contrast, attaches to a host file or program and generally needs a user to run it.","w":[{"t":"Virus","d":"Malware that attaches to a host file or program and typically spreads when that file is run.","x":"The description says the malware needs no host file and no user action."},{"t":"Trojan","d":"Malware disguised as legitimate software.","x":"It relies on the user installing it and does not spread by itself."},null,{"t":"Rootkit","d":"Malware that hides itself and maintains privileged access.","x":"Its main purpose is concealment, not self-propagation."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"After an infection, an analyst finds that a malicious program hides its own processes and files from the operating system and from security tools while keeping privileged access. Which type of malware is this?","o":["Keylogger","Rootkit","Bloatware","Ransomware"],"a":1,"e":"A rootkit conceals its presence and maintains privileged access, which makes it difficult to detect and remove.","w":[{"t":"Keylogger","d":"Malware or hardware that records keystrokes.","x":"Recording keystrokes is its purpose, and it is not defined by hiding itself with privileged access."},null,{"t":"Bloatware","d":"Unwanted software preinstalled on a device.","x":"It is unwanted but visible, not hidden."},{"t":"Ransomware","d":"Malware that locks or encrypts data and demands payment.","x":"It announces itself to demand payment instead of hiding."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An attacker sends small DNS queries to many open resolvers with the victim's IP address forged as the source. The resolvers send much larger responses to the victim, overwhelming it. Which attack is this?","o":["Reflected and amplified DDoS","On-path attack","Credential replay","DNS cache poisoning"],"a":0,"e":"The forged source address causes responses to be reflected at the victim. Because each response is larger than the query that triggered it, the attacker's traffic is amplified.","w":[null,{"t":"On-path attack","d":"An attacker positioned between two parties to intercept or alter their traffic.","x":"The attacker is not sitting between the victim and anything. The victim is being flooded."},{"t":"Credential replay","d":"Reusing captured authentication data to gain access.","x":"The goal is to overwhelm a service, not to authenticate."},{"t":"DNS cache poisoning","d":"Inserting false records into a resolver's cache.","x":"The resolvers behave normally and no records are altered. Their responses are the weapon."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An attacker stands near an employee with a handheld reader, copies the data from the employee's access badge, and writes it to a blank card to enter a restricted area. Which physical attack is this?","o":["Tailgating","Environmental attack","Shoulder surfing","RFID cloning"],"a":3,"e":"Radio frequency identification (RFID) cloning copies the data from a badge or tag onto another card so the clone is accepted by the reader.","w":[{"t":"Tailgating","d":"Following an authorized person through a door without presenting credentials.","x":"The attacker presents a cloned credential and does not follow someone in."},{"t":"Environmental attack","d":"Disrupting systems through conditions such as power loss or overheating.","x":"The attack targets a credential, not the facility's environment."},{"t":"Shoulder surfing","d":"Watching someone enter a code or password.","x":"The attacker is copying data from the badge, not watching someone type."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.5","text":"Which mitigation limits an attacker's ability to move laterally by dividing a network into separate zones with controls between them?","o":["Patching","Encryption","Segmentation","Application allow list"],"a":2,"e":"Segmentation divides a network into zones and controls the traffic between them, so a compromise in one zone does not give free access to the others.","w":[{"t":"Patching","d":"Applying updates that fix vulnerabilities.","x":"Patching removes specific flaws but does not divide the network."},{"t":"Encryption","d":"Protecting data by making it unreadable without a key.","x":"It protects data confidentiality and does not limit movement between zones."},null,{"t":"Application allow list","d":"A list of programs that are permitted to run.","x":"It restricts software execution, not traffic between network zones."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":3,"obj":"3.1","text":"A development team packages an application and its dependencies so that it runs the same way in every environment, while sharing the host's operating system kernel instead of running a full guest operating system for each instance. Which technology is this?","o":["Virtualization","Containerization","Serverless computing","Infrastructure as code"],"a":1,"e":"Containers isolate applications at the operating system level and share the host kernel, so they start quickly and use fewer resources than full virtual machines.","w":[{"t":"Virtualization","d":"Running full virtual machines, each with its own guest operating system, on a hypervisor.","x":"Each VM carries its own guest OS, so the host kernel is not shared."},null,{"t":"Serverless computing","d":"The provider runs code on demand without the customer managing servers.","x":"It is an execution model and does not describe packaging an application with its dependencies."},{"t":"Infrastructure as code","d":"Defining infrastructure in machine-readable files.","x":"It describes how infrastructure is provisioned, not how an application is packaged."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":3,"obj":"3.4","text":"A company must resume operations within minutes of a primary data center failure. It will pay for a facility with equipment already running and data replicated in near real time. Which type of recovery site fits?","o":["Hot site","Warm site","Cold site","Air-gapped backup"],"a":0,"e":"A hot site is fully equipped and kept current, so it can take over almost immediately. It is the most expensive option and has the shortest recovery time.","w":[null,{"t":"Warm site","d":"A site with hardware and connectivity in place, but data and configurations must be restored before it is in use.","x":"The restoration step makes it slower than the question allows."},{"t":"Cold site","d":"A site with space and utilities but little or no equipment.","x":"Equipment must be brought in and set up, which takes much longer."},{"t":"Air-gapped backup","d":"Backups kept offline with no network connection.","x":"It protects data but does not provide systems that are ready to run."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"Which security appliance sits inline with network traffic and can automatically block malicious packets, whereas an intrusion detection system (IDS) can only alert?","o":["Intrusion detection system (IDS)","Network tap","Proxy server","Intrusion prevention system (IPS)"],"a":3,"e":"An IPS is placed in the traffic path and can drop or block traffic that matches an attack. An IDS watches a copy of the traffic and generates alerts.","w":[{"t":"Intrusion detection system (IDS)","d":"A system that monitors traffic and generates alerts about suspected attacks.","x":"The question describes blocking, which an IDS does not do on its own."},{"t":"Network tap","d":"A device that passively copies traffic to a monitoring system.","x":"It only provides a copy and cannot block."},{"t":"Proxy server","d":"An intermediary that forwards client requests to other servers.","x":"It brokers requests and is not a general-purpose attack-blocking device."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A company wants a switch port to grant network access only after the connecting device or user has authenticated through an authentication server. Which standard provides this port-based network access control?","o":["Port mirroring","Spanning Tree Protocol","802.1X","MAC address filtering"],"a":2,"e":"IEEE 802.1X controls access at the port level. It uses the Extensible Authentication Protocol (EAP) to authenticate with a server, often over RADIUS, before the port is opened.","w":[{"t":"Port mirroring","d":"Copying traffic from one port to another for monitoring.","x":"It supports analysis and does not authenticate anything."},{"t":"Spanning Tree Protocol","d":"A protocol that prevents switching loops.","x":"It prevents loops, not unauthorized access."},null,{"t":"MAC address filtering","d":"Allowing or blocking devices by hardware address.","x":"It does not authenticate a user or device with credentials, and MAC addresses can be spoofed."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"Which protocol suite operates at the network layer to authenticate and encrypt IP packets and is commonly used to build site-to-site VPNs?","o":["TLS","IPsec","SSH","L2TP"],"a":1,"e":"Internet Protocol Security (IPsec) protects IP traffic and supports tunnel mode, which is widely used between sites.","w":[{"t":"TLS","d":"A protocol that secures application traffic, such as HTTPS, above the transport layer.","x":"It protects individual application connections, not IP packets at the network layer."},null,{"t":"SSH","d":"A protocol for secure remote login and command execution.","x":"It is used for remote administration and is not the standard site-to-site VPN suite."},{"t":"L2TP","d":"A tunneling protocol that does not provide encryption by itself.","x":"It is usually paired with IPsec for protection and is not the encryption suite itself."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":3,"obj":"3.3","text":"A company encrypts its backup tapes before sending them to an offsite vault. Which data state does this protect?","o":["Data at rest","Data in transit","Data in use","Data masking"],"a":0,"e":"Data at rest is data stored on media such as drives, tapes, or databases. Encryption protects it if the media is lost or stolen.","w":[null,{"t":"Data in transit","d":"Data moving across a network.","x":"Tapes in storage are not moving across a network."},{"t":"Data in use","d":"Data being actively processed, for example in memory.","x":"Data on a stored tape is not being processed."},{"t":"Data masking","d":"Hiding part of a data value.","x":"It is a technique, not a data state."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":3,"obj":"3.3","text":"A hospital stores patient health records that a law requires it to protect. Which data type does this BEST describe?","o":["Trade secret","Intellectual property","Public data","Regulated data"],"a":3,"e":"Regulated data is subject to laws or industry rules that dictate how it must be protected. Health records and payment card data are common examples.","w":[{"t":"Trade secret","d":"Confidential business information that gives a company a competitive edge.","x":"Patient records are protected by law rather than being a company's competitive secret."},{"t":"Intellectual property","d":"Creations of the mind such as inventions, designs, and software.","x":"Patient records are not an invention or design."},{"t":"Public data","d":"Information that is openly available.","x":"Patient records must be kept private."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":3,"obj":"3.4","text":"A team gathers in a conference room and walks through a simulated outage scenario, discussing who does what, without touching any production systems. Which type of disaster recovery test is this?","o":["Failover test","Simulation","Tabletop exercise","Parallel processing"],"a":2,"e":"A tabletop exercise is a discussion-based walkthrough of a scenario. It is a low-cost way to find gaps in plans and roles.","w":[{"t":"Failover test","d":"Actually switching operations to a secondary system.","x":"Systems are not being touched in this scenario."},{"t":"Simulation","d":"Recreating an event under controlled conditions, with participants taking action.","x":"Participants are only discussing, not acting."},null,{"t":"Parallel processing","d":"Running processing on the recovery system alongside the primary.","x":"It involves running real systems, which the team is not doing."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.1","text":"A company defines the approved configuration for all new laptops, applies it with imaging tools, and reviews it on a schedule to keep it current. Which concept does this describe?","o":["Gap analysis","Secure baseline","Attestation","Risk register"],"a":1,"e":"A secure baseline is an approved standard configuration. The lifecycle is to establish it, deploy it, and maintain it over time.","w":[{"t":"Gap analysis","d":"Comparing the current state to a desired state to find shortfalls.","x":"It identifies differences and is not the approved configuration itself."},null,{"t":"Attestation","d":"A formal statement that something is true or has been done.","x":"It confirms a claim, not a standard configuration."},{"t":"Risk register","d":"A record of identified risks and their owners.","x":"It tracks risks and does not define configurations."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.1","text":"WPA3-Personal replaces the pre-shared key handshake used by WPA2-Personal with a method that resists offline dictionary attacks. Which method is this?","o":["Simultaneous Authentication of Equals (SAE)","TKIP","CCMP","WPS"],"a":0,"e":"SAE is a password-based key exchange. An attacker who captures the handshake cannot test password guesses offline, unlike with the WPA2 pre-shared key handshake.","w":[null,{"t":"TKIP","d":"An older encryption protocol that was used as an interim fix for WEP.","x":"It is an outdated encryption protocol and not a key exchange method."},{"t":"CCMP","d":"An AES-based encryption protocol used by WPA2.","x":"It encrypts traffic and does not replace the key exchange."},{"t":"WPS","d":"A feature that simplifies connecting devices to a network.","x":"It is a setup convenience and is not a key exchange method."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.1","text":"A company buys the same phone model for every employee, manages the phones centrally, and permits limited personal use. Which mobile deployment model is this?","o":["Bring your own device (BYOD)","Choose your own device (CYOD)","Mobile device management","Corporate-owned, personally enabled (COPE)"],"a":3,"e":"In COPE the company owns and manages the device, but employees may use it for personal purposes as well.","w":[{"t":"Bring your own device (BYOD)","d":"Employees use their own personal devices for work.","x":"The company owns these phones."},{"t":"Choose your own device (CYOD)","d":"Employees choose from a list of company-approved devices.","x":"Here the company picks one model for everyone, so employees do not choose."},{"t":"Mobile device management","d":"Software for managing and securing mobile devices.","x":"It is a management tool and not a deployment model."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.1","text":"A developer wants to reduce injection risks by checking that data entered in form fields matches the expected type, length, and format before the application processes it. Which secure coding practice is this?","o":["Code signing","Static code analysis","Input validation","Secure cookies"],"a":2,"e":"Input validation checks that data is acceptable before it is used. It reduces the risk of injection attacks and other input-based flaws.","w":[{"t":"Code signing","d":"Digitally signing code to prove its publisher and that it has not been altered.","x":"It verifies the origin of code and does not check user input."},{"t":"Static code analysis","d":"Examining source code for flaws without running it.","x":"It is a testing method and does not check data at run time."},null,{"t":"Secure cookies","d":"Cookies marked so that browsers send them only over encrypted connections.","x":"They protect session data in transit and do not check form input."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.2","text":"A company is retiring failed solid-state drives (SSDs) and wants assurance that the data can never be recovered. Which method is MOST appropriate?","o":["Degaussing","Physical destruction","Overwriting","Quick format"],"a":1,"e":"Physical destruction, such as shredding, makes the media unusable. Flash storage is not magnetic, so degaussing does not apply, and overwriting may leave data in blocks that the drive has remapped.","w":[{"t":"Degaussing","d":"Using a strong magnetic field to erase magnetic media.","x":"SSDs store data in flash memory, which is not magnetic, so degaussing is ineffective."},null,{"t":"Overwriting","d":"Writing new data over existing data.","x":"SSD wear leveling and spare blocks can leave copies the host cannot reach, and a failed drive may not accept writes at all."},{"t":"Quick format","d":"Rebuilding file system structures without erasing the data.","x":"The data remains recoverable."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.3","text":"Which standardized scoring system rates the severity of software vulnerabilities on a scale from 0 to 10?","o":["Common Vulnerability Scoring System (CVSS)","Common Vulnerabilities and Exposures (CVE)","Security Content Automation Protocol (SCAP)","Structured Threat Information eXpression (STIX)"],"a":0,"e":"CVSS produces a numeric severity score from 0.0 to 10.0. Teams use it to help prioritize remediation, along with factors such as exposure and business impact.","w":[null,{"t":"Common Vulnerabilities and Exposures (CVE)","d":"A list of identifiers for publicly known vulnerabilities.","x":"It gives each flaw a name and number but does not score severity."},{"t":"Security Content Automation Protocol (SCAP)","d":"A set of specifications for automating vulnerability and compliance checks.","x":"It automates checking and is not a severity score."},{"t":"Structured Threat Information eXpression (STIX)","d":"A standard language for sharing threat intelligence.","x":"It describes threat data, not vulnerability severity."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.3","text":"A company invites independent researchers to find security flaws in its applications and pays a reward for each valid finding. What is this program called?","o":["Penetration test","Vulnerability scan","Audit","Bug bounty program"],"a":3,"e":"A bug bounty program pays outside researchers for reporting valid vulnerabilities, usually under published rules about scope and disclosure.","w":[{"t":"Penetration test","d":"A contracted, scoped assessment in which testers attempt to exploit weaknesses.","x":"It is a defined engagement with a hired tester and not an open call for reports paid per finding."},{"t":"Vulnerability scan","d":"An automated check for known weaknesses.","x":"It is automated and involves no researchers."},{"t":"Audit","d":"A formal review of controls against criteria.","x":"It evaluates compliance and does not reward individual findings."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.3","text":"A team has applied a patch to fix a vulnerability on several servers. Which activity confirms that the vulnerability is actually gone?","o":["Prioritization","Reporting","Rescanning","Confirmation"],"a":2,"e":"Validation of remediation includes rescanning, which checks that the fix worked. Audits and verification can also confirm it.","w":[{"t":"Prioritization","d":"Ordering vulnerabilities by risk.","x":"It comes before remediation and does not check the result."},{"t":"Reporting","d":"Communicating findings and progress.","x":"It documents results and does not test the fix."},null,{"t":"Confirmation","d":"Checking that a scanner finding is real and not a false positive.","x":"It happens before remediation, to decide whether a finding is genuine."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.4","text":"A security operations center receives hundreds of alerts a day that turn out to be harmless. The team adjusts detection thresholds and rules to reduce those alerts while still catching real threats. What is this activity called?","o":["Log aggregation","Alert tuning","Archiving","Quarantine"],"a":1,"e":"Alert tuning adjusts rules and thresholds so analysts spend time on real threats rather than on noise.","w":[{"t":"Log aggregation","d":"Collecting logs from many sources in one place.","x":"It centralizes data and does not reduce false alerts."},null,{"t":"Archiving","d":"Storing logs for long-term retention.","x":"It preserves data and does not change alert behavior."},{"t":"Quarantine","d":"Isolating a suspicious file or device.","x":"It is a response action and not a way to adjust detection rules."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.5","text":"A company wants to prevent users from reaching malware-hosting sites by checking each domain name lookup against a reputation list before returning an answer. Which control is this?","o":["DNS filtering","Network access control","Host-based firewall","File integrity monitoring"],"a":0,"e":"DNS filtering blocks or redirects lookups for domains known or suspected to be malicious, which stops connections before they start.","w":[null,{"t":"Network access control","d":"Checking device identity and posture before allowing network access.","x":"It governs who connects to the network and does not check domain lookups."},{"t":"Host-based firewall","d":"A firewall running on an individual host.","x":"It filters traffic by rules such as ports and addresses, not by domain reputation."},{"t":"File integrity monitoring","d":"Alerting when important files change.","x":"It watches files on a system and does not filter DNS queries."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.5","text":"A security team needs an alert whenever critical operating system files on a server are modified unexpectedly. Which control provides this?","o":["Data loss prevention","Endpoint detection and response","Web filter","File integrity monitoring (FIM)"],"a":3,"e":"File integrity monitoring compares files with a known-good state and alerts on unauthorized changes. It is useful for detecting tampering and some malware.","w":[{"t":"Data loss prevention","d":"Controls that detect and block sensitive data leaving the organization.","x":"It watches for data leaving and does not monitor system file changes."},{"t":"Endpoint detection and response","d":"Tools that monitor endpoints for threats and support investigation and response.","x":"It is a broad endpoint tool, while the question describes watching specific files for changes."},{"t":"Web filter","d":"A control that blocks websites by category or reputation.","x":"It filters web access and does not monitor files."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.5","text":"Which endpoint tool continuously records process, file, and network activity, and lets analysts investigate and contain a compromised host remotely?","o":["Host-based firewall","Full-disk encryption","Endpoint detection and response (EDR)","DNS filtering"],"a":2,"e":"EDR collects detailed endpoint telemetry, detects suspicious behavior, and lets analysts investigate and respond, for example by isolating a host.","w":[{"t":"Host-based firewall","d":"Software that filters traffic to and from a single host.","x":"It filters traffic and does not record activity for investigation."},{"t":"Full-disk encryption","d":"Encrypting the entire storage device.","x":"It protects data at rest and does not detect or respond."},null,{"t":"DNS filtering","d":"Blocking malicious domain lookups.","x":"It works at name resolution and not on the endpoint's process activity."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"On a file server, the owner of each file decides who else may read or modify it. Which access control model does this describe?","o":["Mandatory access control (MAC)","Discretionary access control (DAC)","Role-based access control (RBAC)","Attribute-based access control (ABAC)"],"a":1,"e":"In DAC, the resource owner decides who gets access. It is flexible but depends on owners making good choices.","w":[{"t":"Mandatory access control (MAC)","d":"A model in which the system enforces access using labels and clearances set by administrators.","x":"Here owners decide, whereas in MAC the system enforces central rules."},null,{"t":"Role-based access control (RBAC)","d":"A model that grants permissions to roles, and users get them by holding a role.","x":"Access here is granted by owners and not through roles."},{"t":"Attribute-based access control (ABAC)","d":"A model that decides access using attributes of the user, resource, and context.","x":"The decision here is the owner's, not an evaluation of attributes."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"When a new accountant joins, the administrator adds the user to the \"Accounting\" group, and the user immediately receives all the permissions that group holds. Which access control model does this describe?","o":["Role-based access control (RBAC)","Discretionary access control","Rule-based access control","Attribute-based access control"],"a":0,"e":"RBAC assigns permissions to roles, and users receive them by being assigned to the role. It makes administration simpler and supports least privilege.","w":[null,{"t":"Discretionary access control","d":"A model in which resource owners decide who has access.","x":"Permissions here come from group membership, not from owners."},{"t":"Rule-based access control","d":"A model that applies system-wide rules, such as time-of-day restrictions, to all access.","x":"The access here depends on the user's role, not on a rule."},{"t":"Attribute-based access control","d":"A model that evaluates attributes of the user, resource, and context.","x":"The permissions here come from a role assignment and not from attribute evaluation."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"A user signs in with a password and then taps a hardware security key to approve the sign-in. Which combination of authentication factors is this?","o":["Something you know and something you are","Something you have and something you are","Something you know only","Something you know and something you have"],"a":3,"e":"The password is something you know, and the hardware key is something you have. Two different factor types make this multifactor authentication.","w":[{"t":"Something you know and something you are","d":"A knowledge factor plus a biometric.","x":"No biometric is used here. The second factor is a physical key."},{"t":"Something you have and something you are","d":"A possession factor plus a biometric.","x":"The password is not a possession or biometric factor."},{"t":"Something you know only","d":"Two knowledge factors, such as a password and a security question.","x":"Two knowledge factors would still be a single factor type, and the hardware key is a possession."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"An administrator needs elevated rights for one maintenance task. The system grants them for a limited time and removes them automatically afterward. Which privileged access management concept is this?","o":["Password vaulting","Single sign-on","Just-in-time permissions","Identity proofing"],"a":2,"e":"Just-in-time permissions grant elevated access only when it is needed and for a limited time, which reduces the window in which privileged accounts can be abused.","w":[{"t":"Password vaulting","d":"Storing and managing privileged credentials in a secure repository.","x":"It protects credentials and does not grant time-limited rights."},{"t":"Single sign-on","d":"One authentication that gives access to multiple applications.","x":"It reduces repeated sign-ins and does not limit privileges by time."},null,{"t":"Identity proofing","d":"Verifying that a person is who they claim to be before an account is issued.","x":"It happens when an account is created and not when privileges are used."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.7","text":"A cloud team adds automated policies that block anyone from creating a publicly accessible storage bucket, no matter who tries. Which automation use case is this?","o":["Escalation","Guard rails","Technical debt","Continuous integration"],"a":1,"e":"Guard rails are automated limits that keep configurations within safe bounds, which prevents common mistakes before they happen.","w":[{"t":"Escalation","d":"Sending an issue to a higher level of support or authority.","x":"It routes issues and does not block a configuration."},null,{"t":"Technical debt","d":"The accumulated cost of shortcuts and past decisions that must be fixed later.","x":"It is a downside of rushed work, not a control."},{"t":"Continuous integration","d":"Frequently merging and testing code changes.","x":"It is a software build practice and does not restrict cloud configurations."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.8","text":"An investigator needs a record showing who collected a hard drive, who held it, and when, so that the evidence can be trusted in court. What is this record called?","o":["Chain of custody","Legal hold","E-discovery","Root cause analysis"],"a":0,"e":"A chain of custody documents each person who handled evidence and when, which shows it was not altered or tampered with.","w":[null,{"t":"Legal hold","d":"An order to preserve information that may be relevant to litigation.","x":"It requires preserving data and does not record who handled it."},{"t":"E-discovery","d":"Identifying and collecting electronic information for legal proceedings.","x":"It is a process for finding data and is not a record of handling."},{"t":"Root cause analysis","d":"Determining the underlying reason an incident happened.","x":"It explains the cause and does not track evidence handling."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.8","text":"A security team proactively searches its network for signs of compromise that have not triggered any alerts. Which activity is this?","o":["Penetration testing","Vulnerability scanning","Root cause analysis","Threat hunting"],"a":3,"e":"Threat hunting is the proactive search for hidden or undetected threats, often guided by a hypothesis or threat intelligence.","w":[{"t":"Penetration testing","d":"An authorized attempt to exploit weaknesses to test defenses.","x":"It simulates an attack and does not search for existing compromise."},{"t":"Vulnerability scanning","d":"An automated check for known weaknesses.","x":"It finds flaws, not evidence of an intruder."},{"t":"Root cause analysis","d":"Determining the underlying reason an incident occurred.","x":"It happens after an incident is known."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":4,"obj":"4.9","text":"An analyst needs to see which accounts signed in to a Windows server and which sign-in attempts failed. Which log source should the analyst check?","o":["Firewall log","Application log","Operating system security log","IPS/IDS log"],"a":2,"e":"Operating system security logs record events such as successful and failed logons, account changes, and policy changes.","w":[{"t":"Firewall log","d":"A record of traffic allowed or blocked by a firewall.","x":"It shows network traffic and not sign-in events on the server."},{"t":"Application log","d":"A record of events generated by a particular application.","x":"It covers application behavior and not operating system logons."},null,{"t":"IPS/IDS log","d":"A record of alerts or blocked events from intrusion detection or prevention systems.","x":"It shows suspected attacks and does not list account sign-ins."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":5,"obj":"5.4","text":"A payroll vendor processes employee data only on the instructions of its client company. Under privacy regulations, which role does the vendor hold?","o":["Data controller","Data processor","Data subject","Data owner"],"a":1,"e":"A data processor handles personal data on behalf of a controller and only according to the controller's instructions.","w":[{"t":"Data controller","d":"The party that decides why and how personal data is processed.","x":"The client company makes those decisions, and the vendor follows them."},null,{"t":"Data subject","d":"The individual the personal data is about.","x":"The vendor is an organization handling data and not the person the data describes."},{"t":"Data owner","d":"The person accountable for a data set who decides how it is classified and used.","x":"The vendor processes the data on instruction and does not decide."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":5,"obj":"5.5","text":"A penetration tester is given network diagrams and a standard user account, but not full administrative access or source code. Which type of test is this?","o":["Partially known environment","Known environment","Unknown environment","Defensive penetration testing"],"a":0,"e":"In a partially known environment test, the tester has some information about the target. In a known environment the tester has full information, and in an unknown environment the tester has none.","w":[null,{"t":"Known environment","d":"The tester has full knowledge of the environment.","x":"The tester has only some information here."},{"t":"Unknown environment","d":"The tester has no prior information about the target.","x":"The tester was given diagrams and an account."},{"t":"Defensive penetration testing","d":"Testing that focuses on the ability of defenders to detect and respond.","x":"It describes the testing focus, not how much the tester was told."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":5,"obj":"5.6","text":"An employee receives an email that looks like a phishing attempt. According to good security awareness practice, what should the employee do?","o":["Forward it to coworkers to warn them","Reply to the sender to ask whether it is genuine","Delete it and say nothing","Report it through the organization's reporting process without clicking any links"],"a":3,"e":"Reporting lets the security team investigate, block the sender, and warn others. Clicking links or attachments risks compromise.","w":[{"t":"Forward it to coworkers to warn them","d":"Sharing the message with others.","x":"It spreads the malicious message and puts more people at risk."},{"t":"Reply to the sender to ask whether it is genuine","d":"Contacting the sender through the same message.","x":"It confirms the address is active and a malicious sender will simply say it is genuine."},{"t":"Delete it and say nothing","d":"Removing the message without reporting it.","x":"It protects only this employee, while the security team cannot block the sender or warn others."},null],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":5,"obj":"5.2","text":"A risk analyst ranks risks as high, medium, or low based on expert judgment and does not assign dollar values. Which type of analysis is this?","o":["Quantitative risk analysis","Gap analysis","Qualitative risk analysis","Business impact analysis"],"a":2,"e":"Qualitative risk analysis uses descriptive ratings, based on judgment, to compare risks. It is quicker than quantitative analysis but less precise.","w":[{"t":"Quantitative risk analysis","d":"Analysis that assigns numeric values, such as single loss expectancy and annualized loss expectancy.","x":"The analyst is not using dollar values."},{"t":"Gap analysis","d":"Comparing a current state with a desired state.","x":"It finds shortfalls and does not rate risks."},null,{"t":"Business impact analysis","d":"An assessment of how disruptions affect critical business functions.","x":"It measures impact of disruption, not a ranking of risks by judgment."}],"src":[["Dion Training SY0-701 Study Guide (350 pp.)"]]},
{"kind":"mcq","d":2,"obj":"2.1","text":"Employees in the marketing department are frustrated by the approved file-sharing tool's size limits, so they begin exchanging large campaign files through their own personal cloud storage accounts. The security team has no visibility into this activity. Which term BEST describes this situation?","o":["Insider threat","Shadow IT","Hacktivist","Bring your own device"],"a":1,"e":"Shadow IT is hardware, software, or services used without the approval or knowledge of the IT and security teams. Here, staff chose an unsanctioned service to get their work done, so the organization cannot monitor or protect the data.","w":[{"t":"Insider threat","d":"A person with legitimate access who misuses it, intentionally or by accident.","x":"The core problem here is the unapproved technology, not someone abusing their access to harm the company."},null,{"t":"Hacktivist","d":"An outside attacker motivated by political or philosophical beliefs.","x":"The users are employees trying to work faster, not an external actor pursuing a cause."},{"t":"Bring your own device","d":"A policy that lets employees use personal devices for work.","x":"The issue is the unsanctioned cloud service, not who owns the laptop or phone."}],"src":[["SY0-701 Study Guide (176 pp.), §2.3"]]},
{"kind":"mcq","d":2,"obj":"2.3","text":"A web application checks whether a user may open a file, then opens the file a few milliseconds later. An attacker swaps the file for a link to a protected file in the gap between those two steps and reads it. What type of vulnerability does this describe?","o":["Race condition (time-of-check/time-of-use)","Buffer overflow","Memory injection","Directory traversal"],"a":0,"e":"A time-of-check/time-of-use (TOCTOU) race condition exists when the state of a resource changes between the moment it is checked and the moment it is used. The attacker wins the race by acting inside that window.","w":[null,{"t":"Buffer overflow","d":"Writing more data into a memory buffer than it can hold.","x":"Nothing is overwritten in memory here. The weakness is the timing gap between the check and the use."},{"t":"Memory injection","d":"Inserting malicious code into the memory of a running process.","x":"The attacker swaps a file, not code in memory, and the key factor is the timing."},{"t":"Directory traversal","d":"Using sequences such as ../ to reach files outside the intended folder.","x":"The attacker is not walking the path. They change what the file points to during the gap."}],"src":[["MITRE CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition","https://cwe.mitre.org/data/definitions/367.html"],["SY0-701 Study Guide (176 pp.), §8.4"]]},
{"kind":"mcq","d":2,"obj":"2.2","text":"An accounts-payable clerk receives an email from what looks like the CFO's real mailbox, asking for an urgent wire transfer to a new vendor. The CFO's email account had been compromised weeks earlier. Which attack is this?","o":["Smishing","Typosquatting","Watering hole","Business email compromise"],"a":3,"e":"Business email compromise (BEC) uses a compromised or spoofed executive or vendor mailbox to trick staff into payments or data disclosure. The trust in a known sender is what makes it work.","w":[{"t":"Smishing","d":"Phishing delivered by SMS text message.","x":"The request arrived by email, not text message."},{"t":"Typosquatting","d":"Registering a look-alike domain that relies on typing mistakes.","x":"The message came from the real mailbox, so no look-alike domain is involved."},{"t":"Watering hole","d":"Compromising a website that a target group is known to visit.","x":"No website is involved. The attacker is using a hijacked mailbox."},null],"src":[["FBI IC3: Business Email Compromise","https://www.ic3.gov/media/2018/180611.aspx"]]},
{"kind":"mcq","d":2,"obj":"2.3","text":"A researcher shows that code running in one guest virtual machine can read memory belonging to the hypervisor and to other guests on the same host. Which vulnerability type is this?","o":["Resource reuse","Sideloading","VM escape","Jailbreaking"],"a":2,"e":"A virtual machine (VM) escape breaks the isolation between a guest and the hypervisor or its neighbors, giving the attacker access to the host and every VM on it.","w":[{"t":"Resource reuse","d":"Virtualized memory or storage handed to a new VM while still holding a previous tenant's data.","x":"That is leftover data, not code actively breaking out of its guest."},{"t":"Sideloading","d":"Installing mobile apps from outside the official app store.","x":"It is a mobile device issue and has nothing to do with hypervisors."},null,{"t":"Jailbreaking","d":"Removing the vendor's restrictions on a mobile operating system.","x":"It targets phones and tablets, not guest isolation on a virtualization host."}],"src":[["NIST Computer Security Resource Center glossary: Escape (from NIST SP 800-125)","https://csrc.nist.gov/glossary/term/escape"]]},
{"kind":"mcq","d":2,"obj":"2.2","text":"A software vendor's update server is compromised, and its next signed update quietly installs a backdoor on thousands of customer machines. Which threat vector does this BEST describe?","o":["Zero-day exploit","Supply chain attack","Watering hole","Default credentials"],"a":1,"e":"A supply chain attack compromises a vendor, supplier, or provider so that the malicious code reaches customers through a trusted channel such as a software update.","w":[{"t":"Zero-day exploit","d":"An attack on a flaw the vendor does not yet know about.","x":"The malware here arrives inside a trusted update. No unknown flaw in the customers' software is required."},null,{"t":"Watering hole","d":"Infecting a website a specific group tends to visit.","x":"Customers are not visiting a booby-trapped site. The vendor's own update channel delivers the code."},{"t":"Default credentials","d":"Factory logins that were never changed.","x":"The compromise is of the vendor's build or update path, not of a login left at its default."}],"src":[["Rapid7: What is a supply chain attack?","https://rapid7.com/fundamentals/supply-chain-attack"],["SY0-701 Study Guide (176 pp.), §2.4"]]},
