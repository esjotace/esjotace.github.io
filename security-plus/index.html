{"kind":"mcq","d":3,"obj":"3.1","text":"A company runs virtual machines in an infrastructure-as-a-service (IaaS) cloud. Under the shared responsibility model, who is responsible for patching the guest operating systems?","o":["The customer","The cloud service provider (CSP)","The hypervisor vendor","The internet service provider"],"a":0,"e":"In IaaS the provider secures the facility, hardware, and hypervisor. The customer is responsible for everything they install on top, including guest OS patching, configuration, and data.","w":[null,{"t":"The cloud service provider (CSP)","d":"The company that operates the underlying cloud platform.","x":"The CSP covers the infrastructure layer, but in IaaS it does not manage the customer's guest operating systems."},{"t":"The hypervisor vendor","d":"The company that develops the virtualization software.","x":"It supplies the hypervisor software and has no role in patching a customer's guests."},{"t":"The internet service provider","d":"The company that supplies network connectivity.","x":"It provides the connection only and has no role in the customer's servers."}],"src":[["AWS Well-Architected Security Pillar: Shared responsibility","https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/shared-responsibility.html"],["SY0-701 Study Guide (176 pp.), §6.2"]]},
{"kind":"mcq","d":3,"obj":"3.1","text":"A DevOps team wants to define servers, networks, and security groups in version-controlled templates so that every environment is built the same way and configuration drift is eliminated. Which concept does this describe?","o":["Software-defined networking","Serverless computing","Microservices","Infrastructure as code"],"a":3,"e":"Infrastructure as code (IaC) manages and provisions infrastructure from machine-readable definition files. Templates in version control give repeatable builds, an audit trail, and easy rollback.","w":[{"t":"Software-defined networking","d":"Separating the control plane from the data plane so the network can be programmed centrally.","x":"SDN controls network behavior. It does not describe defining all infrastructure in version-controlled templates."},{"t":"Serverless computing","d":"The provider runs code on demand with no servers for the customer to manage.","x":"It is an execution model, not a method for templating environments."},{"t":"Microservices","d":"An application built from small, independently deployable services.","x":"It describes how an application is structured, not how infrastructure is provisioned."},null],"src":[["SY0-701 Study Guide (176 pp.), §6.4"]]},
{"kind":"mcq","d":3,"obj":"3.1","text":"A utility wants its SCADA control network to have no electronic path to the corporate network or the internet. Which design achieves this?","o":["VLAN-based logical segmentation","Screened subnet","Air gap","Software-defined networking"],"a":2,"e":"An air-gapped network is physically isolated, with no connection to other networks. That removes remote attack paths, though removable media and insiders remain risks.","w":[{"t":"VLAN-based logical segmentation","d":"Separating traffic into virtual networks on shared switches.","x":"The networks still share physical gear, so a misconfiguration or VLAN-hopping attack can bridge them."},{"t":"Screened subnet","d":"A buffer zone between the internet and the internal network, formerly called a DMZ.","x":"It is a connected zone, so electronic paths still exist."},null,{"t":"Software-defined networking","d":"Central, programmable control of network behavior.","x":"SDN manages connected networks and does not remove the connection."}],"src":[["SY0-701 Study Guide (176 pp.), §7.4-7.5"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A security architect is choosing the failure mode for an inline firewall that guards a payment-processing network. Policy says that if the firewall fails, no traffic may pass, even at the cost of an outage. Which failure mode should be configured?","o":["Fail-open","Fail-closed","Passive tap monitoring","Active-active clustering"],"a":1,"e":"Fail-closed blocks all traffic when the device fails, which protects confidentiality and integrity at the expense of availability. It suits high-security environments.","w":[{"t":"Fail-open","d":"Traffic keeps flowing when the device fails.","x":"That favors availability, which is the opposite of the stated policy."},null,{"t":"Passive tap monitoring","d":"A device that receives a copy of the traffic and cannot block it.","x":"It describes how a sensor is attached, not what happens on failure."},{"t":"Active-active clustering","d":"Two or more devices share the load and back each other up.","x":"It improves availability rather than setting what happens when the firewall fails."}],"src":[["SY0-701 Study Guide (176 pp.), §5.3"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"Administrators must manage servers in an isolated management network. The company wants every administrative session to pass through a single hardened, heavily logged host. Which device should be deployed?","o":["Jump server","Proxy server","Load balancer","Honeypot"],"a":0,"e":"A jump server (jump box) is a hardened system that admins connect to first before reaching devices in a separate security zone. It gives one controlled, auditable entry point.","w":[null,{"t":"Proxy server","d":"An intermediary that forwards client requests, commonly web traffic, to other resources.","x":"It mediates user requests, not administrative access to a management network."},{"t":"Load balancer","d":"Distributes incoming traffic across multiple servers.","x":"It spreads load for availability and does not provide a controlled admin gateway."},{"t":"Honeypot","d":"A decoy system that lures attackers.","x":"It is meant to be attacked and watched, not used by administrators."}],"src":[["Microsoft Learn: When to use Azure Bastion","https://learn.microsoft.com/en-us/training/modules/intro-to-azure-bastion/4-when-to-use-azure-bastion"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A company must protect a public web application from SQL injection and cross-site scripting at the HTTP layer without modifying the application code. Which control should be deployed?","o":["Layer 4 stateful firewall","Network access control","Jump server","Web application firewall (WAF)"],"a":3,"e":"A web application firewall inspects HTTP and HTTPS requests at Layer 7 and blocks known attack patterns such as injection and XSS before they reach the application.","w":[{"t":"Layer 4 stateful firewall","d":"Filters on IP addresses, ports, and connection state.","x":"It cannot read the HTTP payload where the injection string sits."},{"t":"Network access control","d":"Checks the identity and posture of devices when they join a network.","x":"It governs who connects, not what web requests contain."},{"t":"Jump server","d":"A hardened host used as a gateway for administrators.","x":"It is for admin access and does not filter web traffic."},null],"src":[["TechTarget: What is a web application firewall (WAF)?","https://www.techtarget.com/cybersecurity/definition/What-is-a-web-application-firewall-WAF-WAF-explained"],["SY0-701 Study Guide (176 pp.), §9.5"]]},
{"kind":"mcq","d":3,"obj":"3.3","text":"A company storing customer records in a cloud region must ensure the data stays subject to the laws of the country where those customers live. Which concept does this describe?","o":["Data classification","Data masking","Data sovereignty","Geolocation"],"a":2,"e":"Data sovereignty is the principle that data is subject to the laws and governance of the country where it is stored or collected. It drives decisions about where cloud data may be placed.","w":[{"t":"Data classification","d":"Labeling data by sensitivity, such as public or confidential.","x":"It rates sensitivity and does not decide which country's laws apply."},{"t":"Data masking","d":"Obscuring parts of a data value, such as hiding all but the last four digits.","x":"It hides values and does not relate to legal jurisdiction."},null,{"t":"Geolocation","d":"Identifying the physical location of a device or user.","x":"It locates things. The concept described is the legal authority over where data resides."}],"src":[["SY0-701 Study Guide (176 pp.), §16.2"]]},
{"kind":"mcq","d":4,"obj":"4.4","text":"A security operations center wants to collect logs from firewalls, servers, and endpoints in one place, correlate events across them, and generate alerts. Which tool BEST fits?","o":["SNMP trap","SIEM","NetFlow","Vulnerability scanner"],"a":1,"e":"A security information and event management (SIEM) system aggregates logs from many sources, correlates events, and raises alerts, and it keeps the data for reporting and investigation.","w":[{"t":"SNMP trap","d":"A notification a network device sends when a threshold or event occurs.","x":"It reports from one device and does not correlate across sources."},null,{"t":"NetFlow","d":"Metadata about network traffic flows.","x":"It provides traffic statistics, not log aggregation from servers and endpoints."},{"t":"Vulnerability scanner","d":"A tool that probes systems for known weaknesses.","x":"It finds flaws and does not collect and correlate logs."}],"src":[["SY0-701 Study Guide (176 pp.), §8.7, §12.5"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"Employees of a partner company must log in to your web portal using their own company credentials, with your portal trusting the partner's identity provider through XML-based assertions. Which technology BEST supports this?","o":["SAML","OAuth","LDAP","RADIUS"],"a":0,"e":"Security Assertions Markup Language (SAML) lets an identity provider pass XML assertions about a user to a service provider, enabling federation and single sign-on across organizations.","w":[null,{"t":"OAuth","d":"An authorization framework that delegates access to resources using tokens.","x":"It is about delegated authorization and does not use XML assertions to log users in across organizations."},{"t":"LDAP","d":"A protocol for querying and modifying directory entries.","x":"It looks up directory data and does not federate identities between companies."},{"t":"RADIUS","d":"An AAA protocol for authenticating network access.","x":"It controls network access such as VPN or Wi-Fi, not web portal federation."}],"src":[["Wikipedia: SAML 2.0","https://en.wikipedia.org/wiki/SAML_2.0"]]},
{"kind":"mcq","d":4,"obj":"4.3","text":"A vulnerability scanner reported a server as fully patched. Later, an attacker exploited a known flaw on that same server. How should the scanner's original result be classified?","o":["False positive","True positive","True negative","False negative"],"a":3,"e":"A false negative is a real weakness that a tool fails to report. Validating results with credentialed scans or other methods helps catch them.","w":[{"t":"False positive","d":"A reported issue that does not actually exist.","x":"The flaw did exist, and the scanner missed it."},{"t":"True positive","d":"A real issue that is correctly reported.","x":"The scanner did not report the flaw."},{"t":"True negative","d":"No issue reported where none exists.","x":"A flaw was present, so \"no issues\" was wrong."},null],"src":[["SY0-701 Study Guide (176 pp.), §8.9"]]},
{"kind":"mcq","d":5,"obj":"5.1","text":"Which document provides detailed, step-by-step instructions that staff follow to carry out a specific security task, such as onboarding a new employee?","o":["Policy","Standard","Procedure","Guideline"],"a":2,"e":"A procedure lists the exact steps to complete a task. Policies set direction, standards set requirements, and guidelines give recommendations, but only procedures say how to do it step by step.","w":[{"t":"Policy","d":"A high-level statement of management's intent and rules.","x":"It says what must be done and why, not the step-by-step how."},{"t":"Standard","d":"A specific, mandatory requirement that supports a policy.","x":"It sets a requirement, not a sequence of steps."},null,{"t":"Guideline","d":"Recommended, optional advice.","x":"It is not a set of required steps."}],"src":[["SY0-701 Study Guide (176 pp.), §14.4"]]},
{"kind":"mcq","d":5,"obj":"5.1","text":"In a data governance model, which role handles the day-to-day storage, backup, and technical protection of data but does not decide who may access it?","o":["Data owner","Data custodian","Data controller","Data processor"],"a":1,"e":"A data custodian manages the systems where data is stored, including access control, encryption, and backups, on behalf of the owner. The owner has ultimate responsibility and directs the controls. (A data steward is a separate role focused on data quality and labeling.)","w":[{"t":"Data owner","d":"The person accountable for the data who sets classification and access.","x":"The owner makes those decisions, so this is the role the question excludes."},null,{"t":"Data controller","d":"The entity that decides why and how personal data is processed.","x":"It is a privacy-law role about purposes, not hands-on storage and backup."},{"t":"Data processor","d":"An entity that processes personal data on behalf of a controller.","x":"It is a privacy-law role for third-party processing, not the internal role described."}],"src":[["SY0-701 Study Guide (176 pp.), §16.1"]]},
{"kind":"mcq","d":5,"obj":"5.1","text":"A company issues a document that mandates specific, measurable requirements for all systems, such as a minimum password length of 14 characters. What type of document is this?","o":["Standard","Guideline","Procedure","Playbook"],"a":0,"e":"A standard defines specific, mandatory requirements that support a policy. A minimum password length of 14 characters is a typical example.","w":[null,{"t":"Guideline","d":"Recommended practices that are not mandatory.","x":"The question says the requirements are mandated."},{"t":"Procedure","d":"Step-by-step instructions for a task.","x":"It gives steps, not required measurable settings."},{"t":"Playbook","d":"A checklist of response actions for a particular type of incident.","x":"It guides incident response and does not set requirements for systems."}],"src":[["SY0-701 Study Guide (176 pp.), §14.4"]]},
{"kind":"mcq","d":5,"obj":"5.2","text":"Management states that the payroll system must be restored within 6 hours of an outage. Which business impact analysis metric is this?","o":["Recovery point objective (RPO)","Mean time to repair (MTTR)","Mean time between failures (MTBF)","Recovery time objective (RTO)"],"a":3,"e":"The recovery time objective is the maximum acceptable time to restore a system or process after a disruption.","w":[{"t":"Recovery point objective (RPO)","d":"The maximum acceptable amount of data loss, measured in time.","x":"The statement is about how long restoration may take, not how much data can be lost."},{"t":"Mean time to repair (MTTR)","d":"The average time needed to repair a failed component.","x":"It is a measured average, not a target set by management."},{"t":"Mean time between failures (MTBF)","d":"The average time a system runs between failures.","x":"It describes reliability, not a restoration deadline."},null],"src":[["SY0-701 Study Guide (176 pp.), §15.3"]]},
{"kind":"mcq","d":5,"obj":"5.2","text":"Management can tolerate losing no more than 2 hours of transaction data after a failure. What does this requirement define?","o":["Recovery time objective (RTO)","Mean time between failures (MTBF)","Recovery point objective (RPO)","Annualized loss expectancy (ALE)"],"a":2,"e":"The recovery point objective is the maximum tolerable data loss measured in time, and it sets how often backups or replication must run (here, at least every 2 hours).","w":[{"t":"Recovery time objective (RTO)","d":"The maximum acceptable time to restore service.","x":"It is about downtime, not how much data may be lost."},{"t":"Mean time between failures (MTBF)","d":"The average time between failures of a component.","x":"It measures reliability and says nothing about tolerable data loss."},null,{"t":"Annualized loss expectancy (ALE)","d":"The expected yearly financial loss from a risk.","x":"It is a dollar figure, not a data-loss tolerance in time."}],"src":[["NIST CSRC glossary: Recovery Point Objective (from NIST SP 800-34 Rev. 1)","https://csrc.nist.gov/glossary/term/Recovery_Point_Objective"],["SY0-701 Study Guide (176 pp.), §15.3"]]},
{"kind":"mcq","d":5,"obj":"5.2","text":"A company buys a cyber insurance policy to cover the costs of a ransomware incident. Which risk management strategy is this?","o":["Accept","Transfer","Avoid","Mitigate"],"a":1,"e":"Risk transference shifts the financial impact to another party, most commonly through insurance or by outsourcing. The risk itself still exists.","w":[{"t":"Accept","d":"Acknowledging a risk and choosing to live with it, sometimes through an exemption or exception.","x":"The company is paying someone else to cover the loss."},null,{"t":"Avoid","d":"Stopping the activity that creates the risk.","x":"The activity continues, so the risk is not avoided."},{"t":"Mitigate","d":"Reducing the likelihood or impact with controls.","x":"Insurance does not reduce likelihood or impact, it only reimburses the loss."}],"src":[["SY0-701 Study Guide (176 pp.), §15.2"]]},
{"kind":"mcq","d":5,"obj":"5.2","text":"After a risk assessment, leadership decides to stop offering a legacy product that required storing card data, which eliminates the risk. Which risk management strategy is this?","o":["Avoid","Transfer","Mitigate","Accept"],"a":0,"e":"Risk avoidance removes the activity that creates the risk altogether, so the exposure disappears.","w":[null,{"t":"Transfer","d":"Shifting the financial impact to a third party.","x":"Nothing is shifted. The activity is simply ended."},{"t":"Mitigate","d":"Reducing likelihood or impact with controls.","x":"The company is not adding controls. It is removing the risky activity."},{"t":"Accept","d":"Choosing to live with a risk.","x":"The risk is eliminated, not tolerated."}],"src":[["SY0-701 Study Guide (176 pp.), §15.2"]]},
{"kind":"mcq","d":5,"obj":"5.2","text":"Which document lists identified risks along with their owners, ratings, key risk indicators, and risk thresholds?","o":["Business impact analysis","Statement of work","Gap analysis","Risk register"],"a":3,"e":"A risk register is the central record of identified risks and tracks owners, scores, indicators, and thresholds as part of ongoing risk management.","w":[{"t":"Business impact analysis","d":"Identifies critical functions and the effect of their disruption, including RTO and RPO.","x":"It measures impact of outages and is not the record of all risks."},{"t":"Statement of work","d":"Defines a vendor's deliverables, timeline, and cost.","x":"It scopes a project and does not track risks."},{"t":"Gap analysis","d":"Compares the current state to a desired baseline.","x":"It shows what is missing and does not track owners and thresholds."},null],"src":[["SY0-701 Study Guide (176 pp.), §15.1-15.2"]]},
{"kind":"mcq","d":5,"obj":"5.2","text":"A flood is expected to damage a data center once every four years. What is the annualized rate of occurrence (ARO)?","o":["4","0.5","0.25","1"],"a":2,"e":"ARO is the number of times a threat is expected to occur per year. Once every four years is 1 / 4 = 0.25.","w":[{"t":"4","d":"Four events per year.","x":"Four is the number of years between events, not events per year."},{"t":"0.5","d":"One event every two years.","x":"That would be a flood every two years, not every four."},null,{"t":"1","d":"One event per year.","x":"That would be a yearly flood."}],"src":[["SY0-701 Study Guide (176 pp.), §15.1"]]},
{"kind":"mcq","d":5,"obj":"5.3","text":"Which agreement type defines measurable service levels, such as 99.9% uptime, and the remedies if the provider misses them?","o":["Non-disclosure agreement (NDA)","Service-level agreement (SLA)","Memorandum of understanding (MOU)","Statement of work (SOW)"],"a":1,"e":"A service-level agreement specifies the expected level of service and the consequences of falling short, which makes it a core tool for third-party risk management.","w":[{"t":"Non-disclosure agreement (NDA)","d":"A contract protecting confidential information.","x":"It covers secrecy, not service levels."},null,{"t":"Memorandum of understanding (MOU)","d":"A general, usually non-binding statement of shared intent.","x":"It does not set measurable service levels or remedies."},{"t":"Statement of work (SOW)","d":"Defines the work, deliverables, and timeline for a project.","x":"It scopes the work and does not define uptime targets and penalties."}],"src":[["SY0-701 Study Guide (176 pp.), §15.4"]]},
{"kind":"mcq","d":5,"obj":"5.3","text":"A company wants the contractual ability to inspect a vendor's security controls directly. Which provision should it require?","o":["Right-to-audit clause","Non-disclosure agreement","Rules of engagement","Business partners agreement"],"a":0,"e":"A right-to-audit clause lets the customer, or an auditor it chooses, examine the vendor's controls and records. It is part of vendor assessment.","w":[null,{"t":"Non-disclosure agreement","d":"A contract that keeps information confidential.","x":"It restricts sharing and does not grant inspection rights."},{"t":"Rules of engagement","d":"Define the scope and permitted actions for a penetration test.","x":"They govern testing activity, not general audit access to a vendor."},{"t":"Business partners agreement","d":"A contract between business partners, such as a company and its resellers, setting out the terms of their relationship.","x":"It describes the partnership, not inspection rights over security controls."}],"src":[["Pivot Point Security: Reasons to exercise your right to audit vendors","https://www.pivotpointsecurity.com/4-reasons-to-establish-and-exercise-your-right-to-audit-vendors/"]]},
{"kind":"mcq","d":5,"obj":"5.4","text":"A European customer asks a company to delete all the personal data it holds about them. Which privacy concept supports this request?","o":["Data retention","Data inventory","Data sovereignty","Right to be forgotten"],"a":3,"e":"The right to be forgotten (erasure) lets a data subject ask an organization to delete their personal data, subject to legal limits. GDPR is the best-known source.","w":[{"t":"Data retention","d":"Rules for how long data is kept.","x":"It sets keeping periods and does not give the person a right to request erasure."},{"t":"Data inventory","d":"A catalog of what data is held and where.","x":"It records data and does not delete it."},{"t":"Data sovereignty","d":"Data is subject to the laws of the country where it is stored.","x":"It concerns legal jurisdiction, not the individual's right to deletion."},null],"src":[["GDPR Article 17: Right to erasure ('right to be forgotten')","https://gdpr-text.com/read/article-17/"]]},
{"kind":"mcq","d":5,"obj":"5.5","text":"A penetration tester collects employee names and email formats from public social media and archived public DNS databases without sending any traffic to the target. What type of reconnaissance is this?","o":["Active reconnaissance","Known-environment testing","Passive reconnaissance","Physical penetration testing"],"a":2,"e":"Passive reconnaissance gathers information without directly interacting with the target, using sources such as public records, search engines, and social media.","w":[{"t":"Active reconnaissance","d":"Directly interacting with the target, for example with port scans.","x":"No traffic is sent to the target here."},{"t":"Known-environment testing","d":"The tester is given full information about the environment.","x":"It describes how much the tester is told, not how information is gathered."},null,{"t":"Physical penetration testing","d":"Testing locks, badges, and other physical controls.","x":"The activity is online research, not testing physical controls."}],"src":[["SY0-701 Study Guide (176 pp.), §15.6"]]},
{"kind":"mcq","d":1,"obj":"1.1","text":"A security team compares its current controls against a published framework and produces a report listing missing or poorly configured controls with recommendations. What is this activity called?","o":["Penetration test","Gap analysis","Business impact analysis","Risk register"],"a":1,"e":"A gap analysis identifies how an organization's security deviates from what a framework or compliance requirement calls for. It is usually done when adopting a framework or facing a new requirement, and it often involves outside consultants.","w":[{"t":"Penetration test","d":"An authorized simulated attack that tries to exploit weaknesses and prove they are real.","x":"The team is comparing controls to a framework, not attacking systems."},null,{"t":"Business impact analysis","d":"An assessment of the losses that could result from disruption of business functions.","x":"It measures the effect of outages, not how closely controls match a framework."},{"t":"Risk register","d":"A document that records identified risks with ratings and owners.","x":"A register tracks risks; it does not compare controls against a framework."}],"src":[["SY0-701 Study Guide (176 pp.), §1.3"]]},
{"kind":"mcq","d":1,"obj":"1.1","text":"A hospital cannot patch an old imaging system because the vendor no longer supports it. The security team places the system on an isolated network segment with strict firewall rules instead. Which control type is this?","o":["Compensating","Corrective","Deterrent","Directive"],"a":0,"e":"A compensating control substitutes for a principal control that cannot be applied, giving similar protection by a different method. Isolating the unpatchable system stands in for patching.","w":[null,{"t":"Corrective","d":"A control that reduces the impact of an incident after it occurs, such as restoring from backup.","x":"The isolation is applied beforehand to stand in for a missing patch, not to repair damage."},{"t":"Deterrent","d":"A control meant to discourage an attacker from trying, such as warning signs.","x":"Network isolation limits access; it does not merely discourage attempts."},{"t":"Directive","d":"A control that tells people what they must or must not do, such as a policy.","x":"This is a technical restriction, not an instruction to staff."}],"src":[["SY0-701 Study Guide (176 pp.), §1.6, §2.5"]]},
{"kind":"mcq","d":1,"obj":"1.1","text":"A company posts signs at its server room entrance warning that the area is monitored and that unauthorized entry will be prosecuted. Which functional type of control are the signs?","o":["Preventive","Detective","Corrective","Deterrent"],"a":3,"e":"Deterrent controls discourage a would-be intruder psychologically, for example with warnings of legal penalties. They do not physically stop anyone.","w":[{"t":"Preventive","d":"A control that stops an action from succeeding, such as a locked door.","x":"A sign cannot physically block entry."},{"t":"Detective","d":"A control that identifies or records an event that has happened, such as a camera or log.","x":"The sign does not record or alert on anything."},{"t":"Corrective","d":"A control that limits damage or restores normal operation after an event.","x":"Nothing is being repaired or restored."},null],"src":[["SY0-701 Study Guide (176 pp.), §1.6"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"A system stores each password as a hash computed from the password plus a unique random value that is kept alongside the hash. What is the main benefit of the random value?","o":["It makes the hash reversible","It encrypts the hash with a secret key","It defeats precomputed hash tables, so identical passwords produce different hashes","It shortens the hash so it is faster to compare"],"a":2,"e":"This value is a salt. It is not secret, but because it differs per account an attacker cannot use a precomputed table such as a rainbow table and must attack each hash separately.","w":[{"t":"It makes the hash reversible","d":"Reversible means the original input could be recovered from the output.","x":"Hashes remain one-way; a salt does not change that."},{"t":"It encrypts the hash with a secret key","d":"Encryption protects data with a key so it can be decrypted later.","x":"The salt is stored with the hash and is not a secret key."},null,{"t":"It shortens the hash so it is faster to compare","d":"A shorter output would be quicker to store and check.","x":"A salt does not shorten the output, and speed is not its purpose."}],"src":[["SY0-701 Study Guide (176 pp.), §3.5"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"A web server administrator wants to obtain a certificate. The administrator generates a key pair and sends the CA a file containing the public key and identity details for the server. What is this file called?","o":["Certificate revocation list","Certificate signing request (CSR)","Online Certificate Status Protocol response","Root certificate"],"a":1,"e":"A subject submits a CSR to a certificate authority. The CA verifies the information and, if accepted, signs the certificate and returns it.","w":[{"t":"Certificate revocation list","d":"A list published by a CA of certificates that are no longer valid.","x":"A CRL is issued by the CA to report revoked certificates, not sent to request one."},null,{"t":"Online Certificate Status Protocol response","d":"A reply from a responder about whether a specific certificate is revoked.","x":"OCSP checks status of an existing certificate; it does not request a new one."},{"t":"Root certificate","d":"The self-signed certificate at the top of a chain of trust.","x":"It anchors trust; it is not a request submitted by a server."}],"src":[["SY0-701 Study Guide (176 pp.), §3.6"]]},
{"kind":"mcq","d":2,"obj":"2.2","text":"Attackers compromise a website that employees of a particular industry visit regularly and add malicious code to it. Which term describes this attack?","o":["Watering hole","Typosquatting","Pharming","Whaling"],"a":0,"e":"A watering hole attack targets a specific group by infecting sites its members are known to visit, or by creating a new site that will attract them.","w":[null,{"t":"Typosquatting","d":"Registering misspelled versions of popular domain names to catch mistaken visitors.","x":"The attackers altered a legitimate site; they did not register a lookalike domain."},{"t":"Pharming","d":"Redirecting users to a fake site, for example through DNS cache poisoning.","x":"Users here reach the real site, which is itself compromised."},{"t":"Whaling","d":"A phishing attack aimed at senior executives.","x":"This is not an email attack on executives; it relies on a site visited by a group."}],"src":[["SY0-701 Study Guide (176 pp.), §2.8"]]},
{"kind":"mcq","d":2,"obj":"2.2","text":"An attacker without a badge waits at a secured door and slips inside right behind an employee who does not notice. Which attack is this?","o":["Shoulder surfing","Dumpster diving","Vishing","Tailgating"],"a":3,"e":"Tailgating means following an authorized person into a restricted area without authorization. Mantraps and access control vestibules are common countermeasures.","w":[{"t":"Shoulder surfing","d":"Watching someone enter or view sensitive information.","x":"The attacker is entering a building, not observing a screen or keypad."},{"t":"Dumpster diving","d":"Searching discarded material for sensitive information.","x":"No trash is searched."},{"t":"Vishing","d":"Social engineering over a phone call.","x":"No phone call is involved."},null],"src":[["SY0-701 Study Guide (176 pp.), §2.8"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An attacker tries one common password, such as \"Summer2026!\", against thousands of different usernames, then waits and tries a second password. Which attack is this?","o":["Dictionary attack","Rainbow table attack","Password spraying","Credential stuffing"],"a":2,"e":"Password spraying is a horizontal brute force attack: few passwords across many accounts. Because each account sees few failures, it often avoids per-account lockout thresholds.","w":[{"t":"Dictionary attack","d":"Trying many words and common phrases against a single target credential or hash.","x":"The pattern here is one password across many accounts, not many guesses against one."},{"t":"Rainbow table attack","d":"Using precomputed hash tables to look up plaintexts for captured hashes.","x":"No hashes have been captured; the attack is against a live login."},null,{"t":"Credential stuffing","d":"Replaying username and password pairs leaked from other breaches.","x":"The attacker is guessing one common password, not reusing stolen pairs."}],"src":[["SY0-701 Study Guide (176 pp.), §13.6"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An analyst finds that an infection left no executable on disk. The malware ran inside a legitimate process in memory and used PowerShell to carry out actions. Which term fits?","o":["Boot sector virus","Fileless malware","Logic bomb","Potentially unwanted program"],"a":1,"e":"Fileless malware does not write its code to disk. It runs memory-resident, often \"living off the land\" with legitimate tools like PowerShell, which helps it evade signature-based scanners.","w":[{"t":"Boot sector virus","d":"A virus written to the disk's boot sector that loads when the system starts.","x":"It would leave code in the boot sector on disk."},null,{"t":"Logic bomb","d":"Code that triggers a harmful action when a condition is met.","x":"The key feature here is the absence of a file, not a trigger condition."},{"t":"Potentially unwanted program","d":"Software installed alongside a chosen package that may not be malicious.","x":"That describes bundled software, not a memory-only attack."}],"src":[["SY0-701 Study Guide (176 pp.), §13.3"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An attacker on a local network broadcasts unsolicited ARP replies so that other hosts associate the default gateway's IP address with the attacker's MAC address. What is this attack?","o":["ARP poisoning","MAC flooding","DNS cache poisoning","DHCP starvation"],"a":0,"e":"ARP has no security mechanism, so hosts trust unsolicited replies and update their caches. This allows on-path (man-in-the-middle) interception of traffic.","w":[null,{"t":"MAC flooding","d":"Overwhelming a switch's address table so it floods traffic out all ports.","x":"That targets the switch's table, not the ARP caches of hosts."},{"t":"DNS cache poisoning","d":"Inserting false DNS records into a resolver's cache.","x":"The false mapping here is between IP and MAC, not a hostname and IP."},{"t":"DHCP starvation","d":"Exhausting a DHCP server's pool of addresses.","x":"No address leases are being requested."}],"src":[["SY0-701 Study Guide (176 pp.), §5.4"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"Visitors see a wireless network named \"CoffeeShop-Guest\" with strong signal, but it was set up by an attacker, not the shop. The attacker captures traffic from those who connect. What is this called?","o":["Bluejacking","Disassociation attack","Wi-Fi jamming","Evil twin"],"a":3,"e":"An evil twin is a rogue access point masquerading as a legitimate one, often with a similar or identical SSID. It lets the attacker intercept traffic from connecting clients.","w":[{"t":"Bluejacking","d":"Sending unsolicited messages to a discoverable Bluetooth device.","x":"This involves Wi-Fi, not Bluetooth messaging."},{"t":"Disassociation attack","d":"Sending spoofed management frames to disconnect clients from an access point.","x":"The attacker here lures clients to a fake network rather than just disconnecting them."},{"t":"Wi-Fi jamming","d":"Interfering with radio signals to deny wireless service.","x":"The goal is interception through a fake network, not denial of service."},null],"src":[["SY0-701 Study Guide (176 pp.), §9.3"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"A web server request contains the path \"../../../etc/passwd\" and returns a file outside the web root. Which attack does this indicate?","o":["Command injection","Server-side request forgery","Directory traversal","Cross-site scripting"],"a":2,"e":"Directory traversal submits a path that navigates to a parent directory (../) to read files outside the web server's root. Attackers may disguise the input with encoding.","w":[{"t":"Command injection","d":"Inserting operating system commands into input the server executes.","x":"The request asks to read a file by path; it does not include commands to run."},{"t":"Server-side request forgery","d":"Causing the server to send requests to other internal or external services.","x":"Nothing here makes the server contact another service."},null,{"t":"Cross-site scripting","d":"Injecting script that runs in another user's browser.","x":"The result is a file leak from the server, not script execution in a browser."}],"src":[["SY0-701 Study Guide (176 pp.), §13.11"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"A user is signed in to an online bank. They open a malicious page that silently causes their browser to send a funds-transfer request to the bank, which accepts it because the session cookie is valid. Which attack is this?","o":["Session replay","Cross-site request forgery","Clickjacking","SQL injection"],"a":1,"e":"CSRF exploits a site's trust in the user's authenticated browser session. The attacker causes the victim's browser to submit a forged request that the site treats as genuine.","w":[{"t":"Session replay","d":"Capturing or guessing a session token and reusing it to re-establish a session.","x":"The attacker does not steal the token; the victim's own browser makes the request."},null,{"t":"Clickjacking","d":"Overlaying a hidden layer so the user's clicks go somewhere unintended.","x":"Here a request is forged by a page, not hijacked through a hidden overlay."},{"t":"SQL injection","d":"Inserting query code through input to alter a database query.","x":"No malformed input is being passed to a database."}],"src":[["SY0-701 Study Guide (176 pp.), §13.10"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"A login form builds a database query directly from user input. An attacker enters ' OR '1'='1 as the password and is logged in without valid credentials. Which attack is this?","o":["SQL injection","LDAP injection","Buffer overflow","Directory traversal"],"a":0,"e":"SQL injection places query code in input that the application concatenates into a query. Input validation and parameterized queries or stored procedures reduce the risk.","w":[null,{"t":"LDAP injection","d":"Manipulating directory queries through unsanitized input.","x":"The back end here is a database queried with SQL, not a directory."},{"t":"Buffer overflow","d":"Writing more data than a fixed-size memory buffer can hold.","x":"No memory is being overrun; the input changes query logic."},{"t":"Directory traversal","d":"Using ../ sequences to reach files outside the web root.","x":"No file path is involved."}],"src":[["SY0-701 Study Guide (176 pp.), §11.5, §13.8"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A firewall automatically allows return traffic for connections that internal hosts started, because it keeps a table of active sessions. Which type of firewall behaves this way?","o":["Stateless packet filter","Web application firewall","Network-based IDS","Stateful inspection firewall"],"a":3,"e":"A stateful firewall tracks session information in a state table and checks that arriving packets belong to an existing connection. A basic packet filter does not preserve session state.","w":[{"t":"Stateless packet filter","d":"A filter that judges each packet alone by header rules, without remembering sessions.","x":"It would not know a packet is part of an existing connection."},{"t":"Web application firewall","d":"A device that filters HTTP traffic to protect web applications from attacks like injection.","x":"Its purpose is application-layer web protection, not tracking sessions generally."},{"t":"Network-based IDS","d":"A sensor that detects and alerts on malicious traffic but does not block it.","x":"It does not filter or permit traffic."},null],"src":[["SY0-701 Study Guide (176 pp.), §5.8"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A security team wants a sensor that receives a copy of every frame on a link, including those with errors, and that will not drop copies when the switch is busy. Which option fits BEST?","o":["SPAN port","Inline IPS","Network TAP","Load balancer"],"a":2,"e":"A TAP is a device with ports for incoming and outgoing cabling that physically copies the signal to a monitor port, so every frame is copied. A switch's SPAN port can drop frames under heavy load and does not mirror frames with errors.","w":[{"t":"SPAN port","d":"A switch port configured to receive mirrored copies of traffic from other ports.","x":"It is not completely reliable: frames may be dropped under heavy load."},{"t":"Inline IPS","d":"A prevention device placed in the traffic path that can block attacks.","x":"It sits in the path and acts on traffic; the goal here is passive copying."},null,{"t":"Load balancer","d":"A device that distributes traffic between servers.","x":"It does not copy traffic for analysis."}],"src":[["SY0-701 Study Guide (176 pp.), §5.3"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A remote-access VPN is configured so that all of a user's traffic, including web browsing, is sent through the corporate network. Which configuration is this?","o":["Split tunnel","Full tunnel","Out-of-band management","Site-to-site VPN"],"a":1,"e":"With a full tunnel, internet access is mediated by the corporate network, which alters the client's IP address and DNS servers. This offers better security but can cause issues with some websites, especially cloud services.","w":[{"t":"Split tunnel","d":"Only traffic for the corporate network goes through the VPN; other traffic uses the client's own connection.","x":"That is the opposite: browsing would bypass the corporate network."},null,{"t":"Out-of-band management","d":"Managing devices over a path separate from production traffic, such as a serial console.","x":"That is about management links, not routing a user's traffic."},{"t":"Site-to-site VPN","d":"A VPN linking two or more private networks, typically automatic.","x":"It connects networks, not one remote user's traffic."}],"src":[["SY0-701 Study Guide (176 pp.), §5.10"]]},
{"kind":"mcq","d":3,"obj":"3.1","text":"A development team runs a function in the cloud only when an event occurs. It is billed on execution time and never manages servers or patches an operating system. Which model is this?","o":["Serverless (function as a service)","Infrastructure as a service","Software as a service","Infrastructure as code"],"a":0,"e":"Serverless architecture, also called function as a service, removes the need to manage physical or virtual server instances, with billing based on execution time rather than hourly charges.","w":[null,{"t":"Infrastructure as a service","d":"The provider supplies virtualized servers, storage, and networking that the customer configures and patches.","x":"The customer would manage instances and operating systems."},{"t":"Software as a service","d":"A complete application delivered by the provider, such as email.","x":"The team is running its own code, not using a finished app."},{"t":"Infrastructure as code","d":"Managing infrastructure through version-controlled scripts and templates.","x":"It is a way to define infrastructure, not a billing and execution model."}],"src":[["SY0-701 Study Guide (176 pp.), §6.4"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A company wants visibility into which cloud applications employees use, with policy enforcement and data exfiltration monitoring between users and cloud providers. Which solution is designed for this?","o":["Web application firewall","Network access control","Intrusion prevention system","Cloud access security broker (CASB)"],"a":3,"e":"A CASB provides visibility into how clients use cloud services, can enforce access controls, scan for malware, monitor activity, and mitigate data exfiltration. It can run as a forward proxy, reverse proxy, or through APIs.","w":[{"t":"Web application firewall","d":"A filter that protects web applications from attacks such as injection.","x":"It protects one application rather than governing employee use of many cloud services."},{"t":"Network access control","d":"A system that checks devices and users before allowing network access.","x":"It admits devices to the network; it does not monitor cloud usage."},{"t":"Intrusion prevention system","d":"A device that detects and blocks malicious network activity.","x":"It is not built to govern use of cloud services."},null],"src":[["SY0-701 Study Guide (176 pp.), §6.3"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A company places its public web server in a network segment between an external firewall and the internal network, so external users can reach it without touching internal systems. What is this segment called?","o":["Air-gapped network","Extranet","Screened subnet","Enclave"],"a":2,"e":"A screened subnet (formerly DMZ) holds internet-facing hosts. It has connections to both trusted and untrusted networks while limiting what outside users can reach.","w":[{"t":"Air-gapped network","d":"A network with no connection to untrusted networks.","x":"The web server must accept connections from the internet."},{"t":"Extranet","d":"A semi-trusted network for partners, suppliers, or customers.","x":"It serves specific business parties rather than the general public."},null,{"t":"Enclave","d":"A restricted network within a trusted network.","x":"It protects internal assets; it is not the public-facing area."}],"src":[["SY0-701 Study Guide (176 pp.), §5.2, §10.2"]]},
{"kind":"mcq","d":3,"obj":"3.3","text":"A customer service application shows agents only the last four digits of a card number, with the rest replaced by \"X\". Which data protection method is this?","o":["Tokenization","Data masking","Hashing","Steganography"],"a":1,"e":"Masking redacts all or part of a field, for example by substituting characters, so users see only what they need while the full value is protected.","w":[{"t":"Tokenization","d":"Replacing a value with a random token and storing the original in a separate vault.","x":"Here the display is redacted with fixed characters; no token is substituted."},null,{"t":"Hashing","d":"Producing a fixed-length one-way digest from data.","x":"A hash would not leave the last four digits readable."},{"t":"Steganography","d":"Hiding the existence of a message inside another file.","x":"Nothing is hidden within a cover file."}],"src":[["SY0-701 Study Guide (176 pp.), §16.3"]]},
{"kind":"mcq","d":3,"obj":"3.4","text":"A server uses three or more disks, with data striped across them and extra parity information stored so the volume continues if one disk fails. Which RAID level is this?","o":["RAID 5","RAID 0","RAID 1","RAID 6"],"a":0,"e":"RAID 5 stripes data with parity across three or more disks and tolerates one disk failure, with better storage efficiency than mirroring.","w":[null,{"t":"RAID 0","d":"Striping data across disks for performance without redundancy.","x":"It has no parity; one failure loses the volume."},{"t":"RAID 1","d":"Mirroring data on two disks; storage efficiency is 50%.","x":"It mirrors rather than using parity."},{"t":"RAID 6","d":"Double parity, tolerating two failed disks.","x":"The scenario describes single parity and one-disk tolerance."}],"src":[["SY0-701 Study Guide (176 pp.), §7.2"]]},
{"kind":"mcq","d":4,"obj":"4.1","text":"A system administrator wants backups where a restore needs only the last full backup plus the most recent backup taken since. Which type should be used?","o":["Incremental","Full","Snapshot","Differential"],"a":3,"e":"A differential backup copies everything new or changed since the last full backup, so a restore needs the full backup and the latest differential. Incremental backups are quicker to take but need each later set to restore.","w":[{"t":"Incremental","d":"Copies only files changed since the previous backup of any kind.","x":"A restore needs the full backup plus every incremental since."},{"t":"Full","d":"Copies all files and directories each time.","x":"It takes the longest to create; the scenario describes a restore of full plus one set."},{"t":"Snapshot","d":"A point-in-time copy of a volume or system state, useful for open files.","x":"It is not defined by building on the last full backup."},null],"src":[["SY0-701 Study Guide (176 pp.), §7.1"]]},
{"kind":"mcq","d":4,"obj":"4.1","text":"A company replicates its database to a second site and requires every replica to hold identical data at all times. Which approach writes data to all replicas at once?","o":["Asynchronous replication","Differential backup","Synchronous replication","Snapshot"],"a":2,"e":"Synchronous replication writes to all replicas simultaneously, so they always hold the same data. Asynchronous replication writes to the primary first and copies later.","w":[{"t":"Asynchronous replication","d":"Writes to primary storage first, then copies to replicas at intervals.","x":"Replicas can lag, so it is a poor fit when consistency is required."},{"t":"Differential backup","d":"Copies files changed since the last full backup.","x":"It is a periodic backup, not continuous replication."},null,{"t":"Snapshot","d":"A point-in-time copy of a system or disk.","x":"It captures one moment; it does not keep replicas identical."}],"src":[["SY0-701 Study Guide (176 pp.), §7.2"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"A biometric fingerprint scanner admits an unauthorized person who is not enrolled. Which error has occurred?","o":["False rejection","False acceptance","Crossover error rate","Enrollment"],"a":1,"e":"A false acceptance occurs when an interloper is accepted. It is also called a type 2 error or false match rate. False rejection is the reverse: a legitimate user is not recognized.","w":[{"t":"False rejection","d":"A legitimate user is not recognized.","x":"The person here should not have been accepted."},null,{"t":"Crossover error rate","d":"The point where false rejection and false acceptance rates are equal; lower means a more accurate system.","x":"It is a measure for comparing systems, not an individual error."},{"t":"Enrollment","d":"The initial scan that creates a user's stored template.","x":"It is the setup step, not an error at authentication."}],"src":[["SY0-701 Study Guide (176 pp.), §4.3"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"Which password policy is consistent with current NIST guidance?","o":["Block commonly used passwords and do not force periodic changes without a reason","Require a change every 30 days","Require one uppercase letter, one digit, and one symbol","Let users set a password hint for recovery"],"a":0,"e":"NIST guidance advises against forced complexity rules, against mandatory periodic changes, and against password hints. The main restriction should be blocking common passwords.","w":[null,{"t":"Require a change every 30 days","d":"A fixed aging policy forcing new passwords.","x":"NIST advises against routine forced aging."},{"t":"Require one uppercase letter, one digit, and one symbol","d":"A composition or complexity rule.","x":"NIST advises against enforcing complexity rules."},{"t":"Let users set a password hint for recovery","d":"A stored hint that helps recall a password.","x":"NIST advises against password hints."}],"src":[["SY0-701 Study Guide (176 pp.), §4.4"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"A company grants access based on a combination of the user's department, the device's compliance status, the time of day, and the user's location. Which model is this?","o":["Role-based access control","Mandatory access control","Discretionary access control","Attribute-based access control"],"a":3,"e":"ABAC is the most fine-grained model, deciding access from combinations of subject, object, and system-wide attributes.","w":[{"t":"Role-based access control","d":"Rights are assigned through roles.","x":"A single role does not capture device status, time, and location."},{"t":"Mandatory access control","d":"Access is decided by security labels and clearance levels.","x":"The decision here uses varied attributes, not labels."},{"t":"Discretionary access control","d":"The resource owner decides who gets access.","x":"Owners are not making the decision in this scenario."},null],"src":[["SY0-701 Study Guide (176 pp.), §4.5"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"A Windows domain user signs in once and then reaches file and application servers without entering credentials again. The authentication uses tickets issued by a key distribution center. Which protocol is this?","o":["RADIUS","SAML","Kerberos","LDAP"],"a":2,"e":"Kerberos is a single sign-on network authentication and authorization protocol used by Active Directory. A KDC issues tickets that clients present to application servers.","w":[{"t":"RADIUS","d":"A protocol where an AAA server validates credentials for network access such as Wi-Fi or VPN.","x":"It centralizes network access authentication; it is not the ticket-based protocol in a Windows domain."},{"t":"SAML","d":"An XML-based federation standard for exchanging authentication assertions between organizations.","x":"It is for federation across organizations, not ticketing from a KDC."},null,{"t":"LDAP","d":"A protocol for querying and modifying directory services.","x":"It reads and writes directory data; it does not issue tickets."}],"src":[["SY0-701 Study Guide (176 pp.), §4.10"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"A calendar app asks a user to let it read their contacts from another service. The user approves, and the app receives a limited access token without ever seeing the user's password. Which standard enables this?","o":["Kerberos","OAuth","RADIUS","LDAP"],"a":1,"e":"OAuth is an authorization framework that lets one site or app access limited information in a user's account at another site without sharing the password.","w":[{"t":"Kerberos","d":"A ticket-based protocol for single sign-on inside a network.","x":"It is not designed for delegating access between web apps and services."},null,{"t":"RADIUS","d":"A protocol for network access authentication.","x":"It controls network access, not delegated API access."},{"t":"LDAP","d":"A directory access protocol.","x":"It queries directories; it does not hand out limited tokens to apps."}],"src":[["SY0-701 Study Guide (176 pp.), §4.6"]]},
{"kind":"mcq","d":4,"obj":"4.6","text":"A user signs in from New York and, ten minutes later, the same account signs in from Singapore. The identity system flags the second sign-in as high risk. Which policy detected this?","o":["Impossible travel (risky login) policy","Time-of-day restriction","Account lockout","Network access control"],"a":0,"e":"An impossible travel policy tracks where sign-ins occur over time and flags those that could not be made by one person given the distance and time.","w":[null,{"t":"Time-of-day restriction","d":"Limits the hours an account can sign in.","x":"The detection is based on location over time, not hours."},{"t":"Account lockout","d":"Prevents sign-in for a period after repeated failures.","x":"The sign-ins did not fail."},{"t":"Network access control","d":"Checks device health before network access.","x":"It does not compare sign-in locations."}],"src":[["SY0-701 Study Guide (176 pp.), §4.7"]]},
{"kind":"mcq","d":4,"obj":"4.8","text":"An investigator must collect evidence from a running compromised server. According to the order of volatility, which should be captured first?","o":["Contents of the hard drive","Backup tapes in storage","Network topology documentation","System memory (RAM)"],"a":3,"e":"Evidence is captured from most to least volatile: CPU registers and cache, RAM, persistent storage, remote logs, physical configuration, then archival media. Memory is lost when power is removed.","w":[{"t":"Contents of the hard drive","d":"Data on persistent storage.","x":"It survives power loss and is collected after memory."},{"t":"Backup tapes in storage","d":"Archival media.","x":"Archival media is among the least volatile."},{"t":"Network topology documentation","d":"Records of physical configuration.","x":"These are stable and low on the volatility order."},null],"src":[["SY0-701 Study Guide (176 pp.), §12.7"]]},
{"kind":"mcq","d":4,"obj":"4.8","text":"A company expects a lawsuit and is told to preserve all emails and files that may be relevant, even though normal practice would delete them. What is this requirement?","o":["Chain of custody","Order of volatility","Legal hold","Data sanitization"],"a":2,"e":"A legal hold means information that may be relevant to a case must be preserved, which may include taking systems as evidence.","w":[{"t":"Chain of custody","d":"Documentation of who handled evidence and when.","x":"It tracks handling of evidence, not the duty to preserve it."},{"t":"Order of volatility","d":"The sequence for collecting evidence from most to least volatile.","x":"It guides collection order, not preservation obligations."},null,{"t":"Data sanitization","d":"Removing data from media so it cannot be recovered.","x":"This would destroy the evidence."}],"src":[["SY0-701 Study Guide (176 pp.), §12.6"]]},
{"kind":"mcq","d":4,"obj":"4.7","text":"When the SIEM raises a high-severity alert, a system automatically disables the affected account and blocks the source IP address according to a predefined playbook. Which tool performs this?","o":["SIEM","Security orchestration, automation, and response (SOAR)","User and entity behavior analytics","Threat intelligence platform"],"a":1,"e":"SOAR responds to alerts and takes remediation steps automatically using playbooks.","w":[{"t":"SIEM","d":"A tool for real-time collection, correlation, analysis, and reporting of events.","x":"It raises the alert; it is not the response tool."},null,{"t":"User and entity behavior analytics","d":"A tool that models normal and abnormal behavior of users and machines.","x":"It identifies unusual behavior but does not run response playbooks."},{"t":"Threat intelligence platform","d":"A tool that combines multiple threat intelligence feeds.","x":"It supplies intelligence rather than acting on alerts."}],"src":[["SY0-701 Study Guide (176 pp.), §12.8"]]},
{"kind":"mcq","d":4,"obj":"4.9","text":"An analyst needs records of which hosts talked to which others, on which ports, and how much data moved, without storing the content of each packet. Which data source provides this?","o":["NetFlow","Full packet capture","Syslog","Vulnerability scan report"],"a":0,"e":"NetFlow and IPFIX record metadata and statistics about network traffic rather than each frame. They help spot trends, anomalies, and rogue behavior.","w":[null,{"t":"Full packet capture","d":"Recording complete frames and payloads.","x":"It stores content, which the analyst does not want."},{"t":"Syslog","d":"A protocol for sending log messages from devices.","x":"It carries event messages, not traffic flow statistics."},{"t":"Vulnerability scan report","d":"Results of scanning hosts for known flaws.","x":"It lists weaknesses, not traffic conversations."}],"src":[["SY0-701 Study Guide (176 pp.), §12.5"]]},
{"kind":"mcq","d":5,"obj":"5.4","text":"A US company collects personal data from customers who live in the European Union. Which regulation applies to its handling of that data?","o":["HIPAA","GLBA","SOX","GDPR"],"a":3,"e":"GDPR applies to organizations that collect or process personal data of people in EU countries, including companies based in the United States.","w":[{"t":"HIPAA","d":"A US law protecting health information.","x":"The scenario concerns EU personal data, not US health records."},{"t":"GLBA","d":"A US law covering financial services.","x":"It is specific to financial institutions in the US."},{"t":"SOX","d":"A US law mandating risk assessments, internal controls, and audits for public company financial reporting.","x":"It is not a privacy law for EU data."},null],"src":[["SY0-701 Study Guide (176 pp.), §14.1"]]},
{"kind":"mcq","d":5,"obj":"5.5","text":"A cloud provider gives customers a report on how effectively its security controls operated over a period of several months. Which report is this?","o":["SOC 2 Type 1","SOC 3","SOC 2 Type 2","SOC 1"],"a":2,"e":"A SOC 2 report evaluates controls against trust services criteria. A Type 2 report assesses ongoing effectiveness over a period, while a Type 1 report assesses the design of the system.","w":[{"t":"SOC 2 Type 1","d":"A report on the design of controls at a point in time.","x":"It does not test operation over a period."},{"t":"SOC 3","d":"A less detailed report certifying compliance that can be freely distributed.","x":"It omits the detailed testing of a Type 2 report."},null,{"t":"SOC 1","d":"A report on controls relevant to a customer's financial statements.","x":"It is about financial reporting, not trust services criteria."}],"src":[["SY0-701 Study Guide (176 pp.), §14.2"]]},
{"kind":"mcq","d":5,"obj":"5.2","text":"Which metric measures the average time needed to restore a failed component or system to full operation?","o":["Mean time between failures","Mean time to repair (MTTR)","Mean time to failure","Recovery point objective"],"a":1,"e":"MTTR measures the time taken to correct a fault and restore full operation. It matters when setting the overall recovery time objective.","w":[{"t":"Mean time between failures","d":"The expected operating time between failures of a repairable system.","x":"It measures reliability, not repair time."},null,{"t":"Mean time to failure","d":"The expected lifetime of a non-repairable asset.","x":"It does not describe repair."},{"t":"Recovery point objective","d":"The maximum amount of data loss that is tolerable.","x":"It is about data loss, not duration of repair."}],"src":[["SY0-701 Study Guide (176 pp.), §15.3"]]},
{"kind":"mcq","d":5,"obj":"5.2","text":"After applying security controls to a system, the risk that remains is documented. What is this called?","o":["Residual risk","Inherent risk","Risk appetite","Risk transference"],"a":0,"e":"Residual risk is what is left after controls have been applied. Inherent risk is the level before controls.","w":[null,{"t":"Inherent risk","d":"The risk before any security controls are applied.","x":"The scenario is after controls."},{"t":"Risk appetite","d":"The amount of risk an organization is willing to take, usually on a project or institution-wide scale.","x":"It describes willingness, not remaining risk."},{"t":"Risk transference","d":"Assigning risk to another party, such as by insurance.","x":"It is a treatment method, not the remaining level."}],"src":[["SY0-701 Study Guide (176 pp.), §15.2"]]},
{"kind":"mcq","d":5,"obj":"5.5","text":"In a penetration test, the tester compromises a perimeter web server and then uses it to attack servers on the internal network that were unreachable from outside. What is this technique?","o":["Persistence","Reconnaissance","Cleanup","Pivoting"],"a":3,"e":"Pivoting uses a foothold on one host, such as a perimeter server, to bypass a network boundary and compromise systems on an internal network.","w":[{"t":"Persistence","d":"Maintaining the ability to reconnect to a compromised host.","x":"The tester is moving to other systems rather than keeping access."},{"t":"Reconnaissance","d":"Gathering information about the target before an attack.","x":"The tester has already compromised a host."},{"t":"Cleanup","d":"Removing tools and backdoors after testing.","x":"This occurs at the end, not when reaching new systems."},null],"src":[["SY0-701 Study Guide (176 pp.), §15.6"]]},
{"kind":"mcq","d":5,"obj":"5.1","text":"Which role is the senior executive ultimately responsible for the confidentiality, integrity, and availability of an information asset, and who typically decides its classification and the budget for its controls?","o":["Data custodian","Data processor","Data owner","Data protection officer"],"a":2,"e":"The data owner is a senior role with ultimate responsibility for the asset. The owner typically selects the steward and custodian and sets the resources for controls.","w":[{"t":"Data custodian","d":"Manages the systems that store data, including access control, encryption, and backups.","x":"The custodian carries out protection rather than owning accountability."},{"t":"Data processor","d":"An entity that handles data on a controller's instructions.","x":"This is an external role under privacy regulation."},null,{"t":"Data protection officer","d":"Oversees personal data and privacy compliance.","x":"The DPO oversees privacy, not all asset decisions."}],"src":[["SY0-701 Study Guide (176 pp.), §16.1"]]},
{"kind":"mcq","d":5,"obj":"5.3","text":"Two companies want a preliminary, relatively informal document stating their intent to work together that is not meant to be a binding contract. Which agreement fits?","o":["Service level agreement","Memorandum of understanding","Non-disclosure agreement","Business partnership agreement"],"a":1,"e":"An MOU expresses intent to cooperate and is usually informal and not legally binding.","w":[{"t":"Service level agreement","d":"A contract that sets the terms and measurable levels of a service.","x":"It is a contractual commitment, not a preliminary statement of intent."},null,{"t":"Non-disclosure agreement","d":"A legal basis for protecting confidential information.","x":"It protects information; it does not set out intent to collaborate."},{"t":"Business partnership agreement","d":"A formal agreement between companies, such as with resellers and solution providers.","x":"It is a formal partnership contract."}],"src":[["SY0-701 Study Guide (176 pp.), §15.4"]]},
{"kind":"mcq","d":5,"obj":"5.6","text":"A company sends simulated phishing emails to employees and gives extra training to those who click. Which security awareness practice is this?","o":["Phishing campaign","Capture the flag","Tabletop exercise","Penetration test"],"a":0,"e":"A phishing campaign tests and trains users using realistic simulated emails, measuring who is susceptible and providing follow-up education.","w":[null,{"t":"Capture the flag","d":"A gamified competition used in hacker training.","x":"It does not involve simulated emails to staff."},{"t":"Tabletop exercise","d":"A discussion-based scenario walk-through.","x":"No scenario discussion is involved."},{"t":"Penetration test","d":"An authorized simulated attack to find exploitable weaknesses.","x":"It tests systems, whereas this focuses on staff awareness."}],"src":[["SY0-701 Study Guide (176 pp.), §16.7"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"A developer wants each guess in an offline password-cracking attack to cost far more computation. Which design does that?","o":["Hash each password once with SHA-256 and no salt","Store passwords encrypted with a reversible cipher","Force users to change passwords every 30 days","Derive the stored value with PBKDF2 using a unique salt and a high iteration count"],"a":3,"e":"PBKDF2 applies a keyed hash (HMAC) repeatedly, once per iteration, so every guess costs the attacker that many operations. NIST SP 800-132 says the iteration count should be as large as acceptable performance allows.","w":[{"t":"Hash each password once with SHA-256 and no salt","d":"A single unsalted hash computation.","x":"One fast, unsalted hash is cheap to guess and lets attackers use precomputed tables."},{"t":"Store passwords encrypted with a reversible cipher","d":"Encryption that can be undone with the key.","x":"Anyone who obtains the key recovers every password, and it adds no per-guess cost."},{"t":"Force users to change passwords every 30 days","d":"A password aging policy.","x":"Aging does not raise the cost of each offline guess."},null],"src":[["NIST SP 800-132, PBKDF2","https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-132.pdf"],["SY0-701 Study Guide (176 pp.), §3.5"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"What is the purpose of the salt used with PBKDF2, according to NIST SP 800-132?","o":["To keep the password secret from the system","To make key derivation run faster","To let one password yield many different derived keys, so precomputed tables of keys are not practical","To encrypt the derived key"],"a":2,"e":"The salt is not secret. It makes each derived key unique, which stops an attacker from precomputing a table of keys for likely passwords. NIST requires the random part of the salt to be at least 128 bits.","w":[{"t":"To keep the password secret from the system","d":"Hiding a value from other parties.","x":"The salt is stored openly; it does not hide the password."},{"t":"To make key derivation run faster","d":"Reducing computation time.","x":"The iteration count, not the salt, sets the cost, and a higher count is slower."},null,{"t":"To encrypt the derived key","d":"Applying a cipher to protect a value.","x":"The salt is an input to derivation, not an encryption step."}],"src":[["NIST SP 800-132, PBKDF2","https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-132.pdf"]]},
{"kind":"mcq","d":1,"obj":"1.4","text":"Which description matches a stream cipher such as ChaCha20?","o":["It splits plaintext into fixed-size blocks and pads the last one","It combines the plaintext with a pseudorandom keystream, a bit or byte at a time","It uses a public key to encrypt and a private key to decrypt","It produces a fixed-length digest that cannot be reversed"],"a":1,"e":"A stream cipher XORs a keystream with the plaintext as it goes. The key and nonce combination must never be reused, because that can repeat the keystream.","w":[{"t":"It splits plaintext into fixed-size blocks and pads the last one","d":"The behavior of a block cipher, which works on blocks such as 128 bits.","x":"That describes ciphers like AES, not a stream cipher."},null,{"t":"It uses a public key to encrypt and a private key to decrypt","d":"Asymmetric encryption using a key pair.","x":"Stream ciphers are symmetric; one shared secret key is used."},{"t":"It produces a fixed-length digest that cannot be reversed","d":"A hash function.","x":"A cipher is meant to be decrypted; a hash is one-way."}],"src":[["Baeldung, stream vs block ciphers","https://www.baeldung.com/cs/stream-cipher-vs-block-cipher"],["SY0-701 Study Guide (176 pp.), §3.2"]]},
{"kind":"mcq","d":1,"obj":"1.3","text":"A monthly operating system patch is low risk, follows a documented procedure, and is pre-approved so no one reviews it each time. How is this type of change classified?","o":["Standard change","Normal change","Emergency change","Major change"],"a":0,"e":"A standard change is low-risk, well understood, and pre-authorized. Its risk is assessed when the procedure is created, not every time it runs.","w":[null,{"t":"Normal change","d":"A change that goes through the full assessment and authorization process each time.","x":"This change has been pre-approved and needs no review per run."},{"t":"Emergency change","d":"A change that must be assessed and implemented quickly to resolve a major incident.","x":"Nothing urgent is happening; this is routine."},{"t":"Major change","d":"A change with significant financial implications or high risk, which may need several levels of management approval.","x":"A routine patch is low risk."}],"src":[["ITSM.tools, change management","https://itsm.tools/why-what-change-management/"],["SY0-701 Study Guide (176 pp.), §14.5"]]},
{"kind":"mcq","d":1,"obj":"1.3","text":"A production database server is failing during a major outage, and the team must replace it now. The change goes through expedited approval by a small group of senior managers, with review afterward. Which type of change is this?","o":["Standard change","Normal change","Major change","Emergency change"],"a":3,"e":"Emergency changes must be implemented as soon as possible, so assessment and approval are expedited, often through a separate change authority, and a review follows.","w":[{"t":"Standard change","d":"A low-risk, pre-authorized, routine change.","x":"A server replacement during an outage is neither routine nor low risk."},{"t":"Normal change","d":"A change that is scheduled and goes through the full process.","x":"There is no time for the normal schedule and approval cycle."},{"t":"Major change","d":"A high-risk or high-cost change needing multiple approvals.","x":"The defining feature here is urgency, not cost or scale."},null],"src":[["ITSM.tools, change management","https://itsm.tools/why-what-change-management/"],["SY0-701 Study Guide (176 pp.), §14.5"]]},
{"kind":"mcq","d":2,"obj":"2.4","text":"An attacker sends a flood of frames with different forged source MAC addresses. Soon the switch forwards traffic for other hosts out every port, and the attacker captures it. Which control BEST limits this attack?","o":["DHCP snooping","Port mirroring","Port security that limits the number of MAC addresses learned on each port","WPA3"],"a":2,"e":"MAC flooding fills the switch's address table, and many switches then forward frames out all ports like a hub. Limiting the MAC addresses permitted per port denies the attacker table space.","w":[{"t":"DHCP snooping","d":"A switch feature that blocks DHCP server replies from untrusted ports.","x":"It addresses rogue DHCP servers, not a full MAC address table."},{"t":"Port mirroring","d":"Copying traffic from ports to an analysis device.","x":"It is a monitoring tool and does not stop table exhaustion."},null,{"t":"WPA3","d":"A Wi-Fi security standard.","x":"It protects wireless connections, not a wired switch's address table."}],"src":[["SecureW2, MAC flooding","https://securew2.com/blog/mac-flooding-attack"],["SY0-701 Study Guide (176 pp.), §5.4"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"A network team needs IPsec to both encrypt traffic and protect its integrity. Which IPsec protocol provides encryption?","o":["Authentication Header (AH)","Encapsulating Security Payload (ESP)","Internet Key Exchange (IKE)","Secure Socket Tunneling Protocol (SSTP)"],"a":1,"e":"ESP can provide confidentiality, data origin authentication, integrity, and anti-replay protection. AH provides integrity and authentication but no confidentiality.","w":[{"t":"Authentication Header (AH)","d":"An IPsec protocol that provides connectionless integrity and data origin authentication.","x":"AH does not encrypt anything."},null,{"t":"Internet Key Exchange (IKE)","d":"The protocol that authenticates hosts and negotiates keys and security associations.","x":"IKE sets up the keys; it does not itself encrypt the traffic."},{"t":"Secure Socket Tunneling Protocol (SSTP)","d":"A Microsoft VPN protocol that tunnels PPP over a TLS session.","x":"It is a different VPN protocol, not part of IPsec."}],"src":[["RFC 4303, ESP","https://rfc-editor.org/rfc/rfc4303"],["RFC 4302, AH","https://rfc-editor.org/rfc/rfc4302.html"],["SY0-701 Study Guide (176 pp.), §5.10"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"Two VPN gateways connect sites across an untrusted network. The entire original IP packet, header and payload, is encrypted and wrapped in a new IP header. Which IPsec configuration is this?","o":["ESP in tunnel mode","ESP in transport mode","AH in transport mode","IKE phase 1"],"a":0,"e":"In tunnel mode, ESP protects the whole inner IP packet, including its header, and a new outer header carries the gateways' addresses. This is used between gateways across an unsecure network.","w":[null,{"t":"ESP in transport mode","d":"ESP inserted after the original IP header, protecting the payload.","x":"The original IP header stays outside ESP's protection and is not wrapped in a new header."},{"t":"AH in transport mode","d":"AH inserted after the IP header to provide integrity and authentication.","x":"AH provides no encryption of the packet."},{"t":"IKE phase 1","d":"The stage where hosts authenticate and agree on keys to build a secure channel.","x":"It negotiates the channel; it does not encapsulate user packets."}],"src":[["RFC 4303, ESP","https://rfc-editor.org/rfc/rfc4303"],["SY0-701 Study Guide (176 pp.), §5.10"]]},
{"kind":"mcq","d":3,"obj":"3.2","text":"An employee plugs a personal router into a wall port, and it begins handing out its own IP addresses and a wrong default gateway to nearby computers. Which switch feature would stop this?","o":["Dynamic VLAN assignment","Network TAP","Port mirroring","DHCP snooping"],"a":3,"e":"With DHCP snooping, only trusted ports (toward legitimate servers) may send server messages such as offers and acknowledgements. Those arriving on untrusted access ports are dropped.","w":[{"t":"Dynamic VLAN assignment","d":"Assigning a device to a VLAN based on user identity, device type, location, or health.","x":"It places devices in VLANs; it does not drop rogue DHCP replies."},{"t":"Network TAP","d":"A device that copies traffic to a monitor port.","x":"It monitors traffic and does not block anything."},{"t":"Port mirroring","d":"Sending copies of frames to an analysis port.","x":"It cannot stop a rogue server."},null],"src":[["ComputingForGeeks, DHCP snooping","https://computingforgeeks.com/cisco-dhcp-snooping-configuration/"],["SY0-701 Study Guide (176 pp.), §5.4"]]},
{"kind":"mcq","d":4,"obj":"4.5","text":"What does DNSSEC provide?","o":["Encryption of DNS queries and responses","Blocking access to known malicious domains","Digital signatures that let a resolver verify DNS answers came from the zone owner and were not altered","Protection against denial-of-service floods"],"a":2,"e":"DNSSEC adds data origin authentication and data integrity to DNS responses, which helps against spoofing and cache poisoning. It does not encrypt queries; DNS over TLS or HTTPS is used for that.","w":[{"t":"Encryption of DNS queries and responses","d":"Hiding query contents from observers.","x":"DNSSEC signs data but does not provide confidentiality."},{"t":"Blocking access to known malicious domains","d":"DNS filtering.","x":"DNSSEC proves authenticity; it does not decide which domains are allowed."},null,{"t":"Protection against denial-of-service floods","d":"Mitigating traffic overload.","x":"DNSSEC does not directly prevent denial of service."}],"src":[["dnssec.net","https://dnssec.net/"],["SY0-701 Study Guide (176 pp.), §11.1"]]},
{"kind":"mcq","d":4,"obj":"4.5","text":"A laptop with outdated antivirus and missing patches connects to the corporate network and is automatically placed in an isolated VLAN that can reach only update servers. Which technology did this?","o":["Intrusion detection system","Network access control (NAC)","Web content filter","Reverse proxy"],"a":1,"e":"NAC checks a device's health, such as OS patch level and antivirus status, before granting access. Noncompliant devices can be quarantined and given access only to remediation resources.","w":[{"t":"Intrusion detection system","d":"A sensor that detects malicious traffic and raises alerts.","x":"It alerts but does not assign devices to a quarantine network."},null,{"t":"Web content filter","d":"A tool that blocks websites by URL, category, or reputation.","x":"It controls browsing, not device admission to the network."},{"t":"Reverse proxy","d":"A server that listens for client requests to protect backend servers.","x":"It fronts servers and does not assess connecting devices."}],"src":[["Purple, NAC posture assessment","https://www.purple.ai/en-us/guides/nac-posture-assessment-ensuring-managed-device-compliance-before-network-access"],["SY0-701 Study Guide (176 pp.), §9.4"]]},
